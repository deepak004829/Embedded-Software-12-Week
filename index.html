<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--sf:#0d0d0d;--sf2:#171717;--ln:#262626;--ink:#f4f1ea;--mu:#8e8b84;--cu:#d8b56a;--ok:#34d399;--bd:#ff5f5f;--wn:#f2c14e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h3,.big{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;margin:0;letter-spacing:-.01em}h3{font-size:17px}
#app{max-width:860px;margin:0 auto;padding:16px 16px 80px}
.big{font-size:46px;font-weight:800;line-height:1;color:var(--cu)}.big small{font-size:17px;font-weight:600;color:var(--ink);margin-left:8px}
.mu{color:var(--mu)}.sm{font-size:13px}.grow{flex:1;min-width:0}p{margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav{display:flex;gap:4px;margin:14px 0;border-bottom:1px solid var(--ln);padding-bottom:8px}
nav button{border:0;background:none;color:var(--mu);padding:8px 16px;border-radius:99px}nav button.on{background:var(--ink);color:#000;font-weight:600}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}.warn{border-color:var(--cu)}
button,input,.btn{font:inherit;color:var(--ink);background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:7px 12px;cursor:pointer;text-decoration:none}
button:hover,.btn:hover{border-color:var(--cu)}:is(button,input,a,summary):focus-visible{outline:2px solid var(--cu);outline-offset:2px}
.pri{background:var(--ink);color:#000;font-weight:600;border-radius:99px}.ok{background:var(--ok);color:#000;border-color:var(--ok)}.cu{background:var(--cu);color:#000;border-color:var(--cu)}
.sbtn{padding:3px 10px;font-size:13px}
.tag{font-size:12px;border:1px solid var(--ln);border-radius:6px;padding:1px 8px;white-space:nowrap;color:var(--mu);text-decoration:none;background:none}.Easy{color:var(--ok)}.Medium{color:var(--wn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.st{border:1px solid var(--ln);border-radius:14px;padding:10px 12px}.st b{display:block;font:800 30px "Bricolage Grotesque",sans-serif}.st span{font-size:13px;color:var(--mu)}
.bar{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.pr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 4px;border-top:1px solid var(--ln)}.pr.dn .pn{text-decoration:line-through;color:var(--mu)}.pn{flex:1;min-width:160px;color:var(--ink);font-weight:600}
.star{border:0;background:none;font-size:20px;color:var(--mu);padding:0 4px}.star.on{color:var(--cu)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--cu);padding:0}
.q{border-top:1px solid var(--ln);padding:8px 0}.ans{border-left:3px solid var(--cu);background:#231d10;padding:8px 12px;border-radius:0 10px 10px 0}
.trap b{color:var(--bd)}mark{background:rgba(216,181,106,.28);color:var(--ink);padding:0 3px;border-radius:4px}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}svg{width:100%;height:auto;display:block}
.pat{border-left:3px solid var(--cu);padding:2px 10px;margin:8px 0;color:var(--mu);font-size:14px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mu)}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}

atrix Zeroes","Matrix & Math","Medium","AMFPB"],["game-of-life","Game of Life","Matrix & Math","Medium",""],["happy-number","Happy Number","Matrix & Math","Easy","AGMB"],["plus-one","Plus One","Matrix & Math","Easy","AGMFB"],["sqrtx","Sqrt(x)","Matrix & Math","Easy","AGMFB"],["count-primes","Count Primes","Matrix & Math","Medium",""],["spiral-matrix-ii","Spiral Matrix II","Matrix & Math","Medium",""],["add-binary","Add Binary","Matrix & Math","Easy","AMFB"],["reverse-integer","Reverse Integer","Matrix & Math","Medium","AGMFB"],["lru-cache","LRU Cache","Design","Medium","AGMFPBDU"],["insert-delete-getrandom-o1","Insert Delete GetRandom O(1)","Design","Medium","AGMFB"],["design-browser-history","Design Browser History","Design","Medium",""],["snapshot-array","Snapshot Array","Design","Medium",""],["design-circular-deque","Design Circular Deque","Design","Medium",""],["design-underground-system","Design Underground System","Design","Medium",""],["stock-price-fluctuation","Stock Price Fluctuation","Design","Medium",""],["random-pick-with-weight","Random Pick with Weight","Design","Medium","AGMFB"],["flatten-nested-list-iterator","Flatten Nested List Iterator","Design","Medium","AGMFB"],["design-hashmap","Design HashMap","Design","Easy","AGMFB"],["peeking-iterator","Peeking Iterator","Design","Medium","AGMF"],["implement-rand10-using-rand7","Implement Rand10() Using Rand7()","Design","Medium","AGMFB"],["single-number","Single Number","Bit Tricks","Easy","AMPBD"],["number-of-1-bits","Number of 1 Bits","Bit Tricks","Easy",""],["counting-bits","Counting Bits","Bit Tricks","Easy",""],["reverse-bits","Reverse Bits","Bit Tricks","Easy",""],["missing-number","Missing Number","Bit Tricks","Easy",""],["power-of-two","Power of Two","Bit Tricks","Easy",""],["sum-of-two-integers","Sum of Two Integers","Bit Tricks","Medium",""],["single-number-ii","Single Number II","Bit Tricks","Medium",""],["bitwise-and-of-numbers-range","Bitwise AND of Numbers Range","Bit Tricks","Medium",""],["power-of-four","Power of Four","Bit Tricks","Easy",""],["hamming-distance","Hamming Distance","Bit Tricks","Easy",""],["maximum-xor-of-two-numbers-in-an-array","Maximum XOR of Two Numbers in an Array","Bit Tricks","Medium","AGMF"],["utf-8-validation","UTF-8 Validation","Bit Tricks","Medium",""]],"L":[{"id":"t1","t":"C++ classes and RAII","g":"C++","k":"**RAII**: acquire in the constructor, release in the destructor, so cleanup runs on every path, even with exceptions;Members are constructed in **declaration order** and destroyed in **reverse** order;**Rule of zero, three and five**: if you manage a resource define (or delete) copy and move together, or better wrap it in a type that does","m":"Writing a destructor but forgetting copy construction and assignment: two objects free the same memory.","a":"Explain RAII with a file or mutex example and the rule of five.","y":"C++ constructors destructors RAII rule of five Cherno","s":"C++ constructors destructors RAII rule of three five"},{"id":"t2","t":"Inheritance and virtual functions","g":"C++","k":"**virtual** functions dispatch through the **vtable** via a hidden vptr in each object;A base class meant for polymorphism needs a **virtual destructor**, or deleting through a base pointer is undefined;**Slicing**: copying a derived object into a base object by value cuts off the derived part","m":"Calling virtual functions in constructors or destructors: they resolve to the class being built, not the derived override.","a":"How do virtual functions work? What is a pure virtual function and what does override add?","y":"C++ virtual functions vtable vptr explained","s":"C++ virtual functions vtable virtual destructor"},{"id":"t3","t":"Smart pointers, move, templates","g":"C++","k":"**unique_ptr** is sole ownership (move-only), **shared_ptr** is reference-counted, **weak_ptr** is a non-owning observer that breaks cycles;**std::move** only casts to an rvalue and the move constructor does the transfer: mark moves **noexcept**;**Templates** are instantiated at compile time per type, they generate code and are not runtime polymorphism","m":"Cycles of shared_ptr: reference counts never reach zero and the memory leaks.","a":"When do you use each smart pointer, and what does move semantics buy you?","y":"C++ smart pointers move semantics Cherno","s":"C++ smart pointers move semantics std::move"},{"id":"t4","t":"STL and iterators","g":"C++","k":"**vector** is contiguous with amortised O(1) push_back and reallocation **invalidates iterators**, **list** uses nodes, **map** is a balanced tree O(log n), **unordered_map** is a hash table with average O(1);Prefer **algorithms** (sort, find_if, lower_bound, accumulate) over hand-written loops;**reserve()** avoids repeated reallocations when the size is known","m":"Erasing while iterating and then using the invalidated iterator: use the iterator returned by erase.","a":"Choose a container for a problem and justify the complexity.","y":"C++ STL containers internals iterator invalidation","s":"C++ STL containers complexity iterator invalidation"},{"id":"t5","t":"Lambdas, casts, references","g":"C++","k":"A **lambda** is an unnamed function object: capture by **value** or by **reference**;Use **static_cast** for well-defined conversions, **reinterpret_cast** only for raw reinterpretation, and avoid C-style casts;A **reference** is an alias that must be bound at creation, and **const reference** avoids copies for read-only parameters","m":"Capturing locals by reference in a lambda that runs after the function returns: dangling references.","a":"Write a callback with std::function and explain capture lifetime.","y":"C++ lambda captures casts constexpr explained","s":"C++ lambda capture casts references constexpr"},{"id":"t8","t":"Kernel vs user space, syscalls","g":"Operating systems","k":"User code cannot touch hardware: it asks the kernel through a **system call**, a controlled switch into **kernel mode**;**Interrupts** come from hardware, **exceptions** from the running instruction, **traps** are deliberate (syscalls, breakpoints);Syscalls cost more than function calls: batch I/O and use **buffers**","m":"Treating one-byte reads and writes as free: each call crosses into the kernel.","a":"What happens when you call read()? How does a system call work?","y":"Operating system kernel user mode system calls Neso Academy","s":"operating system system call kernel mode user mode"},{"id":"t9","t":"Processes","g":"Operating systems","k":"**fork** clones the process with **copy-on-write** memory, **exec** replaces the program image, **wait** reaps the child;A **zombie** is a finished child that was not waited for and an **orphan** is adopted by init;File descriptors are inherited across fork, so pipes need the **unused ends closed**","m":"Forgetting to close unused pipe ends: the reader never sees EOF and hangs.","a":"Explain fork and exec, zombie versus orphan, and how a shell implements pipes.","y":"Operating system processes fork exec wait Jacob Sorber","s":"operating system process states fork exec zombie"},{"id":"t10","t":"Threads and context switching","g":"Operating systems","k":"Threads share **address space, heap and file descriptors** but have their own **stack and registers**;A **context switch** saves registers and switches stacks, and switching processes also changes the address space (TLB cost);Linux pthreads are **1:1** kernel threads scheduled across cores","m":"Assuming thread creation is free: thousands of threads waste memory and scheduler time, so use a pool.","a":"Process versus thread, what is saved in a context switch, user versus kernel threads.","y":"Operating system threads context switch explained","s":"operating system threads vs process context switch"},{"id":"t11","t":"CPU scheduling","g":"Operating systems","k":"**Round Robin** gives fairness with a time slice, **SJF** minimises average wait but needs burst estimates, and **priority** scheduling can **starve** low-priority tasks (fix: aging);Linux **CFS** runs the task with the smallest virtual runtime and real-time classes (**SCHED_FIFO and RR**) preempt normal tasks;**Priority inversion** is fixed with priority inheritance","m":"A long Round Robin quantum: it degenerates into FCFS and hurts responsiveness.","a":"Compare the algorithms, compute waiting time, explain priority inversion.","y":"CPU scheduling algorithms Gantt chart Gate Smashers","s":"CPU scheduling algorithms FCFS SJF round robin priority"},{"id":"t12","t":"Synchronization primitives","g":"Operating systems","k":"A **race condition** happens when correctness depends on timing: protect shared data with a **mutex** or **atomic**;**Mutex** is an ownership lock, **semaphore** is a counter for signalling or resources, **spinlock** busy-waits for very short holds;Keep **critical sections short** and unlock on every path (use RAII)","m":"Locking some accesses but not all: one unprotected access is still a data race.","a":"Mutex versus semaphore, implement producer-consumer, find the race in this code.","y":"Operating system synchronization mutex semaphore Neso Academy","s":"operating system synchronization mutex semaphore race condition"},{"id":"t13","t":"Deadlocks","g":"Operating systems","k":"Deadlock needs four things: **mutual exclusion, hold and wait, no preemption, circular wait**;Prevent it with a global **lock order**, taking all locks at once (scoped_lock), or **timeouts and try_lock**;**Livelock** (threads keep reacting) and **starvation** (never scheduled) are different failures","m":"Locking A then B in one function and B then A in another.","a":"Explain the four conditions and fix this two-lock deadlock.","y":"Deadlock Banker's algorithm Coffman conditions Gate Smashers","s":"operating system deadlock Banker's algorithm"},{"id":"t15","t":"Virtual memory and paging","g":"Operating systems","k":"The **MMU** translates virtual to physical addresses using **page tables**, and the **TLB** caches recent translations;A **page fault** is not always an error: demand paging loads the page on first touch and then retries the instruction;Virtual memory gives **isolation, protection** and a flexible layout, plus copy-on-write and mmap","m":"Assuming malloc'd memory is physically allocated at once: pages appear on first touch.","a":"Explain address translation and what happens on a page fault.","y":"Virtual memory paging TLB page fault Neso Academy","s":"operating system virtual memory paging TLB page fault"},{"id":"t16","t":"Page replacement and mmap","g":"Operating systems","k":"**LRU** approximates optimal, **FIFO** can show **Belady's anomaly** (more frames, more faults), and **Clock** is a cheap LRU approximation;**Thrashing** is constant swapping because working sets exceed RAM;**mmap** maps files or anonymous memory into the address space and the kernel pages it in on demand","m":"Ignoring the working set: adding more processes can make the whole system slower.","a":"Simulate page replacement for a reference string and count the faults.","y":"Page replacement algorithms LRU FIFO Optimal Gate Smashers","s":"operating system page replacement algorithms thrashing"},{"id":"t23","t":"Mutexes and locks","g":"Concurrency","k":"Lock **short sections**, pair lock and unlock (use RAII), and use a fixed **lock order** for several locks;**Reader-writer locks** allow many readers and one writer but can starve either side;**Contention** serialises threads: shard data or use per-thread state","m":"Holding a lock while doing I/O or calling unknown code.","a":"Thread-safe bank transfer: how do you avoid deadlock?","y":"pthread mutex lock contention explained","s":"pthread mutex rwlock spinlock lock granularity"},{"id":"t24","t":"Condition variables","g":"Concurrency","k":"Wait on a **condition variable** with a mutex **in a while loop** that rechecks the predicate (spurious wakeups);Change the predicate **under the mutex** and then notify;A **bounded buffer** needs not_full and not_empty plus a closed flag for shutdown","m":"Using if instead of while around wait: spurious wakeups break the logic.","a":"Implement a blocking queue with a mutex and condition variables.","y":"Condition variables producer consumer pthread cond wait","s":"pthread condition variable producer consumer spurious wakeup"},{"id":"t25","t":"Semaphores and classic problems","g":"Concurrency","k":"A **counting semaphore** allows N concurrent users and a **binary** one signals;**Dining philosophers** is solved by ordering resources or limiting diners, and **readers-writers** needs a fairness policy;**Starvation** means some thread never makes progress even though the system does","m":"Every philosopher picking up the left fork first: instant deadlock.","a":"Solve dining philosophers and explain starvation.","y":"Semaphores classic synchronization problems dining philosophers","s":"semaphore readers writers dining philosophers solution"},{"id":"t27","t":"Thread pools and C++ concurrency","g":"Concurrency","k":"A **thread pool** reuses workers and a task queue: size it near the **core count** for CPU-bound work;**future, promise and packaged_task** return results and exceptions from tasks;Shutdown means **stop flag, notify all, join**","m":"Submitting tasks after shutdown or forgetting to join: hangs or crashes at exit.","a":"Implement a thread pool with submit() returning a future.","y":"C++ thread pool implementation condition variable","s":"C++ thread pool implementation std::thread"},{"id":"t29","t":"Network models and Ethernet","g":"Networking","k":"TCP/IP layers are **link, internet, transport, application** and each layer **encapsulates** the one above with its own header;**Ethernet frames** use MAC addresses: a **switch** learns MACs, a **router** forwards by IP, and **ARP** maps IP to MAC;**MTU** (1500) limits frame payload and **MSS** limits TCP payload","m":"Mixing up layers: a switch is layer 2, a router layer 3 and TCP layer 4.","a":"OSI versus TCP/IP, what happens when you type a URL, what is ARP?","y":"Computer networks OSI TCP/IP layers Practical Networking","s":"computer networks OSI TCP/IP model encapsulation Ethernet ARP"},{"id":"t31","t":"TCP and UDP","g":"Networking","k":"**TCP** gives reliable ordered delivery: **handshake, sequence numbers, ACKs, retransmission, flow control, congestion control**;**UDP** is connectionless and cheap: good for real-time, DNS and telemetry;**TIME_WAIT** protects against stray packets after close","m":"Assuming one send equals one recv: TCP is a byte stream with no message boundaries.","a":"TCP versus UDP, the three-way handshake, how congestion control works.","y":"TCP three way handshake flow control congestion control","s":"TCP handshake flow control congestion control slow start"},{"id":"t34","t":"Application protocols: HTTP, TLS and MQTT","g":"Networking","k":"**HTTP** is request and response, and **TLS** adds encryption, integrity and authentication through certificates;**MQTT** is lightweight publish and subscribe with QoS 0, 1 and 2, and **CoAP** is UDP-based for constrained devices;**lwIP** is a small TCP/IP stack for microcontrollers","m":"QoS 2 everywhere: it costs extra round trips and energy.","a":"MQTT versus HTTP for IoT, explain the TLS handshake.","y":"HTTP TLS handshake explained MQTT IoT","s":"HTTP TLS handshake MQTT QoS CoAP"},{"id":"t36","t":"How to approach a system design interview","g":"System design","k":"Follow a **framework**: clarify requirements, estimate scale, define APIs, model data, draw the high-level design, then deep dive into bottlenecks;**Non-functional** requirements (latency, availability, consistency, durability) drive the design more than features;Know the **numbers**: a day is 86,400 s, 1 million requests a day is about 12 QPS, memory is far faster than SSD","m":"Jumping to boxes and databases before clarifying requirements and scale.","a":"Design X: the interviewer expects you to drive the discussion and justify trade-offs.","y":"System design interview framework Gaurav Sen","s":"system design interview framework back of the envelope estimation"},{"id":"t37","t":"Scaling blocks: load balancers, caching, CDN","g":"System design","k":"**Horizontal scaling** adds machines behind a **load balancer** (L4 by IP and port, L7 by HTTP content);**Cache-aside**: read the cache, on a miss read the database and fill the cache. **Write-through** updates both and **write-back** delays DB writes;Guard against a **cache stampede** with locking, request coalescing or jittered TTLs","m":"Adding a cache without an invalidation plan: stale data becomes a bug.","a":"Where would you add a cache, what do you cache and how do you invalidate it?","y":"Load balancer caching CDN system design ByteByteGo","s":"system design load balancer caching CDN consistent hashing"},{"id":"t38","t":"Databases: SQL vs NoSQL, indexing, replication, sharding","g":"System design","k":"Pick **SQL** for relations, transactions and ad-hoc queries and **NoSQL** for scale-out, flexible schema and simple access patterns;An **index** speeds reads (B-tree) at the cost of writes and space, while **LSM trees** favour writes;**Replication** gives availability and read scaling, **sharding** splits data by key so choose a key that avoids hotspots","m":"Sharding by a skewed key such as country: one shard gets all the load.","a":"Which database would you pick for this workload, and how would you scale it?","y":"Database system design SQL vs NoSQL sharding replication","s":"system design database sharding replication indexing SQL NoSQL"},{"id":"t39","t":"Messaging and asynchronous processing","g":"System design","k":"A **queue** decouples producers from consumers and smooths spikes, while **pub/sub** fans out to many subscribers;**At-least-once** delivery means duplicates, so make consumers **idempotent** with idempotency keys;Use **retries with exponential backoff** and a **dead-letter queue** for poison messages","m":"Assuming exactly-once delivery: design for duplicates and out-of-order messages.","a":"How do you make this pipeline reliable and handle failures or duplicates?","y":"Kafka message queue system design explained","s":"message queue Kafka delivery semantics idempotency dead letter"},{"id":"t40","t":"Consistency, availability and distributed basics","g":"System design","k":"**CAP**: during a network partition you must choose **consistency** or **availability**;**Quorum**: with N replicas, writing to W and reading from R with **R + W > N** guarantees overlap with the latest write;**Raft** elects a leader and replicates a log by majority vote, so it tolerates minority failures","m":"Quoting CAP as pick any two: partitions happen, so the real choice is consistency versus availability during one.","a":"What happens to your design when a node or a network link fails?","y":"CAP theorem consistency models Raft explained","s":"CAP theorem PACELC consistency quorum Raft"},{"id":"t41","t":"API design, rate limiting and security basics","g":"System design","k":"Design **resource-oriented REST** APIs with **cursor pagination** and make **PUT and DELETE idempotent**;**Token bucket** allows bursts at a steady refill rate and **sliding window** is smoother but costs more memory;**JWT** is a signed stateless token and **OAuth2** delegates access without sharing passwords","m":"Offset pagination on large changing tables: duplicates and slow queries, so use cursors.","a":"Design the API for this service: endpoints, pagination, errors, idempotency and auth.","y":"API design REST gRPC rate limiting JWT OAuth","s":"API design pagination idempotency rate limiting JWT OAuth2"},{"id":"t42","t":"Design a URL shortener","g":"System design","k":"Estimate: **read-heavy** (about 100 to 1), around 500 bytes per URL, so five years is a few TB;Generate keys with a **base62 counter** (distributed ID ranges) or a **hash with a collision check**;Serve redirects from a **cache**, store mappings in a **key-value or SQL store**, count analytics asynchronously","m":"A random hash with no collision handling, or a single counter as a bottleneck.","a":"The classic first system design question: be ready for 40 minutes of follow-ups.","y":"Design URL shortener system design interview","s":"system design URL shortener key generation base62"},{"id":"t43","t":"Design a rate limiter","g":"System design","k":"Place limits at the **API gateway** keyed by user or IP and return **429** with **Retry-After**;Use **Redis atomic operations** (INCR with TTL or a Lua script) so counters stay correct across servers;Decide **fail-open or fail-closed** when the limiter store is down","m":"Read-then-write counters without atomicity: two servers both allow the request.","a":"Design a rate limiter for 1 million requests per second across data centres.","y":"Design rate limiter system design interview","s":"system design rate limiter token bucket redis"},{"id":"t44","t":"Design a distributed cache","g":"System design","k":"**Consistent hashing** puts keys and nodes on a ring so adding or removing a node moves only about 1/N of the keys;**Virtual nodes** even out the load and allow weighted capacity;Handle **hot keys** with replication, local caches or key splitting","m":"Simple modulo hashing: adding a node remaps almost every key and empties the cache.","a":"Design a distributed cache: partitioning, replication, eviction and failure handling.","y":"Design distributed cache consistent hashing system design","s":"system design distributed cache consistent hashing eviction"},{"id":"t46","t":"Design a news feed","g":"System design","k":"**Fan-out on write** pre-computes each follower's timeline (fast reads, expensive for celebrities) and **fan-out on read** builds it on request;Use a **hybrid**: push for normal users, pull for celebrities and merge at read time;Store timelines as **lists of post ids in cache**, hydrate posts separately and use **cursor pagination**","m":"Pushing a celebrity post to millions of followers synchronously.","a":"Design Twitter's home timeline for 300 million users, including celebrities.","y":"Design news feed Twitter timeline system design","s":"system design news feed fan-out on write read celebrity problem"},{"id":"t47","t":"Design a chat system","g":"System design","k":"Use **WebSockets** for persistent connections with a **gateway** layer that tracks which user is on which server;Give each message a **per-conversation sequence number** to order and deduplicate, with **ack and retry** for reliability;For offline users **persist** the message and send a **push notification**","m":"Relying on client timestamps for ordering: clocks differ, so use server sequence numbers.","a":"Design WhatsApp: one-to-one and group chat, delivery guarantees and offline users.","y":"Design chat system WhatsApp system design","s":"system design chat application websocket message ordering"},{"id":"t50","t":"SOLID and clean OOP design","g":"Low-level design","k":"**Single responsibility**: one reason to change per class, and **open/closed**: extend with new classes instead of editing old ones;**Liskov**: subclasses must work wherever the base is expected, and **dependency inversion**: depend on abstractions;Start LLD by listing **entities, responsibilities and relationships**, then sketch classes and interfaces","m":"Deep inheritance trees: prefer composition and small interfaces.","a":"Design this system with classes: what are the entities, interfaces and extension points?","y":"SOLID principles C++ examples Christopher Okhravi","s":"SOLID principles C++ low level design"},{"id":"t51","t":"Design patterns and low-level design in C++","g":"Low-level design","k":"**Observer** decouples producers and subscribers, **Strategy** swaps algorithms, **State** models modes, **Factory** hides construction;**Dependency inversion**: depend on interfaces so hardware can be mocked in tests;Prefer **composition over inheritance**","m":"Over-engineering with patterns for a small problem: choose the simplest design that meets the requirements.","a":"Design a parking lot or elevator in C++ with classes and interfaces.","y":"Design patterns C++ Observer Strategy Factory Singleton","s":"design patterns Singleton Observer Factory Strategy C++"},{"id":"t52","t":"LLD: Parking lot","g":"Low-level design","k":"Identify the **entities**: ParkingLot, Level, Spot (by size), Vehicle, Ticket, Payment;Use **Strategy** for pricing and spot allocation and **Factory** for vehicles;Keep **allocation thread-safe**: a lock per level or an atomic spot state","m":"Putting all logic in ParkingLot: spot assignment, pricing and payment belong to separate classes.","a":"Design a parking lot in C++: classes, methods and how to add a new vehicle type.","y":"Parking lot low level design interview","s":"low level design parking lot class diagram"},{"id":"t53","t":"LLD: Elevator system","g":"Low-level design","k":"Model each car as a **state machine** with a sorted set of **stops**;**SCAN or LOOK** serves requests in the current direction before reversing, like disk scheduling;Separate **Controller** (assigns requests), **Elevator** (executes) and **Request**, with a strategy to pick the car","m":"Giving every elevator direct access to all requests: use one controller and per-car queues.","a":"Design an elevator system for a 50-floor building with 4 elevators.","y":"Elevator system low level design interview","s":"low level design elevator system state machine scheduling"},{"id":"t54","t":"LLD: LRU cache and thread-safe designs","g":"Low-level design","k":"**LRU** is a hash map to list nodes plus a doubly linked list for recency, giving **O(1)** get and put;Make the policy **pluggable** (LRU, LFU, FIFO) behind an interface and keep storage generic with **templates**;For concurrency start with one mutex, then **shard** the cache or use a **shared_mutex** for read-heavy loads","m":"Returning references into the cache that eviction can invalidate: return copies or shared_ptr.","a":"Implement an LRU cache class with get and put and discuss thread safety and extensions such as TTL and LFU.","y":"LRU cache implementation low level design C++","s":"LRU cache design hashmap doubly linked list thread safe"},{"id":"t55","t":"LLD: Booking system and concurrency control","g":"Low-level design","k":"Prevent **double booking** with a **seat hold** (temporary lock with expiry) and an atomic compare-and-set or a unique constraint;**Pessimistic locking** locks rows up front and **optimistic locking** checks a version at commit and retries;Model the booking as a **state machine** (held, paid, confirmed, expired) with **idempotent** payment callbacks","m":"Check-then-book without atomicity: two users get the same seat.","a":"Design a ticket booking system: how do you prevent two users booking the same seat?","y":"BookMyShow movie ticket booking low level design","s":"low level design movie ticket booking double booking concurrency"},{"id":"t57","t":"SQL essentials for interviews","g":"Databases","k":"**INNER JOIN** keeps matches and **LEFT JOIN** keeps all left rows, while **WHERE** filters rows and **HAVING** filters groups;**Window functions** (ROW_NUMBER, RANK, SUM OVER) compute per-row results without collapsing rows;Top N per group: **ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...)** then filter","m":"Filtering a LEFT JOIN's right table in WHERE: it turns the join into an inner join.","a":"Write a query: second highest salary, top 3 per department, users with consecutive logins.","y":"SQL interview questions joins window functions","s":"SQL interview questions joins window functions top N per group"},{"id":"t58","t":"Indexes, query plans and transactions","g":"Databases","k":"A **composite index** (a, b) helps filters on a or on a and b, not b alone (**leftmost prefix**);**ACID** means atomicity, consistency, isolation, durability, and higher **isolation** prevents more anomalies at more cost;**MVCC** lets readers see a snapshot without blocking writers","m":"Indexing every column: writes slow down and the planner may still ignore the index.","a":"Why is this query slow and what would you change? Explain isolation levels.","y":"Database indexing transactions isolation levels CMU","s":"database indexes B-tree transactions isolation levels MVCC"},{"id":"t59","t":"Replication, sharding and distributed transactions","g":"Databases","k":"**Replication lag** causes stale reads: route to the leader or use session tokens for read-your-writes;**2PC** gives atomic commits across shards but blocks if the coordinator fails, while **sagas** use compensating actions;The **outbox pattern** writes the event and the data in one local transaction and then publishes reliably","m":"Assuming failover is instant and lossless: replication is often asynchronous and can lose acknowledged writes.","a":"How do you keep data consistent across multiple services or shards?","y":"Distributed database replication sharding 2PC saga","s":"database replication sharding two phase commit saga outbox"},{"id":"t78","t":"Behavioural interview prep","g":"Behavioural","k":"**STAR**: Situation, Task, Action, Result (with a number);Prepare **six stories**: bug, owned project, conflict, failure, deadline, fast learning;Keep answers **90 seconds to 2 minutes**","m":"Saying we for everything: interviewers need to know what you personally did.","a":"Tell me about yourself, a conflict, a failure, your proudest project.","y":"Behavioral interview STAR method stories Amazon","s":"behavioral interview STAR method examples software engineer"},{"id":"t79","t":"Resume and LinkedIn for experienced candidates","g":"Behavioural","k":"Bullets follow **Built X using Y, achieving Z** (with a number);Target **15 companies** across tiers and track them in a table;**Referrals** beat cold applications","m":"Listing duties instead of results: numbers make bullets credible.","a":"Walk me through your resume: the interviewer picks what to probe.","y":"Software engineer resume tips experienced","s":"software engineer resume tips experienced ATS referral"},{"id":"t80","t":"Project deep-dive for 3 years of experience","g":"Behavioural","k":"Prepare each project as a **mini case study**: context, constraints, architecture, your contribution, trade-offs, results with numbers;Expect **why and what-if** follow-ups: alternatives, failure modes, scaling;Know every line on your resume well enough to discuss for **10 minutes**","m":"Describing the team's work instead of your own contribution.","a":"Walk me through the most complex system you built and the hardest bug you fixed.","y":"How to explain your projects in a software interview","s":"software engineer interview project deep dive questions"}],"Q":[{"id":"q136","t":"t1","q":"What is the output order?","a":"A B C ~C ~B ~A. Members are constructed in declaration order before the constructor body runs, and destroyed in reverse order after the destructor body."},{"id":"q21","t":"t1","q":"What is RAII?","a":"Resource lifetime is tied to object lifetime: acquire in the constructor, release in the destructor, so cleanup runs on every exit path."},{"id":"q22","t":"t1","q":"What are the rules of three, five and zero?","a":"If you define a destructor, copy constructor or copy assignment, define all three (five with move). Better: use RAII members so you define none."},{"id":"q138","t":"t2","q":"What happens if you call a virtual function from a constructor?","a":"Virtual dispatch resolves to the class currently being constructed, not the derived override, because the derived part does not exist yet. The same applies in destructors. Calling a pure virtual function there is undefined and usually aborts."},{"id":"q23","t":"t2","q":"How do virtual functions work?","a":"Each polymorphic object holds a vptr to its class vtable of function pointers; calls are resolved through it at run time."},{"id":"q24","t":"t2","q":"Why do base classes need virtual destructors?","a":"Deleting a derived object through a base pointer without one is undefined behaviour and skips the derived destructor."},{"id":"q139","t":"t3","q":"What is the diamond problem and how does virtual inheritance solve it?","a":"Two classes derive from the same base and a fourth derives from both, giving two copies of the base and ambiguous members. Virtual inheritance makes the most-derived class construct one shared base subobject, at the cost of extra indirection (a virtual base pointer)."},{"id":"q140","t":"t3","q":"What is the cost of a virtual call and when would you avoid it in firmware?","a":"An extra load of the vptr and an indirect call through the vtable, which blocks inlining and can mispredict; every object carries a vptr. In hot paths or tiny MCUs use templates (CRTP), function pointers chosen at init, or plain structs. Elsewhere virtual is fine."},{"id":"q26","t":"t3","q":"unique_ptr vs shared_ptr vs weak_ptr?","a":"unique_ptr: sole ownership, no overhead. shared_ptr: reference-counted shared ownership. weak_ptr: non-owning observer that breaks cycles."},{"id":"q148","t":"t5","q":"What is the One Definition Rule?","a":"Every non-inline function and variable must be defined exactly once in the program, and inline functions, classes and templates must have identical definitions in every translation unit. Violations give multiple-definition link errors or, worse, silent undefined behaviour when definitions differ."},{"id":"q145","t":"t5","q":"When are iterators invalidated in vector, list and map?","a":"vector: insert or erase invalidates iterators at and after the point, and a reallocation invalidates all. list and map: insertion never invalidates; erase invalidates only the erased element. In loops use the iterator returned by erase."},{"id":"q146","t":"t5","q":"How does unordered_map handle collisions and why can it degrade to O(n)?","a":"Usually separate chaining in buckets. If many keys share a bucket (a poor hash or adversarial input) lookups scan long chains. Rehashing at the maximum load factor limits average cost; use a good hash and reserve() to avoid rehashes."},{"id":"q149","t":"t8","q":"Describe step by step what happens when a program calls read() on a file.","a":"The libc wrapper loads the syscall number and arguments into registers and executes the syscall instruction; the CPU switches to kernel mode and the kernel looks up the handler. VFS finds the open file from the file descriptor; the page cache serves the data or the block layer issues I/O while the process sleeps. The data is copied to the user buffer and the kernel returns to user mode."},{"id":"q150","t":"t8","q":"Compare interrupts, exceptions and traps.","a":"An interrupt is asynchronous, raised by hardware (timer, NIC). An exception or fault is synchronous and caused by the executing instruction (page fault, divide by zero). A trap is a deliberate synchronous exception such as a syscall or breakpoint. All enter the kernel through the interrupt or vector table."},{"id":"q37","t":"t8","q":"What are user and kernel mode, and what is a system call?","a":"Kernel mode has full hardware access. A syscall is a controlled trap from user to kernel to request a service, then it returns."},{"id":"q151","t":"t9","q":"What happens to memory and file descriptors after fork(), and what does exec() change?","a":"The child gets a copy-on-write copy of the parent's address space and duplicate descriptors that share file offsets; only the calling thread exists in the child. exec replaces the process image (code, heap, stack) but keeps the PID and, unless close-on-exec is set, the open descriptors."},{"id":"q152","t":"t9","q":"How does a shell implement the pipeline ls | grep foo?","a":"It creates a pipe, forks twice; the first child dup2s the write end onto stdout and execs ls, the second dup2s the read end onto stdin and execs grep. Every unused pipe end must be closed so EOF reaches grep, and the shell waits for the children."},{"id":"q38","t":"t9","q":"Process vs thread?","a":"Processes have separate address spaces; threads share memory, heap and file descriptors in a process but have their own stack and registers."},{"id":"q153","t":"t10","q":"How do you turn a program into a classic daemon?","a":"Fork and exit the parent, call setsid to leave the controlling terminal and start a new session, fork again so it cannot reacquire a terminal, chdir to /, reset umask and redirect the standard descriptors to /dev/null. Modern systems usually let systemd do this."},{"id":"q154","t":"t10","q":"Compare user-level threads, kernel threads and the Linux pthread model.","a":"User-level (N:1) threads are scheduled by a library: cheap, but one blocking syscall stalls them all and there is no multicore parallelism. Linux uses 1:1: every pthread is a kernel task scheduled across cores independently, with higher creation and switch cost. M:N hybrids are complex."},{"id":"q40","t":"t10","q":"What happens in a context switch?","a":"Save the current CPU context in the PCB or TCB, pick the next task, restore its context, and possibly switch the address space (TLB cost)."},{"id":"q156","t":"t11","q":"How does Linux CFS pick the next task, and how do real-time priorities differ?","a":"CFS keeps a virtual runtime per task in a red-black tree and runs the task with the smallest vruntime, weighted by nice value, for fairness. SCHED_FIFO and SCHED_RR tasks always preempt normal tasks and run by static priority, so a runaway RT task can starve the system unless throttled."},{"id":"q157","t":"t11","q":"What is priority inversion? Explain the Mars Pathfinder case.","a":"A high-priority task blocks on a mutex held by a low-priority task that a medium-priority task keeps preempting, so the high task effectively waits for the medium one. Pathfinder kept resetting because of this and was fixed by enabling priority inheritance on the mutex."},{"id":"q41","t":"t11","q":"What is priority inversion and how is it fixed?","a":"A low-priority task holds a lock needed by a high-priority one while a medium task preempts it. Fix: priority inheritance or priority ceiling."},{"id":"q159","t":"t12","q":"What are spurious wakeups and the lost-wakeup problem?","a":"A waiting thread can return from cond_wait with no signal, so always recheck the predicate in a loop. A lost wakeup happens when the signal is sent before the waiter starts waiting; avoid it by changing the predicate under the same mutex before signalling."},{"id":"q158","t":"t12","q":"Why can't an interrupt handler take a mutex and what do you use instead?","a":"A mutex may sleep, but an ISR has no process context and must never sleep. Use spinlocks with interrupts disabled (spin_lock_irqsave), atomics or lock-free structures, or defer the work to a thread or bottom half."},{"id":"q43","t":"t12","q":"Mutex vs semaphore vs spinlock?","a":"Mutex: ownership-based lock for mutual exclusion. Semaphore: counter for signalling or resource counting. Spinlock: busy-waits; only for very short holds."},{"id":"q160","t":"t13","q":"How do you debug a deadlock in a running process?","a":"Attach gdb and run thread apply all bt to see which threads are blocked in lock calls and what they hold; inspect mutex owner fields; use pstack, Helgrind or ThreadSanitizer for lock-order checks; then impose a global lock order and use try_lock with timeouts to detect it."},{"id":"q44","t":"t13","q":"What are the four conditions for deadlock?","a":"Mutual exclusion, hold and wait, no preemption, circular wait. Break any one (commonly with lock ordering) to prevent it."},{"id":"q162","t":"t15","q":"Walk through a page fault on the first access to malloc'ed memory.","a":"malloc returns virtual addresses without physical frames. The first touch faults; the kernel allocates a zeroed frame, updates the page table (and TLB), and restarts the instruction. This is demand paging, so the cost appears on first access rather than in malloc."},{"id":"q45","t":"t15","q":"What is virtual memory and what happens on a page fault?","a":"Each process sees its own address space mapped by page tables. On a fault the OS validates the access, loads or allocates the page, updates the page table and retries."},{"id":"q46","t":"t15","q":"What is a TLB?","a":"A cache of recent virtual-to-physical translations that avoids walking the page tables on every access."},{"id":"q163","t":"t16","q":"What is a TLB shootdown?","a":"When a mapping changes (munmap, mprotect, migration) on a multicore system, other cores may hold stale TLB entries, so the kernel sends inter-processor interrupts that make them invalidate those entries. It is expensive for multithreaded processes."},{"id":"q165","t":"t16","q":"How do malloc implementations reduce fragmentation?","a":"Size-segregated free lists (size classes), splitting and coalescing of neighbouring free blocks, per-thread arenas to reduce contention, and mmap for large blocks that can be returned to the OS. Fixed-size pools remove fragmentation entirely for known object sizes."},{"id":"q164","t":"t16","q":"What is the OOM killer and why does overcommit matter on embedded Linux?","a":"Linux may promise more memory than exists, assuming pages go untouched; when memory truly runs out the OOM killer terminates a process chosen by a badness score, possibly a critical one. Embedded systems tune vm.overcommit_memory, set cgroup limits, use watchdogs and size memory deliberately."},{"id":"q173","t":"t29","q":"What happens, network-wise, when you type a URL and press Enter?","a":"DNS lookup (caches, resolver, root, TLD, authoritative), then ARP for the next-hop MAC, a TCP three-way handshake with the server, a TLS handshake for HTTPS, the HTTP request and response, then keep-alive or teardown. Routers forward by IP and NAT may rewrite addresses at the edge."},{"id":"q175","t":"t29","q":"What are MTU, MSS and fragmentation?","a":"MTU is the largest layer-2 payload (1500 on Ethernet); MSS is the largest TCP payload, MTU minus IP and TCP headers (about 1460). IP fragments packets larger than the MTU unless DF is set; path MTU discovery avoids fragmentation, which hurts performance and reliability."},{"id":"q176","t":"t29","q":"How many usable hosts are in 10.0.5.0/22 and what is the broadcast address?","a":"/22 leaves 10 host bits: 1024 addresses, 1022 usable. The mask is 255.255.252.0, so 10.0.5.0 lies in the network 10.0.4.0/22, which spans 10.0.4.0 to 10.0.7.255. The broadcast address is 10.0.7.255."},{"id":"q179","t":"t31","q":"What are Nagle's algorithm and delayed ACK, and why can they cause 40 ms stalls?","a":"Nagle holds small writes until earlier data is acknowledged, to avoid tiny packets; delayed ACK waits up to about 40 ms hoping to piggyback. Together a write-write-read pattern can stall. Fix with TCP_NODELAY or by coalescing writes."},{"id":"q180","t":"t31","q":"Explain slow start, congestion avoidance and fast retransmit.","a":"Slow start doubles cwnd every RTT from a small window until ssthresh or loss; congestion avoidance then grows linearly. A timeout resets cwnd to one segment; three duplicate ACKs trigger fast retransmit and fast recovery, halving cwnd."},{"id":"q182","t":"t31","q":"Why is edge-triggered epoll harder than level-triggered?","a":"Edge-triggered reports only state changes, so you must use non-blocking descriptors and read or accept until EAGAIN, otherwise leftover data may never trigger again. Level-triggered keeps notifying while data remains, which is simpler and safer."},{"id":"q184","t":"t34","q":"What does TLS provide and how does the handshake work roughly?","a":"Confidentiality, integrity and server authentication (optionally client). Hellos agree on version and cipher, the server proves identity with a certificate chain, ECDHE key exchange derives shared session keys, and data then flows encrypted with a symmetric AEAD cipher. On constrained devices the cost is certificate verification and RAM."},{"id":"q183","t":"t34","q":"Compare MQTT QoS 0, 1 and 2.","a":"QoS 0 is at most once (fire and forget). QoS 1 is at least once with a PUBACK, so duplicates are possible. QoS 2 is exactly once through a four-step handshake with the most overhead. Choose per message by the cost of loss versus duplicates."},{"id":"q68","t":"t34","q":"MQTT vs HTTP for IoT?","a":"MQTT is a lightweight publish/subscribe protocol over a persistent TCP connection with small headers and QoS levels; HTTP is heavier request/response."},{"id":"q188","t":"t24","q":"What does a correct bounded blocking queue need?","a":"One mutex protecting the buffer and counts, two condition variables (not_full and not_empty), producers waiting while full and consumers while empty in predicate loops, notifications after state changes, and a closed flag that wakes everybody for shutdown. Do not hold the lock while processing items."},{"id":"q70","t":"t24","q":"Why wait on a condition variable in a while loop?","a":"Spurious wakeups and multiple consumers mean the condition may be false after waking; always recheck the predicate under the lock."},{"id":"q190","t":"t25","q":"Explain acquire and release semantics with a flag and data example.","a":"The writer stores the data, then does a release-store to the flag. A reader does an acquire-load of the flag and, if it is set, is guaranteed to see the data written before the release. This orders accesses across the pair without a full barrier; relaxed gives no ordering."},{"id":"q191","t":"t25","q":"Why is naive double-checked locking broken and what is the correct C++11 approach?","a":"Without atomics the pointer may become visible before the object is fully constructed because of reordering, so another thread sees a half-built object. Use std::call_once, a function-local static (thread-safe initialisation since C++11), or atomics with acquire and release."},{"id":"q189","t":"t25","q":"What is the starvation problem with reader-writer locks?","a":"Reader preference can starve writers when readers keep arriving; writer preference can starve readers. Fair or ticket-based implementations queue requests. Reader-writer locks also cost more than a plain mutex for short critical sections."},{"id":"q192","t":"t27","q":"How would you size a thread pool?","a":"For CPU-bound work about the number of cores; for I/O-bound work more threads, roughly cores x (1 + wait time / compute time). Measure, bound the queue for backpressure and avoid oversubscription."},{"id":"q73","t":"t27","q":"How do you shut down a thread pool gracefully?","a":"Set a stop flag under the lock, notify all workers, let them drain or discard the queue, then join."},{"id":"q193","t":"t27","q":"If 20% of a program is serial, what is the maximum speedup, and what is it with 8 threads?","a":"Amdahl's law: speedup = 1 / (s + (1 - s) / N). With s = 0.2 the limit is 5x, and with 8 threads it is 1 / (0.2 + 0.8 / 8) = 3.33x. Serial parts and synchronisation cap scalability."},{"id":"q95","t":"t51","q":"Where would you use Singleton, Observer and Strategy in firmware?","a":"Singleton for a hardware manager (use sparingly), Observer for sensor events, Strategy for swappable algorithms or drivers behind a HAL."},{"id":"q230","t":"t78","q":"Tell me about a time you disagreed with a teammate or lead.","a":"Use STAR: describe the technical disagreement neutrally, how you gathered data (benchmark, prototype), listened and proposed trade-offs, the decision and result, and what you learned. Show respect and focus on the outcome, not on winning."},{"id":"q231","t":"t78","q":"Describe a time you made a mistake or missed a deadline.","a":"Own it without blaming others, explain the impact, the immediate mitigation, the root cause, the process fix (tests, review, monitoring) and how you communicated early. Interviewers look for accountability and learning."},{"id":"q96","t":"t78","q":"Tell me about yourself.","a":"Present, past, future in about 90 seconds: current skills, key projects, why this role. End by linking your strengths to the team."},{"id":"q141","t":"t4","q":"What is the difference between std::move and std::forward?","a":"std::move unconditionally casts to an rvalue reference so the object can be moved from. std::forward<T> casts conditionally, preserving the value category of a forwarding reference (T&&) so wrappers pass lvalues as lvalues and rvalues as rvalues: perfect forwarding."},{"id":"q142","t":"t4","q":"Why should move constructors be noexcept?","a":"std::vector grows by moving elements only if the move constructor is noexcept; otherwise it copies to keep the strong exception guarantee, because a throwing move would leave the container half-moved. noexcept also allows better code generation."},{"id":"q143","t":"t4","q":"How can shared_ptr leak and how does weak_ptr help?","a":"Cycles (A holds a shared_ptr to B and B to A) keep both reference counts above zero forever. Make one direction a weak_ptr, which does not own; call lock() to get a temporary shared_ptr or an empty one if the object expired."},{"id":"q186","t":"t23","q":"What is lock contention and how do you reduce it?","a":"Many threads waiting for the same lock serialise execution. Reduce it with shorter critical sections, finer-grained or sharded locks, reader-writer locks, per-thread data merged later, lock-free structures, or avoiding sharing altogether."},{"id":"q187","t":"t23","q":"Compare lock_guard, unique_lock and scoped_lock.","a":"lock_guard locks in its constructor and unlocks in its destructor, exception-safe and not movable. unique_lock adds deferred locking, early unlock and works with condition_variable. scoped_lock locks several mutexes at once using a deadlock-avoidance algorithm (C++17)."},{"id":"q233","t":"t79","q":"How do you approach a bug you have never seen before?","a":"Reproduce it reliably, form hypotheses, bisect (code, config, inputs), instrument (logs, GDB, traces, a scope or logic analyser), change one thing at a time, find the root cause, add a regression test and document it."},{"id":"q232","t":"t79","q":"Why do you want to work here, and why embedded or systems work?","a":"Connect the company's products and engineering problems to your skills and projects; show curiosity about low-level performance, reliability and hardware-software interaction, and mention concrete projects from your preparation."},{"id":"q234","t":"t79","q":"Tell me about the technical project you are proudest of.","a":"Choose one project: state the problem and constraints, your specific contribution, the hardest technical decision and its trade-off, a measurable result (latency, size, defects) and what you would improve."},{"id":"n0","t":"t36","q":"How do you estimate QPS and storage for a service with 100 million daily active users?","a":"Daily requests = users x actions per user (say 10) = 1 billion, divided by 86,400 seconds is about 11.6k average QPS, and peak is typically 2 to 5 times the average. Storage = records per day x size x retention (for example 100 M x 1 KB x 365 x 5 is about 180 TB before replication). State your assumptions and round numbers."},{"id":"n1","t":"t36","q":"What non-functional requirements should you clarify first and how do they change the design?","a":"Scale, latency, availability, consistency, durability and cost. Strong consistency and low latency push toward a single leader or a cache, high availability pushes toward replication and eventual consistency, and durability needs replication and write-ahead logs."},{"id":"n2","t":"t36","q":"Walk me through a framework for a system design interview.","a":"Clarify requirements and scope, estimate scale, define the APIs, design the data model, draw the high-level architecture, deep-dive into the hardest components (storage, caching, scaling, failures), then discuss trade-offs and bottlenecks."},{"id":"n4","t":"t37","q":"What is a cache stampede and how do you prevent it?","a":"When a hot key expires, many requests miss at once and hit the database. Prevent it with request coalescing (single flight), locks or leases, refreshing before expiry, jittered TTLs, or serving stale data while revalidating."},{"id":"n3","t":"t37","q":"Compare cache-aside, write-through and write-back caching.","a":"Cache-aside: the app reads the cache, on a miss loads from the database and populates the cache. Simple but can serve stale data. Write-through: writes go to the cache and the database together, which is consistent but slower for writes. Write-back: write to the cache and flush later, which is fast but risks data loss if the cache fails."},{"id":"n5","t":"t37","q":"Layer 4 versus layer 7 load balancing, and common balancing algorithms?","a":"L4 balances by IP and port without reading HTTP, so it is fast. L7 inspects HTTP (path, headers, cookies) for smarter routing, TLS termination and sticky sessions. Algorithms: round robin, weighted, least connections, IP hash and consistent hashing."},{"id":"n7","t":"t38","q":"How do database indexes work and what do they cost?","a":"A B-tree index keeps keys sorted so lookups and range scans are O(log n) instead of scanning the table. Every write must update the index and indexes use space, so index the columns used in filters, joins and ordering, not everything."},{"id":"n8","t":"t38","q":"Explain replication and sharding and the problems each solves.","a":"Replication copies data to several nodes for availability and read throughput (leader-follower with lag, or multi-leader). Sharding splits data across nodes by a key (range or hash) to scale writes and storage. Challenges: hotspots, rebalancing and cross-shard queries."},{"id":"n6","t":"t38","q":"SQL or NoSQL: how do you decide?","a":"Use SQL when data is relational and you need joins, constraints and ACID transactions. Use NoSQL when you need horizontal scale, a flexible schema or simple key access at huge volume, accepting weaker consistency or no joins. Many systems use both."},{"id":"n10","t":"t39","q":"How does Kafka achieve ordering and scale?","a":"Topics are split into partitions and each partition is an ordered append-only log, so ordering exists only within a partition. Producers choose a partition by key, consumer groups assign partitions to consumers (parallelism is limited by partition count) and consumers track offsets."},{"id":"n9","t":"t39","q":"What delivery guarantees exist in messaging and how do you get effectively-once processing?","a":"At-most-once may lose messages, at-least-once may duplicate and exactly-once is hard, usually meaning at-least-once plus idempotent processing or transactional writes. Use idempotency keys, deduplication tables or conditional updates."},{"id":"n11","t":"t39","q":"What is backpressure and a dead-letter queue?","a":"Backpressure slows or rejects producers when consumers cannot keep up (bounded queues, rate limits, blocking) to avoid memory blowup. A dead-letter queue stores messages that repeatedly fail so they do not block the pipeline and can be inspected."},{"id":"n14","t":"t40","q":"How does Raft keep replicas consistent?","a":"A leader is elected by majority vote in a term. Clients send writes to the leader, which appends them to its log and replicates to followers, and an entry is committed once a majority has it. If the leader fails a new election happens and logs are reconciled to match the leader."},{"id":"n12","t":"t40","q":"Explain the CAP theorem accurately.","a":"During a network partition a distributed system must choose between consistency (every read sees the latest write) and availability (every request gets a non-error response). Without a partition you can have both. PACELC adds the latency versus consistency trade-off in normal operation."},{"id":"n13","t":"t40","q":"What is a quorum and how do R + W > N guarantees work?","a":"With N replicas a write succeeds after W acknowledgements and a read queries R replicas. If R + W > N every read set overlaps every write set in at least one replica, so a read sees the latest version (using version numbers to pick it)."},{"id":"n15","t":"t41","q":"Explain token bucket versus sliding window rate limiting.","a":"Token bucket: a bucket refills at a fixed rate up to a capacity and each request takes a token, so bursts up to the capacity are allowed. Sliding window counts requests in the last T seconds (log or weighted counters): smoother and more accurate but needs more memory. Fixed window is simple but allows bursts at boundaries."},{"id":"n17","t":"t41","q":"JWT versus server-side sessions: what are the trade-offs?","a":"JWTs are signed, self-contained and stateless so any server can validate them, but they are hard to revoke before expiry and can get large. Sessions store state on the server (or in Redis), which allows instant revocation but needs shared storage and lookups."},{"id":"n16","t":"t41","q":"What makes an HTTP method idempotent and why does it matter?","a":"Repeating the request has the same effect as doing it once (GET, PUT, DELETE). It matters for safe retries after timeouts. POST is not idempotent unless you add an idempotency key so the server can deduplicate."},{"id":"n18","t":"t42","q":"Design a URL shortener: how do you generate unique short keys?","a":"Options: base62-encode an auto-increment id (needs a distributed counter, for example ranges handed to each server), hash the URL and take the first 7 characters with a collision check, or pre-generate keys in a key-generation service. Seven base62 characters give about 3.5 trillion combinations."},{"id":"n20","t":"t42","q":"How would you scale the read path of a URL shortener to 100k QPS?","a":"Cache hot mappings in Redis or an in-process LRU with a high hit rate, add read replicas, put a CDN or edge cache in front, shard the store by key hash and keep redirect handling stateless behind a load balancer."},{"id":"n19","t":"t42","q":"Where do 301 and 302 redirects matter in a URL shortener?","a":"301 is permanent and cacheable by browsers, which reduces load but hides later clicks from analytics. 302 is temporary so every click hits your server, which allows analytics and changing the target."},{"id":"n21","t":"t43","q":"Design a distributed rate limiter: main components and trade-offs.","a":"A gateway middleware checks a counter per key in a shared store such as Redis using atomic INCR plus expiry (fixed window) or a Lua script for a token bucket, and returns 429 with Retry-After. Trade-offs: the central store adds latency and a failure point (cache locally and sync, fail open or closed), fixed windows allow bursts and sliding windows cost memory."},{"id":"n22","t":"t43","q":"How do you avoid race conditions in a distributed counter?","a":"Use atomic operations in the store (INCR, compare-and-set, Lua scripts or transactions) instead of read-modify-write from the application, or shard counters per node and aggregate approximately."},{"id":"n23","t":"t43","q":"Fail open or fail closed when the rate limit store is unavailable?","a":"It depends on risk. Failing open (allow traffic) protects availability for most public APIs but risks abuse. Failing closed protects backends and security-sensitive endpoints. Many systems fail open with a local fallback limit."},{"id":"n25","t":"t44","q":"How do you handle a hot key in a distributed cache?","a":"Replicate the hot key across several nodes or add a local in-process cache, split the key into sub-keys with random suffixes, use request coalescing, or add a short-TTL layer in front. Monitor key popularity to detect it."},{"id":"n27","t":"t44","q":"Explain the LSM-tree write path and why it is write-optimised.","a":"Writes append to a write-ahead log for durability and go into an in-memory sorted memtable. When full it is flushed as an immutable sorted SSTable, and background compaction merges SSTables and drops obsolete versions. All disk writes are sequential, which is fast, and reads may check several files, mitigated by bloom filters."},{"id":"n28","t":"t44","q":"How does a Dynamo-style store stay available during node failures?","a":"Keys are replicated to N nodes on the ring. Writes use a sloppy quorum with hinted handoff so another node holds the data until the owner returns, reads use read repair and anti-entropy (Merkle trees) to fix divergence, gossip spreads membership and conflicts are resolved with vector clocks or last-write-wins."},{"id":"n30","t":"t46","q":"Compare fan-out on write and fan-out on read for a news feed.","a":"Fan-out on write pushes a new post into every follower's timeline at post time, so reads are fast but writes are expensive and wasteful for inactive users or celebrities. Fan-out on read assembles the feed on request: cheap writes but slow, heavy reads. A hybrid pushes for ordinary users and pulls celebrity posts at read time."},{"id":"n32","t":"t46","q":"What would you cache in a news feed system?","a":"Per-user timelines as lists of post ids in a cache like Redis, hot post and user objects and counters. Hydrate ids to full posts with batched lookups, set a TTL and evict inactive users' timelines."},{"id":"n31","t":"t46","q":"How do you paginate a feed that changes constantly?","a":"Use cursor (keyset) pagination based on a stable sort key such as post id or timestamp instead of offsets, so new items do not shift pages and duplicates or skips are avoided."},{"id":"n35","t":"t47","q":"How would you design group chat with 100,000 members?","a":"Avoid per-member delivery writes where possible: store the message once in the group log and have each client pull or be notified with a lightweight event. Fan out via a pub/sub topic per group, shard large groups and use push only for offline users."},{"id":"n36","t":"t47","q":"How do you build a reliable delayed job scheduler?","a":"Store jobs with a run-at time in a durable store (sorted set or time-bucketed table). Pollers or a heap pick due jobs and workers lease them with a visibility timeout so a failed worker's job becomes available again. Make handlers idempotent, record completion and run multiple scheduler shards with leader election."},{"id":"n33","t":"t47","q":"How do you deliver chat messages reliably and in order?","a":"Persist each message with a per-conversation sequence number, send it to the recipient's connected server, require a client ack, and retry or resend from the stored log until acked. Clients dedupe by sequence number and request missing ranges after reconnecting."},{"id":"n43","t":"t50","q":"Composition versus inheritance: when do you use which?","a":"Use inheritance for a true is-a relationship with substitutable behaviour. Prefer composition (has-a) to reuse behaviour flexibly, swap implementations at run time and avoid tight coupling and deep hierarchies."},{"id":"n42","t":"t50","q":"Explain the SOLID principles with a one-line example each.","a":"S: a class has one responsibility (separate report formatting from calculation). O: add behaviour by extension (a new Shape subclass) without modifying existing code. L: derived classes must honour the base contract. I: many small interfaces rather than one fat one. D: high-level code depends on abstractions (inject a Logger interface)."},{"id":"n44","t":"t50","q":"What is dependency injection and why does it help testing?","a":"Passing dependencies (interfaces) into a class instead of creating them inside lets you substitute fakes or mocks in tests and swap implementations without changing the class."},{"id":"n46","t":"t52","q":"How would you make parking spot allocation thread-safe?","a":"Make spot state changes atomic: a mutex per level or per spot, or an atomic compare-and-set on the spot's occupied flag. Allocate by finding a free spot and claiming it in one critical section so two gates cannot take the same spot."},{"id":"n45","t":"t52","q":"Design a parking lot: list the main classes and relationships.","a":"ParkingLot has Levels, a Level has Spots of types (compact, large, motorcycle), Vehicle has subclasses, a Ticket links vehicle, spot and entry time, a PricingStrategy computes fees, a SpotAllocationStrategy chooses a spot, and payment processing is separate."},{"id":"n47","t":"t52","q":"How do you add a new pricing rule without modifying existing code?","a":"Define a PricingStrategy interface and add a new class implementing it (open/closed principle), then inject the chosen strategy into the pricing service via configuration or a factory."},{"id":"n48","t":"t53","q":"Design an elevator system: how do you choose which elevator serves a request?","a":"A controller scores each car by direction, distance and load: prefer a car already moving toward the request in the same direction, otherwise the nearest idle car. Use SCAN or LOOK within a car, keep the strategy pluggable and avoid starvation."},{"id":"n49","t":"t53","q":"How would you model elevator states and transitions?","a":"States: Idle, MovingUp, MovingDown, DoorsOpen (and Maintenance). Events: request added, arrival at a floor, door timer, emergency stop. A state machine ensures valid transitions, for example doors open only when stopped."},{"id":"n50","t":"t53","q":"How is the elevator algorithm similar to disk scheduling?","a":"SCAN and LOOK move in one direction serving requests along the way and then reverse, minimising direction changes and starvation, exactly like the elevator algorithm used for disk head scheduling."},{"id":"n52","t":"t54","q":"How do you make a cache thread-safe without a global lock bottleneck?","a":"Shard the cache by key hash with one mutex per shard, use shared (reader-writer) locks for read-heavy loads, keep critical sections small and consider approximations such as CLOCK or sampling to avoid reordering on every read."},{"id":"n51","t":"t54","q":"Implement an LRU cache: which data structures give O(1) get and put?","a":"A hash map from key to a node in a doubly linked list that orders entries by recency. get moves the node to the front, and put inserts at the front and, when over capacity, removes the tail entry and its map entry."},{"id":"n53","t":"t54","q":"How would you add TTL support to an LRU cache?","a":"Store an expiry timestamp per entry and treat expired entries as misses on access (lazy expiry), plus a background sweeper or a min-heap of expiries to reclaim memory. Keep the clock injectable for tests."},{"id":"n54","t":"t55","q":"How do you prevent double booking of the same seat?","a":"Make seat acquisition atomic: a conditional update (set status to held where status is available) or compare-and-swap, a row-level lock in the database, or a unique constraint on (show, seat). Use a timed hold so abandoned carts release seats."},{"id":"n55","t":"t55","q":"Optimistic versus pessimistic locking: when do you prefer which?","a":"Pessimistic locking locks data before modification and suits high contention but reduces concurrency. Optimistic locking uses a version check at commit and retries on conflict, which is better when conflicts are rare."},{"id":"n56","t":"t55","q":"How do you make payment callbacks safe when they can be delivered twice?","a":"Treat them idempotently: use the payment or order id as an idempotency key, record processed ids and make state transitions conditional (confirm only if currently held) so repeats are harmless."},{"id":"n62","t":"t57","q":"How do you get the top 3 earners per department?","a":"SELECT ... FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) AS rn FROM employees) WHERE rn <= 3. Use RANK or DENSE_RANK if ties should all be included."},{"id":"n60","t":"t57","q":"Find the second highest salary in a table.","a":"Use DENSE_RANK() OVER (ORDER BY salary DESC) and filter rank = 2, or SELECT MAX(salary) FROM employees WHERE salary < (SELECT MAX(salary) FROM employees). Handle ties and the case where it does not exist (return NULL)."},{"id":"n61","t":"t57","q":"What is the difference between WHERE and HAVING, and between INNER and LEFT JOIN?","a":"WHERE filters individual rows before grouping and HAVING filters groups after aggregation. INNER JOIN returns only matching rows, LEFT JOIN returns all left rows with NULLs where there is no match."},{"id":"n65","t":"t58","q":"What is MVCC and why do readers not block writers?","a":"Multi-version concurrency control keeps multiple versions of rows tagged with transaction ids. Each transaction reads a consistent snapshot while writers create new versions, so reads and writes rarely block each other. Old versions are cleaned up later (vacuum)."},{"id":"n63","t":"t58","q":"Explain database isolation levels and the anomalies they prevent.","a":"Read uncommitted allows dirty reads, read committed prevents them, repeatable read also prevents non-repeatable reads, and serializable prevents phantoms too, as if transactions ran one by one. Higher isolation reduces concurrency and may cause retries or aborts."},{"id":"n64","t":"t58","q":"What is a covering index and the leftmost-prefix rule?","a":"A covering index contains every column a query needs, so the database answers from the index without touching the table. For a composite index (a, b, c) the planner can use it for filters on a, on (a, b) or on (a, b, c), but not for b or c alone."},{"id":"n66","t":"t59","q":"Two-phase commit versus saga: what are the trade-offs?","a":"2PC coordinates a prepare then commit across participants for atomicity but holds locks and blocks if the coordinator fails, hurting availability and latency. Sagas run local transactions with compensating actions on failure, giving availability but only eventual consistency and requiring careful compensation design."},{"id":"n67","t":"t59","q":"What is the outbox pattern?","a":"Write the business change and an event row in the same database transaction. A separate relay publishes outbox rows to the message broker and marks them sent, which avoids losing events or publishing events for rolled-back transactions."},{"id":"n68","t":"t59","q":"How do you handle replication lag for read-your-writes consistency?","a":"Route a user's reads to the leader for a short time after writes, use session or version tokens so replicas wait until they have caught up, or read from replicas only for non-critical data."},{"id":"n76","t":"t80","q":"Design a web crawler: main components and challenges.","a":"A URL frontier (priority queue with politeness per host), fetcher workers, a DNS cache, a content parser, duplicate detection (URL normalisation and content hashing or simhash), a storage layer, robots.txt compliance and rate limiting per domain. Scale by partitioning the frontier by host hash."},{"id":"n77","t":"t80","q":"Design a ride-sharing dispatch: how do you match riders and drivers?","a":"Index driver locations with a geospatial structure (geohash, S2 or a quadtree) updated by frequent location pings. On a request, query nearby drivers, rank by ETA, offer to the best with timeouts, assign atomically to avoid double assignment and shard by region."},{"id":"n72","t":"t80","q":"Walk me through the most complex project you have worked on.","a":"Structure: context and goal, constraints, architecture, your specific contribution, the hardest technical problem and how you solved it, trade-offs considered, a measurable result and what you would do differently. Keep it to 3 to 5 minutes and invite follow-ups."}],"PAT":{"Arrays & Hashing":"Need fast lookup or counting? Put values in a hash map.","Bit Tricks":"XOR cancels pairs; n & (n-1) clears the lowest set bit.","Two Pointers":"Sorted input or a pair condition? Move two indexes inward.","Sliding Window":"Contiguous range with a condition? Grow right, shrink left.","Strings":"Think frequency counts, two pointers, or a stack.","Linked List":"Use a dummy head and slow/fast pointers.","Stack & Queue":"Nearest greater/smaller? Monotonic stack. Level by level? Queue.","Design":"Pair a hash map with a list so every operation is O(1).","Binary Search":"Anything monotonic: search the answer, not just the array.","Backtracking":"Choose, explore, un-choose. Draw the decision tree first.","Matrix & Math":"Work with row/col indexes and watch the boundaries.","Greedy & Intervals":"Sort first, then keep one running best choice.","Trees & Tries":"Solve for the node and trust recursion for the children.","Heap":"Top-K or repeated min/max? Use a heap.","Graphs":"Grid or network? BFS for shortest path, DFS for connectivity.","DP":"Define the state, write the recurrence, then add memo.","Hands-on":"Read the problem as a small version of today's topic."}};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),pd=k=>new Date(k+'T12:00:00'),ad=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return dk(d)},df=(a,b)=>Math.round((pd(b)-pd(a))/864e5),TD=()=>dk(new Date());
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),B=s=>E(s).replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>');
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q),gg=q=>'https://www.google.com/search?q='+encodeURIComponent(q),lc=p=>'https://leetcode.com/problems/'+p.id+'/';
const P=D.P.map(a=>({id:a[0],n:a[1],c:a[2],d:a[3],co:a[4]})),L=D.L,QM={};D.Q.forEach(q=>(QM[q.t]=QM[q.t]||[]).push(q));
const COMP={A:'Amazon',G:'Google',M:'Microsoft',F:'Meta',P:'Apple',D:'Adobe',B:'Bloomberg',U:'Uber'},KEY='sde100v1';
const DEF=()=>({start:TD(),iv:'2027-01-31',buf:10,hw:2,hwe:4,mpp:25,pd:{},st:{},td:{},qs:{},rp:{},rq:{},off:{},sk:{},mo:{},ex:{},pl:{},v:'today'});
let S,OPS={},OQ=new Set(),TOP=false;
try{S=Object.assign(DEF(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=DEF()}
try{if(!localStorage.getItem(KEY)){const o=JSON.parse(localStorage.getItem('iq90v1')||'null');if(o&&o.p){for(const id in o.p){if(o.p[id].st=='done')S.pd[id]=o.p[id].dt||TD();if(o.p[id].star)S.st[id]=1}for(const id in o.q||{})if(o.q[id].st)S.qs[id]=o.q[id].st;for(const n in o.done||{})if(o.done[n].learn)S.td['t'+n]=TD()}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

// ---------- scheduling: everything unfinished is spread over the days left ----------
const fin=()=>ad(S.iv,-S.buf),hrs=k=>S.off[k]?0:([0,6].includes(pd(k).getDay())?S.hwe:S.hw);
const W=(a,b)=>{let s=0;for(let k=a;k<=b;k=ad(k,1))s+=hrs(k);return s};
function tg(R,k){if(R<=0)return 0;const e=k<=fin()?fin():ad(S.iv,-1),w=W(k,e),h=hrs(k);if(h==0)return 0;if(w<=0||k>e)return R;return Math.min(R,Math.max(1,Math.round(R*h/w)))}
function eng(items,done,t,more){const un=items.filter(x=>!done[x.id]),sd=items.filter(x=>done[x.id]==t).length,sk=S.sk[t]||{},T0=tg(un.length+sd,t),left=Math.max(0,T0-sd),T1=tg(un.length,ad(t,1));
 return{un,sd,T0,left,open:un.slice(0,left+(more||0)).filter(x=>!sk[x.id]),T1,nxt:un.slice(0,T1),carry:Math.min(left,T1)}}
function plan(t){const rv=t>fin(),r={};r.p=eng(rv?P.filter(p=>S.st[p.id]):P,rv?S.rp:S.pd,t,S.mo[t+'p']);r.l=rv?null:eng(L,S.td,t,S.mo[t+'l']);r.q=rv?eng(D.Q.filter(q=>S.qs[q.id]=='review'),S.rq,t,0):null;S.pl[t]=r.p.T0;return r}
function solvedMap(all){const m={},add=k=>m[k]=(m[k]||0)+1;for(const id in S.pd)add(S.pd[id]);if(all)for(const id in S.rp)add(S.rp[id]);for(const k in S.ex)m[k]=(m[k]||0)+S.ex[k];return m}
function streak(){const a=new Set(Object.keys(solvedMap(1)));Object.values(S.td).forEach(k=>a.add(k));let k=TD(),n=0;if(!a.has(k))k=ad(k,-1);while(a.has(k)){n++;k=ad(k,-1)}return n}
function pace(){const t=TD(),e=ad(t,-1),w0=W(S.start,fin()),exp=w0>0&&e>=S.start?P.length*W(S.start,e<fin()?e:fin())/w0:0;return Math.round(P.filter(p=>S.pd[p.id]&&S.pd[p.id]<t).length-exp)}

// ---------- charts ----------
const days=(a,b)=>{const r=[];for(let k=a;k<=b;k=ad(k,1))r.push(k);return r};
function chBars(){const t=TD(),m=solvedMap(1),ks=Object.keys(m).sort(),d0=ks.length&&ks[0]<S.start?ks[0]:S.start,ds=days(d0,t),nx=plan(t).p.T1,mx=Math.max(4,nx,...ds.map(k=>Math.max(m[k]||0,S.pl[k]||0))),Wd=640,H=190,pl=30,pb=22,pt=10,bw=Math.min(26,(Wd-pl-8)/(ds.length+1)),y=v=>H-pb-(H-pb-pt)*v/mx;
 let s=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Problems solved each day">`;
 [0,mx/2,mx].forEach(v=>s+=`<line x1="${pl}" x2="${Wd}" y1="${y(v)}" y2="${y(v)}" stroke="#262626"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#8e8b84">${Math.round(v)}</text>`);
 ds.forEach((k,i)=>{const x=pl+i*bw,v=m[k]||0;s+=`<rect x="${x+1}" y="${y(v)}" width="${Math.max(1,bw-2)}" height="${H-pb-y(v)}" fill="${k==t?'#d8b56a':'#34d399'}"/>`;if(S.pl[k]!=null)s+=`<line x1="${x}" x2="${x+bw}" y1="${y(S.pl[k])}" y2="${y(S.pl[k])}" stroke="#f4f1ea" stroke-width="2"/>`});
