const QD=[
[1,"C","What is the difference between stack and heap?","Stack: automatic, LIFO, fast, small and per-thread; freed on return. Heap: manual (malloc/free), flexible lifetime, slower, can fragment or leak."],
[1,"C","Where are global, static and constant data stored?","Initialised globals and statics in .data, zero-initialised in .bss, string literals and const data in .rodata; code in .text."],
[1,"C","Dangling pointer vs wild pointer?","Dangling: points to memory already freed or out of scope. Wild: never initialised. Initialise pointers and set them to NULL after free."],
[2,"C","What is the difference between arr and &arr?","arr decays to &arr[0] (type T*); &arr is a pointer to the whole array (T(*)[N]). Same address, but +1 steps by one element vs the whole array."],
[2,"C","const int* vs int* const?","const int*: pointee is read-only, pointer can move. int* const: pointer is fixed, pointee writable. Read the declaration right to left."],
[2,"C","Why does sizeof(arr) differ inside a function?","Array parameters decay to pointers, so sizeof gives the pointer size. Pass the length explicitly."],
[3,"C","memcpy vs memmove?","memmove is safe for overlapping regions; memcpy is undefined if they overlap and may be faster."],
[3,"C","strlen vs sizeof on a char array?","strlen counts characters up to the terminating \\0 at run time; sizeof is the compile-time size of the whole array including the terminator."],
[4,"C","Why does struct padding exist and how do you reduce it?","CPUs access aligned data faster (or only aligned). The compiler pads members to alignment; order members from largest to smallest or use packed (watch for unaligned access)."],
[4,"C","How do you detect endianness?","Store 0x01 in a uint32_t and read the first byte through a char pointer: 1 means little-endian. Network byte order is big-endian."],
[4,"Embedded","Why are unions and bit fields used for registers?","They overlay named fields on a raw word for readable register access. Bit-field layout is implementation-defined, so portable code prefers masks and shifts."],
[5,"C","How do you set, clear, toggle and test bit n?","Set: x |= (1u<<n). Clear: x &= ~(1u<<n). Toggle: x ^= (1u<<n). Test: (x>>n)&1."],
[5,"C","How do you check for a power of two and count set bits?","Power of two: n>0 && (n&(n-1))==0. Count bits (Kernighan): repeat n &= n-1 until zero; one iteration per set bit."],
[6,"C","What does volatile do and when is it needed?","It stops the compiler caching or removing accesses. Needed for MMIO registers and flags changed by ISRs. It does not give atomicity or thread synchronization."],
[6,"C","What does static mean in C?","Local static: keeps its value across calls. File-scope static: internal linkage, visible only in that file."],
[6,"C","Macro vs inline function?","Macros are textual, untyped and can evaluate arguments twice. Inline functions are typed and debuggable; prefer them."],
[8,"C","What happens when malloc fails, and what does free(NULL) do?","malloc returns NULL, so always check it. free(NULL) is a safe no-op."],
[8,"C","What are the realloc pitfalls?","It may move the block and returns NULL on failure; assign to a temporary pointer so you do not leak the original."],
[8,"C","Memory leak vs use-after-free vs double free?","Leak: memory lost without free. Use-after-free: access after free. Double free: freeing twice corrupts the heap. Tools: ASan and Valgrind."],
[9,"C","How do you implement a state machine in C?","enum for states and events, then a switch or a table of function pointers indexed by state and event; keep actions separate from transitions."],
[10,"C","How do you build a generic container in C?","Store void* plus the element size, and accept function pointers for compare, copy and free. Document ownership clearly."],
[11,"C++","What is RAII?","Resource lifetime is tied to object lifetime: acquire in the constructor, release in the destructor, so cleanup runs on every exit path."],
[11,"C++","What are the rules of three, five and zero?","If you define a destructor, copy constructor or copy assignment, define all three (five with move). Better: use RAII members so you define none."],
[12,"C++","How do virtual functions work?","Each polymorphic object holds a vptr to its class vtable of function pointers; calls are resolved through it at run time."],
[12,"C++","Why do base classes need virtual destructors?","Deleting a derived object through a base pointer without one is undefined behaviour and skips the derived destructor."],
[12,"C++","Overload vs override vs hide?","Overload: same name, different parameters. Override: derived replaces a virtual function. Hide: a derived name shadows base overloads."],
[13,"C++","unique_ptr vs shared_ptr vs weak_ptr?","unique_ptr: sole ownership, no overhead. shared_ptr: reference-counted shared ownership. weak_ptr: non-owning observer that breaks cycles."],
[13,"C++","What is move semantics?","Transfers resources from a temporary instead of copying, using rvalue references and std::move; the source stays valid but unspecified."],
[15,"C++","How does vector grow and when are iterators invalidated?","Growth is amortised O(1) via capacity doubling; reallocation invalidates all iterators, insert or erase invalidates those after the point."],
[15,"C++","map vs unordered_map?","map: balanced tree, ordered, O(log n). unordered_map: hash table, average O(1), worst O(n), unordered."],
[16,"C++","Pointer vs reference?","A reference is an alias that must bind at initialisation and cannot be reseated or null; a pointer can be null, reassigned and has its own address."],
[17,"C","Explain the compilation stages.","Preprocess (macros, includes), compile (to assembly), assemble (object files), link (resolve symbols into an executable)."],
[17,"C","Static vs dynamic linking?","Static: library code copied into the binary; larger, self-contained. Dynamic: resolved at load time from .so files; smaller, shareable, updateable."],
[18,"C","How would you debug a segmentation fault?","Reproduce it, run under GDB and read the backtrace, inspect the faulting pointer, build with -g and ASan, check NULL, bounds and use-after-free."],
[19,"C","What is undefined behaviour? Give examples.","Code the standard does not define: signed overflow, out-of-bounds access, null dereference, uninitialised reads. Compilers may assume it never happens."],
[20,"Embedded","Why avoid malloc in embedded firmware?","Fragmentation, non-deterministic timing and allocation failure. Use static allocation or fixed-size pools."],
[20,"Embedded","How do you access a hardware register in C?","Cast the address to a volatile pointer, for example *(volatile uint32_t*)0x40021000 = val, wrapped in macros or a struct overlay."],
[22,"OS","What are user and kernel mode, and what is a system call?","Kernel mode has full hardware access. A syscall is a controlled trap from user to kernel to request a service, then it returns."],
[23,"OS","Process vs thread?","Processes have separate address spaces; threads share memory, heap and file descriptors in a process but have their own stack and registers."],
[23,"OS","What are fork, exec, zombie and orphan?","fork clones the process (copy-on-write); exec replaces the image. Zombie: finished but not yet reaped by wait. Orphan: parent exited; init adopts it."],
[24,"OS","What happens in a context switch?","Save the current CPU context in the PCB or TCB, pick the next task, restore its context, and possibly switch the address space (TLB cost)."],
[25,"OS","What is priority inversion and how is it fixed?","A low-priority task holds a lock needed by a high-priority one while a medium task preempts it. Fix: priority inheritance or priority ceiling."],
[25,"OS","Preemptive vs cooperative scheduling?","Preemptive: the scheduler can interrupt tasks. Cooperative: tasks yield voluntarily; simpler, but one task can hog the CPU."],
[26,"OS","Mutex vs semaphore vs spinlock?","Mutex: ownership-based lock for mutual exclusion. Semaphore: counter for signalling or resource counting. Spinlock: busy-waits; only for very short holds."],
[27,"OS","What are the four conditions for deadlock?","Mutual exclusion, hold and wait, no preemption, circular wait. Break any one (commonly with lock ordering) to prevent it."],
[29,"OS","What is virtual memory and what happens on a page fault?","Each process sees its own address space mapped by page tables. On a fault the OS validates the access, loads or allocates the page, updates the page table and retries."],
[29,"OS","What is a TLB?","A cache of recent virtual-to-physical translations that avoids walking the page tables on every access."],
[30,"OS","What is thrashing?","The system spends more time swapping pages than executing because working sets exceed physical memory."],
[31,"OS","Internal vs external fragmentation?","Internal: wasted space inside an allocated block. External: free memory split into pieces too small to use. Buddy and slab allocators mitigate it."],
[32,"Linux","How do you find the process using port 8080 and the process using most CPU?","ss -ltnp or lsof -i :8080 for the port; top, htop or ps aux --sort=-%cpu for CPU."],
[33,"Linux","SIGTERM vs SIGKILL?","SIGTERM can be caught for graceful shutdown; SIGKILL cannot be caught or ignored."],
[34,"Linux","What is a file descriptor?","A small integer indexing the process's table of open files, sockets, pipes and devices; 0, 1 and 2 are stdin, stdout and stderr."],
[34,"Linux","Hard link vs soft link?","Hard link: another name for the same inode (same filesystem). Soft link: a file holding a path; can dangle and can cross filesystems."],
[34,"Linux","select vs poll vs epoll?","select and poll scan all descriptors each call (O(n)); epoll keeps an interest list in the kernel and returns only ready descriptors, so it scales better."],
[36,"Linux","Which IPC mechanism is fastest and why?","Shared memory: no kernel copy per message, but you must add your own synchronization."],
[38,"OS","What is false sharing?","Two threads write different variables on the same cache line, so the line bounces between cores. Fix with padding or alignment."],
[39,"Embedded","What happens when a Cortex-M MCU resets?","It loads the stack pointer and reset vector from the vector table, runs the reset handler (init .data and .bss, clocks), then calls main()."],
[40,"Embedded","What are the rules for writing an ISR?","Keep it short, no blocking or malloc, clear the interrupt source, use volatile for shared data, defer heavy work to a task or the main loop."],
[40,"Embedded","Top half vs bottom half?","Top half runs in interrupt context and does the minimum; the bottom half (tasklet, workqueue or task) does the rest with interrupts enabled."],
[41,"Concurrency","Is volatile enough for thread synchronization?","No. It prevents some compiler optimisations but gives no atomicity or memory ordering; use atomics or locks."],
[43,"Networking","Name the OSI layers. What does ARP do?","Physical, Data link, Network, Transport, Session, Presentation, Application. ARP maps an IP address to a MAC address on the local link."],
[44,"Networking","What does NAT do and how does DHCP work?","NAT translates private addresses and ports to public ones. DHCP: Discover, Offer, Request, Acknowledge."],
[44,"Networking","How does a DNS lookup work?","Stub resolver, recursive resolver, root server, TLD server, authoritative server, with caching at each level."],
[45,"Networking","TCP vs UDP?","TCP: connection-oriented, reliable, ordered, with flow and congestion control. UDP: connectionless, low overhead, no guarantees; good for real-time and streaming."],
[45,"Networking","Describe the TCP three-way handshake and TIME_WAIT.","SYN, SYN-ACK, ACK. TIME_WAIT keeps the closer's socket for about 2xMSL so late packets cannot corrupt a new connection."],
[45,"Networking","Flow control vs congestion control?","Flow control protects the receiver (window size). Congestion control protects the network (slow start, congestion window)."],
[46,"Networking","What is the call order for a TCP server and client?","Server: socket, bind, listen, accept, read/write, close. Client: socket, connect, read/write, close."],
[46,"Networking","Why do you need htons and ntohs?","Network byte order is big-endian and hosts may be little-endian, so convert multi-byte fields."],
[48,"Networking","MQTT vs HTTP for IoT?","MQTT is a lightweight publish/subscribe protocol over a persistent TCP connection with small headers and QoS levels; HTTP is heavier request/response."],
[50,"Concurrency","Race condition vs data race? Thread-safe vs reentrant?","Race condition: outcome depends on timing. Data race: unsynchronised concurrent access with at least one write. Reentrant: safe to re-enter with no shared state; thread-safe code is not always reentrant."],
[52,"Concurrency","Why wait on a condition variable in a while loop?","Spurious wakeups and multiple consumers mean the condition may be false after waking; always recheck the predicate under the lock."],
[53,"Concurrency","How do you avoid deadlock in dining philosophers?","Impose resource ordering, limit diners to N-1, or use an arbiter so a circular wait cannot form."],
[54,"Concurrency","Atomics vs mutex? What is the ABA problem?","Atomics suit small lock-free updates; mutexes protect larger invariants. ABA: a CAS succeeds because a value went A to B and back to A; fix with version tags or hazard pointers."],
[55,"Concurrency","How do you shut down a thread pool gracefully?","Set a stop flag under the lock, notify all workers, let them drain or discard the queue, then join."],
[57,"Embedded","MCU vs MPU? Harvard vs von Neumann?","An MCU integrates CPU, memory and peripherals on one chip; an MPU needs external memory. Harvard has separate instruction and data buses; von Neumann shares one."],
[58,"Embedded","How do you debounce a switch?","Hardware RC filter, or in software sample until the input is stable for about 10 to 50 ms, or use a timer-driven state machine."],
[59,"Embedded","I2C vs SPI vs UART?","I2C: 2 wires, addressed multi-device, slower, needs pull-ups. SPI: 4 wires, fast, full duplex, chip select per slave. UART: 2 wires, point-to-point, asynchronous."],
[59,"Embedded","What is I2C clock stretching?","A slave holds SCL low to delay the master until it is ready."],
[60,"Embedded","How does CAN arbitration work?","Nodes send their IDs bit by bit; dominant (0) beats recessive (1), so the lowest ID wins without losing data."],
[61,"Embedded","What does DMA do and what is the cache-coherence issue?","DMA moves data without the CPU. With caches you must clean or invalidate (or use non-cacheable memory) so the CPU and DMA see the same data."],
[61,"Embedded","What do startup code and the linker script do?","They place sections in flash and RAM, copy .data from flash, zero .bss, set the stack pointer and vector table, then call main()."],
[62,"Embedded","How does a watchdog work and how do you use it well?","A timer that resets the MCU unless firmware kicks it. Kick it only after all critical tasks have proved they are alive."],
[64,"Embedded Linux","What are the components of an embedded Linux system?","Toolchain, bootloader, kernel, root filesystem (BusyBox or systemd) and applications, built with Yocto or Buildroot."],
[65,"Embedded Linux","Describe the Linux boot sequence.","ROM code, SPL and U-Boot, kernel with device tree and initramfs, mount rootfs, init or systemd, services."],
[65,"Embedded Linux","What is a device tree?","A data structure describing hardware (addresses, IRQs, clocks) so one kernel image supports many boards; drivers bind through compatible strings."],
[66,"Embedded Linux","How does a kernel module differ from a user program?","It runs in kernel space with full privileges, has no main(), loads with insmod and uses module_init and module_exit; a bug can crash the system."],
[67,"Embedded Linux","How does a char driver exchange data with user space?","Register file_operations (open, read, write, ioctl) and use copy_to_user and copy_from_user to cross the boundary safely."],
[68,"Embedded Linux","kmalloc vs vmalloc? Spinlock vs mutex in the kernel?","kmalloc: physically contiguous, fast. vmalloc: virtually contiguous only. Use spinlocks in atomic or interrupt context; mutexes may sleep."],
[69,"Embedded","RTOS vs general-purpose OS?","An RTOS gives deterministic, bounded latency with priority-based preemptive scheduling and a small footprint; a GPOS optimises throughput and fairness."],
[69,"Embedded","How does priority inheritance work in an RTOS?","A task holding a mutex temporarily inherits the priority of the highest-priority waiter, which prevents priority inversion."],
[72,"Design","Design a temperature monitoring system.","Clarify rate, accuracy, power and connectivity. Sensor, ADC or I2C, MCU filters and thresholds, local alarm and gateway (BLE, Wi-Fi or MQTT), cloud dashboard. Cover calibration, storage and failure handling."],
[73,"Design","Design a vehicle health monitoring system.","ECUs and sensors on CAN, a central gateway aggregating signals, fault codes with timestamps, local ring-buffer logging, telemetry upload, safety and watchdog handling."],
[74,"Design","Design a crash-safe logger for an MCU.","ISR-safe ring buffer in RAM, a background task flushing to flash with wear levelling and sequence numbers, a CRC per record, and recovery after power loss on boot."],
[75,"Design","Design an OTA firmware update.","Dual partitions (A/B), signed images verified by the bootloader, resumable download, a health check after boot, and automatic rollback."],
[76,"Design","How do you make a device recover from faults?","Watchdogs, heartbeats, safe states, fault logs persisted across resets, bounded retries, and fault-injection testing."],
[78,"C++","Where would you use Singleton, Observer and Strategy in firmware?","Singleton for a hardware manager (use sparingly), Observer for sensor events, Strategy for swappable algorithms or drivers behind a HAL."],
[79,"Behavioural","Tell me about yourself.","Present, past, future in about 90 seconds: current skills, key projects, why this role. End by linking your strengths to the team."],

{n:'Ring buffer',i:'',c:String.raw`#include <stdio.h>
#include <stdint.h>
#include <stdbool.h>

#define CAP 8 /* power of two */

typedef struct { uint8_t buf[CAP]; volatile uint32_t head, tail; } ring_t;

static bool ring_put(ring_t *r, uint8_t b) {
    if (r->head - r->tail == CAP) return false;   /* full */
    r->buf[r->head++ & (CAP - 1)] = b;
    return true;
}

static bool ring_get(ring_t *r, uint8_t *b) {
    if (r->head == r->tail) return false;         /* empty */
    *b = r->buf[r->tail++ & (CAP - 1)];
    return true;
}

int main(void) {
    ring_t r = {0};
    for (int i = 0; i < 10; i++)
        if (!ring_put(&r, (uint8_t)i)) printf("full at %d\n", i);
    uint8_t v;
    while (ring_get(&r, &v)) printf("%u ", v);
    printf("\n");
    return 0;
}
`},

static void *worker(void *arg) {
    (void)arg;
    for (int i = 0; i < 100000; i++) {

}

}

 const k={xp:0,dd:0,boss:0,solved:0,hard:0,qc:0,fs:0,runs:0,labs:0,mk:S.mk.length,proj:0,perfect:0},act=new Set();
 for(let n=1;n<=N;n++){const d=g(n);k.xp+=(d.core?20:0)+(d.pr?30:0)+(!PBD[n].length&&d.dsa?30:0)+(!ownQs(n).length&&d.iq?20:0);if(d.c){k.dd++;const b=isBoss(n);k.xp+=b?75:25;if(b)k.boss++;if(d.cd)act.add(d.cd)}}
 for(let w=1;w<=13;w++)if(R7(w).every(n=>g(n).c))k.perfect++;
 allP().forEach(p=>{const s=S.p[p.id];if(s&&s.st=='Solved'){k.solved++;k.xp+=XPD[p.d]||15;if(p.d=='Hard')k.hard++;if(s.dt)act.add(s.dt)}});
 allQ().forEach(x=>{const s=S.q[x.id];if(s){if(s.st=='Confident')k.qc++;k.xp+=s.xp!==undefined?s.xp:(s.st=='Confident'?5:0);if(s.rv)act.add(s.rv)}});
 PJ.forEach((p,i)=>{const c=((S.pj[i]||{}).ms||[]).filter(Boolean).length;k.xp+=c*8;if(c==p.m.length){k.proj++;k.xp+=40}});
 S.mk.forEach(m=>{k.xp+=5;act.add(m.dt)});
 for(const dt in S.fs){const c=S.fs[dt]||0;k.fs+=c;k.xp+=Math.min(c,8)*10;if(c)act.add(dt)}
 for(const w in (S.wl||{})){const L=WL[w-1];if(!L)continue;const c=((S.wl[w]||{}).s||[]).filter(Boolean).length;k.xp+=c*6;if(c==L.steps.length){k.labs++;k.xp+=60}}
 for(const dt in (S.runs||{})){const c=S.runs[dt]||0;k.runs+=c;k.xp+=Math.min(c,10)*2;if(c)act.add(dt)}
 let run=0,best=0,prev=null;[...act].sort().forEach(x=>{run=prev&&diffD(x,prev)==1?run+1:1;prev=x;best=Math.max(best,run);k.xp+=3*Math.min(run,10)});
 const t=today();let st=0,x=act.has(t)?t:addD(t,-1);while(act.has(x)){st++;x=addD(x,-1)}
 const dts=[];for(let n=1;n<=N;n++){const d=g(n);if(d.c&&d.cd)dts.push(d.cd)}dts.sort();let pen=0,ms=0;for(let i=1;i<Math.min(cal(),N+1);i++){const D=addD(S.start,i-1);if(dts.filter(x=>x<=D).length<i){pen+=20;ms++}}
 k.pen=pen;k.miss=ms;k.xp=Math.max(0,k.xp-pen);
 k.streak=st;k.best=best;k.act=act;k.lv=Math.floor(Math.sqrt(k.xp/60))+1;k.lo=60*(k.lv-1)**2;k.hi=60*k.lv**2;return k}

 const drill=dq?`<div class="card"><div class="row"><h3 class="grow">Quick drill</h3><span class="mu sm">${due.length} due</span><select data-f="dcat" aria-label="Drill category"><option value="">All categories</option>${opts(cats,F.dcat)}</select></div>${qcard(dq)}<div class="row" style="margin-top:8px">${ds&&ds.n&&ds.rv==today()?'<button class="pri" data-a="drnext">Next question</button>':'<button data-a="drskip">Skip for now</button>'}</div></div>`:`<div class="card"><h3>All caught up</h3><p class="mu">Nothing is due right now. Questions unlock as you progress through the plan, and solved ones return after 7 days.</p></div>`;
 const qo=[['New','Todo'],['Learning','Attempted'],['Confident','Solved'],['Skipped','Skipped']];
 const l=A.filter(x=>{const s=qs(x.id);return(!F.qc||x.c==F.qc)&&(!F.qs||(F.qs=='Skipped'?s.sk:s.st==F.qs))&&(x.q+' '+x.a).toLowerCase().includes(qq)});
 return drill+`<div class="card"><div class="f"><input type="search" id="f_qq" data-f="qq" placeholder="Search questions" value="${e(F.qq||'')}"><select data-f="qc"><option value="">All categories</option>${opts(cats,F.qc)}</select><select data-f="qs"><option value="">All statuses</option>${qo.map(o=>`<option value="${o[0]}"${F.qs==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div>
 <p class="mu sm" style="margin:10px 0 0">Answers are graded by checking your sentences for the key ideas of the model answer. XP depends on difficulty and drops with each extra attempt: 100%, 75%, then 50%. Giving up first cuts later XP to a quarter.</p>
 <div class="row" style="margin-top:10px"><input id="nq" class="grow" placeholder="Add your own question"><select id="nc">${opts(cats)}</select></div><textarea id="na" style="min-height:56px;margin-top:8px" placeholder="Model answer (optional, used for grading)"></textarea><div style="margin-top:8px"><button data-a="qAdd">Add question</button></div></div>
 <div class="mu sm" style="margin:8px 2px">${l.length} questions, ${A.filter(x=>qs(x.id).st=='Confident').length} solved</div>`+
 l.map(x=>`<div class="card">${qcard(x)}<div class="row" style="margin-top:6px"><span class="mu sm grow">${x.day?'Day '+x.day+'. ':''}Last attempt: ${qs(x.id).rv||'never'}</span>${x.id[0]=='c'?`<button class="sbtn" data-a="qDel" data-i="${x.id}">Delete</button>`:''}</div></div>`).join('')}

function vProjects(){return `<div class="card"><h2>Milestone projects</h2><p class="mu">Interviewers ask about what is on your resume. Finish three of these properly (code, tests, README) rather than starting ten. Each milestone earns 8 XP, finishing a project earns 40 more.</p></div>`+PJ.map((p,i)=>{const s=S.pj[i]||{},m=s.ms||[],c=m.filter(Boolean).length,t=p.m.length;
 return `<div class="card"><div class="row"><h3 class="grow">${e(p.n)}</h3><span class="xp">${c==t?'Shipped':c+' / '+t+' milestones'}</span></div><p class="mu">${e(p.d)}</p><div class="bar"><i style="width:${c/t*100}%"></i></div>${p.m.map((x,j)=>`<label class="chk"><input type="checkbox" data-a="ms" data-i="${i}:${j}" ${m[j]?'checked':''}>${e(x)}</label>`).join('')}<textarea data-s="pj:${i}:note" placeholder="Repo link, notes, what is left">${e(s.note||'')}</textarea><div class="mu sm">Planned on days: ${p.days.join(', ')}</div></div>`}).join('')}

function vWeekend(){const cw=wk(cur());
 return `<div class="card"><h2>Weekend labs</h2><p class="mu">One hands-on lab per week, about 4 to 6 hours across the weekend (Day 6 and 7 of each week). Each one applies that week's topics to something you build, test and can explain in interviews. Tick each step as you go: 6 XP per step and 60 XP for finishing the lab. Put every lab on GitHub with a README.</p></div>`+
 WL.map(L=>{const s=(S.wl&&S.wl[L.w])||{},m=s.s||[],c=m.filter(Boolean).length,t=L.steps.length,k='wl'+L.w;
 return `<details data-k="${k}" ${OPEN.has(k)?'open':''}><summary class="${c==t?'dn':''}">Week ${L.w} lab: ${e(L.n)} <span class="mu sm">(${e(L.t)}, ${c}/${t} steps)</span>${L.w==cw?' <span class="pill" style="color:var(--cu)">This week</span>':''}</summary><div class="in">
 <div class="bar"><i style="width:${c/t*100}%"></i></div>
 <p><b>Goal.</b> ${e(L.goal)}</p><p><b>Why it matters this week.</b> ${e(L.why)}</p>
 <h3 style="margin-top:12px">Steps</h3>${L.steps.map((x,j)=>`<label class="chk wlstep"><input type="checkbox" data-a="ws" data-i="${L.w}:${j}" ${m[j]?'checked':''}><span><b>${j+1}. ${e(x[0])}</b><br><span class="mu">${e(x[1])}</span></span></label>`).join('')}
 <h3 style="margin-top:12px">You are done when</h3><ul class="tl">${L.ok.split(';').map(x=>`<li>${e(x)}</li>`).join('')}</ul>
 <h3>Stretch goals</h3><ul class="tl">${L.more.split(';').map(x=>`<li>${e(x)}</li>`).join('')}</ul>
 <h3>What to say in interviews</h3><p class="ans">${e(L.say)}</p>
 <div class="rs">${L.res.map(r=>`<a target="_blank" rel="noopener" href="${e(r[1])}">${e(r[0])}</a>`).join('')}</div>
 <textarea data-s="wl:${L.w}:note" style="margin-top:10px" placeholder="Repo link, what broke, what you learned">${e(s.note||'')}</textarea></div></details>`}).join('')}
function vBuild(){const bt=F.bt||'weekend';return `<div class="row" style="margin-bottom:12px"><button class="${bt=='weekend'?'pri':''}" data-a="bt" data-i="weekend">Weekend labs (13)</button><button class="${bt=='proj'?'pri':''}" data-a="bt" data-i="proj">Milestone projects (10)</button></div>`+(bt=='weekend'?vWeekend():vProjects())}
function vProg(){const A=allP(),cats=[...new Set(A.map(p=>p.c))],qc=[...new Set(allQ().map(x=>x.c))],w=+F.rw||wk(cur()),r=S.rv[w]||{};
 const tiles=[['Total XP',K.xp.toLocaleString()],['Level',K.lv+', '+title(K.lv)],['Current streak',K.streak+' days'],['Best streak',K.best+' days'],['Days complete',K.dd+' / '+N],['Problems solved',K.solved+' / '+A.length],['Questions solved',K.qc+' / '+allQ().length],['Focus sessions',K.fs],['Boss days beaten',K.boss],['Missed-day penalty','-'+K.pen+' XP ('+K.miss+' days)']];
 const bars=(l,fn)=>l.map(c=>{const [a,b]=fn(c);return `<div><div class="row"><span class="grow">${e(c)}</span><span class="mu sm">${a} / ${b}</span></div><div class="bar"><i style="width:${b?a/b*100:0}%"></i></div></div>`}).join('');
 const ta=(k,l)=>`<h3 style="margin-top:12px">${l}</h3><textarea data-s="rv:${w}:${k}">${e(r[k]||'')}</textarea>`;
 const hm=Array.from({length:N},(_,i)=>{const n=i+1,p=dprog(n).p,st=dstat(n);return `<button class="hc ${st=='new'?(p>0?'l2':''):'s-'+st}" data-a="go" data-i="${n}" title="Day ${n}: ${Math.round(p*100)}%" aria-label="Day ${n}"></button>`}).join('');
 return `<div class="stats">${tiles.map(t=>`<div class="st"><span>${t[0]}</span><b>${t[1]}</b></div>`).join('')}</div>
 <div class="card"><h3>Problems solved</h3>${ring()}</div>
 <div class="card"><h3>90-day heatmap</h3><p class="mu sm">Each column is a week.</p>${legend()}<div class="hm" style="margin-top:8px">${hm}</div></div>
 <div class="card"><h3>Badges (${Object.keys(S.bd).length} / ${BG.length})</h3><div class="bgs" style="margin-top:10px">${BG.map(b=>`<div class="bg ${S.bd[b[0]]?'':'lock'}"><div class="em">${b[1]}</div><b>${b[2]}</b><span class="mu sm">${b[3]}</span></div>`).join('')}</div></div>
 <div class="two"><div class="card"><h3>DSA by category</h3>${bars(cats,c=>[A.filter(p=>p.c==c&&ps(p.id).st=='Solved').length,A.filter(p=>p.c==c).length])}</div><div class="card"><h3>Questions by topic</h3>${bars(qc,c=>[allQ().filter(x=>x.c==c&&qs(x.id).st=='Confident').length,allQ().filter(x=>x.c==c).length])}</div></div>
 <div class="card"><div class="row"><h3 class="grow">Weekly review</h3><select data-f="rw">${Array.from({length:13},(_,i)=>`<option value="${i+1}"${i+1==w?' selected':''}>Week ${i+1}: ${e(WK[i][1])}</option>`).join('')}</select></div>${ta('learned','What I learned')}${ta('struggled','What I struggled with')}${ta('revisit','Topics to revisit')}${ta('next','Plan for next week')}</div>`}

function vMk(){const l=S.mk.filter(m=>!F.mt||m.tp==F.mt),tp=[...new Set(S.mk.map(m=>m.tp))],cats=[...new Set(allQ().map(x=>x.c)),'DSA'];
 const ta=(i,p)=>`<textarea id="${i}" placeholder="${p}" style="min-height:56px;margin-top:8px"></textarea>`;
 return `<div class="card"><h3>Log a mistake (+5 XP)</h3><p class="mu sm">Writing down what went wrong is the fastest way to stop repeating it.</p><div class="f" style="margin-top:8px"><input type="date" id="md" value="${today()}"><select id="mt">${opts(cats)}</select></div>${ta('mq','Question or problem')}${ta('mw','What I did wrong')}${ta('mc','Correct concept')}${ta('ma','How I will avoid it next time')}<div style="margin-top:10px"><button class="pri" data-a="mkAdd">Add to log</button></div></div>
 <div class="row" style="margin:6px 2px"><b class="grow">${l.length} entries</b><select data-f="mt"><option value="">All topics</option>${opts(tp,F.mt)}</select></div>`+
 l.map(m=>`<div class="card"><div class="row"><b class="grow">${e(m.q)}</b><span class="tag cat">${e(m.tp)}</span><span class="mu sm">${m.dt}</span><button class="sbtn" data-a="mkDel" data-i="${m.id}">Delete</button></div><p><b>Wrong:</b> ${e(m.w)}</p><p><b>Correct:</b> ${e(m.c)}</p><p><b>Next time:</b> ${e(m.a)}</p></div>`).join('')}

function vSet(){return `<div class="card"><h3>Start date (Day 1)</h3><div class="row"><input type="date" id="sd" value="${S.start}"><button data-a="sd">Save start date</button></div><p class="mu sm">Missing days never resets progress. If you fall behind, unfinished days roll over automatically and each missed day costs 20 XP.</p>
 <h3 style="margin-top:16px">Backup</h3><p class="mu sm">Progress is saved in this browser only. Download a backup regularly.</p><div class="row"><button data-a="exp">Download JSON</button><button data-a="copy">Copy JSON</button><input type="file" id="imf" accept=".json,application/json"><button data-a="impF">Import file</button></div>
 <textarea id="jb" style="margin-top:8px" placeholder="Or paste backup JSON here, then click Import pasted"></textarea><div class="row" style="margin-top:6px"><button data-a="impT">Import pasted</button><button data-a="show">Show current JSON</button></div>
 <h3 style="margin-top:16px">Reset</h3><button data-a="rst" style="color:var(--bd)">Reset all progress</button></div>`}

const sec=(k,t,h)=>`<details data-k="${k}" ${OPEN.has(k)?'open':''}><summary>${t}</summary><div class="in">${h}</div></details>`;
const lk=(t,u)=>`<a target="_blank" rel="noopener" href="${u}">${t}</a>`;
function vGuide(){return `<div class="guide"><div class="card"><h2>The complete guide</h2><p class="mu">How to use this app, how the 90 days are built, and how to turn the preparation into an offer. Read sections 1 and 2 today, the rest when you need them.</p></div>
${sec('g0','1. Your daily routine (about 3 hours)',`<ol><li><b>Open Today and start the focus timer.</b> Work in 25-minute blocks with your phone away.</li><li><b>Learn (60 min):</b> read the topic, watch one video, write notes in your own words. Do not binge-watch.</li><li><b>DSA (60 min):</b> solve the day's LeetCode problems. Stuck for 20 minutes? Read a hint, then re-solve from scratch tomorrow. Star anything that hurt.</li><li><b>Drill (20 min):</b> type each answer in your own words and press Submit. It is graded against the key ideas of the model answer, you see which ideas you missed, and XP drops with each extra attempt.</li><li><b>Build (30 min):</b> type the code. Reading is not practice.</li><li><b>Close the day:</b> write two lines of notes and log any mistake. The day turns green automatically when everything is done or skipped.</li></ol><p><b>Short on time?</b> Do one DSA problem and the drill, then catch up at the weekend. A short day beats a skipped day.</p><div class="tw"><table><tr><th>Action</th><th>XP</th></tr><tr><td>Learn quest / Build quest</td><td>20 / 30</td></tr><tr><td>Problem solved (Easy, Medium, Hard)</td><td>10 / 25 / 50 (skipped earns 0)</td></tr><tr><td>Interview question accepted (Easy, Medium, Hard)</td><td>8 / 12 / 20 on the first try, 75% on the second, 50% after; 35% for a partially correct answer; quarter XP if you gave up first</td></tr><tr><td>Day complete (all items done or skipped) / boss day</td><td>25 / 75</td></tr><tr><td>Project milestone / project finished</td><td>8 / 40</td></tr><tr><td>Weekend lab step / lab finished</td><td>6 / 60</td></tr><tr><td>Focus session (max 8 a day) / mistake logged / code run (max 10 a day)</td><td>10 / 5 / 2</td></tr><tr><td>Streak bonus</td><td>up to 30 a day</td></tr><tr><td><b>Missed day</b></td><td><b>-20 each. The unfinished day rolls over to today.</b></td></tr></table></div>`)}
${sec('g1','2. The 90-day plan at a glance',`<div class="tw"><table><tr><th>Phase</th><th>Days</th><th>Focus</th><th>You can do this at the end</th></tr><tr><td><b>Boot</b></td><td>1-21</td><td>C, C++, toolchain, GDB, DSA basics</td><td>Write and debug C/C++, solve easy and medium array, string, list and stack problems</td></tr><tr><td><b>Kernel</b></td><td>22-42</td><td>OS, Linux, memory, IPC, interrupts</td><td>Explain processes, virtual memory, scheduling; write Linux C programs</td></tr><tr><td><b>I/O</b></td><td>43-63</td><td>Networking, multithreading, UART/I2C/SPI/CAN, DMA</td><td>Build socket servers, write thread-safe code, reason about buses</td></tr><tr><td><b>Firmware</b></td><td>64-84</td><td>Embedded Linux, RTOS, design, capstone, behavioural</td><td>Write drivers, answer design questions, show a polished project</td></tr><tr><td><b>Ship</b></td><td>85-90</td><td>Resume, mocks, applications</td><td>Interview calmly</td></tr></table></div><p><b>Start applying around Day 60.</b> Real interviews teach more than any mock, and most hiring processes take weeks. Every 7th day is a boss day: a timed test plus a drill of that whole week's questions.</p>`)}
${sec('g2','3. How to practise LeetCode so it sticks',`<ol><li>Read the problem and restate it. Write two examples and one edge case before coding.</li><li>Give yourself <b>20 minutes</b>. Then read a hint or the approach, never the full code first.</li><li>Code it yourself in a plain editor, without autocomplete. State time and space complexity aloud.</li><li><b>Star it</b> if you needed help. Re-solve starred problems after 1, 3, 7 and 21 days. The Revisit queue on Today shows them.</li><li>Name the pattern in your notes (see the cheat sheet on the DSA tab). Patterns transfer; solutions do not.</li></ol><p>Targets that match a good-company bar: all Easy comfortable in 15 minutes, most Medium in 30, and 2 to 3 Hard problems understood. ${lk('NeetCode 150','https://neetcode.io/practice')} and ${lk('LeetCode study plans','https://leetcode.com/studyplan/')} are good places to extend beyond this list.</p>`)}
${sec('g3','4. What embedded and systems interviews look like',`<div class="tw"><table><tr><th>Round</th><th>What it tests</th><th>Where to prepare here</th></tr><tr><td>Online test or screening</td><td>DSA mediums, C/C++ output questions, aptitude</td><td>DSA tab, C and C++ questions</td></tr><tr><td>Coding (1 to 2 rounds)</td><td>1 to 2 problems in 45 minutes, clean code, complexity</td><td>Days 1 to 63, mock days 86 and 90</td></tr><tr><td>Fundamentals</td><td>C/C++, OS, Linux, networking, concurrency</td><td>Q&A tab and drill</td></tr><tr><td>Embedded</td><td>Buses, interrupts, drivers, RTOS, debugging stories</td><td>Days 57 to 70, projects</td></tr><tr><td>Design</td><td>Embedded system or low-level design, trade-offs</td><td>Days 71 to 78</td></tr><tr><td>Manager and HR</td><td>Projects, ownership, teamwork, motivation</td><td>Day 79, STAR stories</td></tr></table></div><ul><li>Ask clarifying questions first. State assumptions. Think aloud.</li><li>Be ready to write in C: pointers, bit ops, linked lists, ring buffers, string functions.</li><li>Anything on your resume is fair game. If you list a protocol or a project, know it deeply.</li><li>Say what you do not know, then reason toward an answer. Bluffing is the fastest way to lose an offer.</li></ul>`)}
${sec('g4','5. Where to apply',`<p>Hiring varies by year and team, so open the careers page and filter for firmware, embedded, systems, driver, BSP, validation and networking roles.</p><div class="rs">${[['NVIDIA','https://www.nvidia.com/en-us/about-nvidia/careers/'],['Qualcomm','https://www.qualcomm.com/company/careers'],['Intel','https://jobs.intel.com'],['AMD','https://careers.amd.com'],['Texas Instruments','https://careers.ti.com'],['Bosch','https://www.bosch.com/careers/'],['Cisco','https://jobs.cisco.com'],['Arista','https://www.arista.com/en/careers'],['Apple','https://jobs.apple.com'],['Microsoft','https://careers.microsoft.com'],['Google','https://www.google.com/about/careers/applications/'],['Tesla','https://www.tesla.com/careers']].map(c=>lk(c[0],c[1])).join('')}</div><p>Also look at automotive suppliers, networking and storage companies, and IoT product startups. Ask for referrals: they beat cold applications by a wide margin.</p>`)}
${sec('g5','6. Behavioural answers (STAR)',`<p>Prepare six stories and reuse them: a hard bug, a project you owned, a conflict, a failure, a deadline under pressure, and something you learned fast. For each: <b>Situation</b> (1 sentence), <b>Task</b> (your responsibility), <b>Action</b> (what you did, with specifics and tools), <b>Result</b> (a number if possible, plus what you learned).</p><p>Prepare a 90-second "tell me about yourself": present role and skills, past projects, and why this team. Practise it out loud until it sounds natural.</p>`)}
${sec('g6','7. Resume and projects',`<ul><li>One page. Lead with skills and projects if you have little experience.</li><li>Bullet formula: <i>Built X using Y, which achieved Z</i>. Example: Built a lock-free ring buffer in C++ that sustained 2M messages per second under TSan-clean tests.</li><li>List C, C++, Linux, RTOS, protocols and tools you can discuss for 10 minutes.</li><li>Put the capstone and two other projects on GitHub with a README: what it does, how to build, how to run, design notes.</li></ul>`)}
${sec('g7','8. Resource library',`<div class="tw"><table><tr><th>Topic</th><th>Free resources</th></tr><tr><td>C and C++</td><td>${lk("Beej's Guide to C",'https://beej.us/guide/bgc/')}, ${lk('learncpp.com','https://www.learncpp.com/')}, ${lk('cppreference','https://en.cppreference.com/')}, ${lk('Compiler Explorer','https://godbolt.org/')}</td></tr><tr><td>Operating systems</td><td>${lk('OSTEP','https://pages.cs.wisc.edu/~remzi/OSTEP/')}, ${lk('Linux man pages','https://man7.org/linux/man-pages/')}, ${lk('The Missing Semester','https://missing.csail.mit.edu/')}</td></tr><tr><td>Networking</td><td>${lk("Beej's Network Guide",'https://beej.us/guide/bgnet/')}, ${lk('Cloudflare Learning Center','https://www.cloudflare.com/learning/')}, ${lk('Wireshark docs','https://www.wireshark.org/docs/')}</td></tr><tr><td>Concurrency</td><td>${lk('POSIX threads (LLNL)','https://hpc-tutorials.llnl.gov/posix/')}, ${lk('Preshing','https://preshing.com/')}, ${lk('C++ threads','https://en.cppreference.com/w/cpp/thread')}</td></tr><tr><td>Embedded</td><td>${lk('Memfault Interrupt','https://interrupt.memfault.com/')}, ${lk('Embedded Artistry','https://embeddedartistry.com/')}, ${lk('Arm docs','https://developer.arm.com/documentation/')}, ${lk('Wokwi simulator','https://wokwi.com/')}, ${lk('Barr C standard','https://barrgroup.com/embedded-systems/books/embedded-c-coding-standard')}</td></tr><tr><td>Embedded Linux and RTOS</td><td>${lk('Bootlin training','https://bootlin.com/training/')}, ${lk('Linux Kernel Labs','https://linux-kernel-labs.github.io/refs/heads/master/')}, ${lk('Linux kernel docs','https://docs.kernel.org/')}, ${lk('FreeRTOS docs','https://www.freertos.org/Documentation/00-Overview')}</td></tr><tr><td>DSA and mocks</td><td>${lk('LeetCode','https://leetcode.com/problemset/')}, ${lk('NeetCode','https://neetcode.io/roadmap')}, ${lk('Pramp','https://www.pramp.com/')}, ${lk('interviewing.io','https://interviewing.io/')}, ${lk('System Design Primer','https://github.com/donnemartin/system-design-primer')}</td></tr></table></div>`)}
${sec('gw','Weekend labs: how to get the most from them',`<ul><li>Each week ends with a hands-on lab (Projects tab, Weekend labs). Block 4 to 6 hours across Day 6 and 7. Day 7 is also a boss day, so do the lab on Day 6 and the first half of Day 7 if needed.</li><li>Do the steps in order. Each step says exactly what to type or build. If you get stuck for 30 minutes, read the linked man page or docs, then ask for help.</li><li>Treat "You are done when" as the acceptance test. If a check fails, the lab is not done.</li><li>Commit every lab to GitHub with a README. By Day 90 you will have 13 small projects, which is a real portfolio.</li><li>Skipping a lab? Do not skip weeks 4 to 11: they are the strongest interview material.</li></ul>`)}
${sec('gl','Code Lab: compile and run code in the app',`<ul><li>Open the <b>Code Lab</b> tab, pick C, C++, Python or JavaScript, load a template, edit, press <b>Run</b> (or Ctrl+Enter). Add input in the Standard input box.</li><li>C, C++ and Python are compiled on the free public Judge0 service, so they need internet, take a few seconds and can be rate-limited. Your code is sent to that service. Do not paste anything confidential.</li><li>JavaScript runs privately in your browser and supports <b>Live run</b>, which re-runs as you type.</li><li>It runs normal programs: algorithms, pointers, bit tricks, pthreads, fork. It cannot run hardware registers, kernel modules or drivers. For those use QEMU, ${lk('Wokwi','https://wokwi.com/')} or a Linux machine, and ${lk('Compiler Explorer','https://godbolt.org/')} to study generated assembly.</li><li>Each successful run earns 2 XP (up to 10 a day).</li></ul>`)}
${sec('gv','Best YouTube channels (by topic)',`<p>Every day on the Today tab has video chips that search the topic on the right channels. Subscribe to these:</p><div class="rs">${Object.values(CH).map(c=>lk('▶ '+c[0],c[1])).join('')}</div><ul><li><b>DSA:</b> NeetCode (every problem here has a video link), take U forward.</li><li><b>C, C++, systems:</b> Jacob Sorber, The Cherno, CppCon, Low Level Learning.</li><li><b>OS and networking:</b> Neso Academy, Gate Smashers, Practical Networking.</li><li><b>Embedded and Linux:</b> Phil's Lab, Bootlin.</li><li><b>Mocks:</b> interviewing.io.</li></ul>`)}
${sec('gb','Is this enough for big tech? Honest gaps',`<p>This plan targets Google, Amazon, Microsoft, Apple, NVIDIA and Qualcomm-level bars for embedded and systems roles. What it cannot do for you:</p><ul><li><b>DSA volume (now built in):</b> the plan has ${PL.length} problems, ${PL.filter(p=>p.d=='Hard').length} of them Hard. Days 71 to 90 are deliberately harder: Hard-heavy sets, then timed mock days.</li><li><b>Timed practice:</b> from Day 40, treat each boss day as a timed round: 2 problems in 60 minutes. On busy days, do the Medium and Hard of the day's topic first and star the rest.</li><li><b>Real mocks:</b> at least 6 with other people (Pramp, interviewing.io, friends). Solo practice hides communication gaps.</li><li><b>Depth over breadth:</b> big teams probe one topic for 20 minutes. Pick 3 strengths (for example Linux drivers, RTOS, networking) and go deep.</li><li><b>Experience signal:</b> one strong, public, well-documented project beats five half-finished ones.</li><li><b>Time:</b> 90 days is tight if you start from zero. Treat Day 90 as the start of applications, and keep 1 to 2 hours a day of DSA going afterwards.</li></ul><p>Nobody can guarantee an offer. Consistency, mocks and applying widely matter most.</p>`)}
${sec('g8','9. If you fall behind, and interview-day checklist',`<ul><li>Never reset. If you miss a day, it costs 20 XP and the unfinished day rolls over into today automatically, so you always continue from where you stopped.</li><li>Cut Build before you cut DSA or Drill. Keep the capstone days (80 to 83) intact.</li><li>Merge two light days into one rather than rushing a hard topic.</li></ul><p><b>Before the interview:</b> sleep, test your audio and editor, have water, and review your cheat sheets and Mistake Log, not new topics. <b>During:</b> clarify, plan, code, test with an example, state complexity. <b>After:</b> write down every question you missed and add it to the Mistake Log.</p>`)}</div>`}

const VW={lab:vLab,today:vToday,road:vRoad,dsa:vDsa,qa:vQa,build:vBuild,guide:vGuide,prog:vProg,mk:vMk,set:vSet};
function R(){const y=scrollY;document.documentElement.dataset.theme=S.theme||'';const nd=touchAll();K=calc();gain();if(nd.length)setTimeout(()=>{toast('<b>Day '+nd[0]+' complete</b><br>Bonus +'+(isBoss(nd[0])?75:25)+' XP',1);burst()},350);S.tab=V;$('#app').innerHTML=head()+VW[V]();scrollTo(0,TOP?0:y);TOP=false}
function imp(t){try{const x=JSON.parse(t);if(!x||!x.done||!x.p)throw 0;if(!confirm('Replace current data with the imported backup?'))return;S=Object.assign(seed(),x);PX=null;save();R();alert('Imported.')}catch(_){alert('Import failed: not a valid backup file.')}}
function setv(a,i,k,v){if(a=='done')dn(i)[k]=v;else if(a=='p')pw(i)[k]=v;else if(a=='q')qw(i)[k]=v;else if(a=='rv')(S.rv[i]||(S.rv[i]={}))[k]=v;else if(a=='wl')(S.wl[i]||(S.wl[i]={}))[k]=v;else if(a=='pj')(S.pj[i]||(S.pj[i]={}))[k]=v}

document.addEventListener('input',ev=>{const t=ev.target;
 if(t.dataset.code){labInput(t);return}
 if(t.dataset.s){const[a,i,k]=t.dataset.s.split(':');setv(a,i,k,t.value);save();return}
 if(t.dataset.f&&t.tagName!='SELECT'){F[t.dataset.f]=t.value;R();const x=document.getElementById('f_'+t.dataset.f);if(x){x.focus();x.setSelectionRange(1e3,1e3)}}});
document.addEventListener('toggle',ev=>{const k=ev.target.dataset&&ev.target.dataset.k;if(k){ev.target.open?OPEN.add(k):OPEN.delete(k)}},true);
document.addEventListener('change',ev=>{const t=ev.target,a=t.dataset.a,n=SEL||cur(),i=t.dataset.i;
 if(t.dataset.f&&t.tagName=='SELECT'){F[t.dataset.f]=t.value;if(t.dataset.f=='dcat'){DR.id=null;DR.show=false}R();return}
 if(!a)return;
 if(a=='chk')dn(n)[i]=t.checked;
 else if(a=='pst'){const s=pw(i);s.st=t.value;s.dt=t.value=='Solved'?(s.dt||today()):''}
 else if(a=='ms'){const[p,j]=i.split(':'),o=S.pj[p]||(S.pj[p]={});o.ms=o.ms||[];o.ms[j]=t.checked}
 else if(a=='tmlen'){S.focus=+t.value}
 else if(a=='ws'){const[w,j]=i.split(':');S.wl=S.wl||{};const o=S.wl[w]||(S.wl[w]={});o.s=o.s||[];o.s[j]=t.checked}
 else if(a=='labl'){LAB.lang=t.value;LAB.res=null}
 else if(a=='labt'){if(t.value==='')return;labTpl(+t.value)}
 else if(a=='live'){LAB.live=t.checked;if(t.checked&&LAB.lang=='js'){R();runJS(0);return}}
 R()});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(!t||t.tagName=='SELECT'||t.type=='checkbox')return;const a=t.dataset.a,i=t.dataset.i,n=SEL||cur(),v=id=>$('#'+id).value.trim();
 if(a=='tab'){V=i;TOP=true}
 else if(a=='go'){SEL=+i;V='today';TOP=true}
 else if(a=='nav'){SEL=Math.max(1,Math.min(N,n+ +i));TOP=true}
 else if(a=='now'){SEL=0;TOP=true}
 else if(a=='star'){const s=pw(i);s.star=s.star?0:1}
 else if(a=='tmgo'){if(TM){TM=null;document.title=T0}else TM={end:Date.now()+S.focus*60000}}
 else if(a=='theme'){const dark=S.theme?S.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=dark?'light':'dark'}
 else if(a=='run'){labRun();return}
 else if(a=='bt'){F.bt=i}
 else if(a=='openlab'){F.bt='weekend';OPEN.add('wl'+i);V='build';TOP=true}
 else if(a=='qsub'){qsub(i)}
 else if(a=='qskip'){const z=qw(i);z.sk=z.sk?0:1}
 else if(a=='qgive'){const z=qw(i);z.gave=1;if(z.st!='Confident')z.st='Learning';z.rv=today()}
 else if(a=='drnext'){DR.id=null;DR.show=false}
 else if(a=='drskip'){DR.skip.push(DR.id);DR.id=null;DR.show=false}
 else if(a=='dsaAdd'){if(!v('an'))return;S.cp.push({id:'c'+S.nid++,n:v('an'),c:v('ac'),d:v('ad'),u:v('au'),day:0})}
 else if(a=='dsaDel'){if(confirm('Delete this problem?')){S.cp=S.cp.filter(p=>p.id!=i);delete S.p[i]}}
 else if(a=='qAdd'){if(!v('nq'))return;S.cq.push({id:'cq'+S.nid++,day:0,c:v('nc'),q:v('nq'),a:v('na')})}
 else if(a=='qDel'){if(confirm('Delete this question?')){S.cq=S.cq.filter(x=>x.id!=i);delete S.q[i]}}
 else if(a=='mkAdd'){if(!v('mq')){alert('Add the question or problem first.');return}S.mk.unshift({id:S.nid++,dt:v('md')||today(),tp:v('mt'),q:v('mq'),w:v('mw'),c:v('mc'),a:v('ma')})}
 else if(a=='mkDel'){if(confirm('Delete this entry?'))S.mk=S.mk.filter(m=>m.id!=i)}
 else if(a=='sd'){if(v('sd'))S.start=v('sd')}
 else if(a=='exp'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='firmware-quest-backup-'+today()+'.json';l.click();return}
 else if(a=='show'){$('#jb').value=JSON.stringify(S,null,1);return}
 else if(a=='copy'){const j=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>alert('Copied.'),()=>{$('#jb').value=j;alert('Clipboard blocked. The JSON is in the box; copy it manually.')});return}
 else if(a=='impT'){imp($('#jb').value);return}
 else if(a=='impF'){const f=$('#imf').files[0];if(!f){alert('Choose a .json file first.');return}const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f);return}
 else if(a=='rst'){if(confirm('Reset ALL progress, notes and custom items? This cannot be undone.')){S=seed();SEL=0;PX=null}else return}
 R()});
document.addEventListener('keydown',ev=>{const t=ev.target;if(t.id!='ed')return;
 if((ev.ctrlKey||ev.metaKey)&&ev.key=='Enter'){ev.preventDefault();labRun()}
 else if(ev.key=='Escape')LAB.esc=true;
 else if(ev.key=='Tab'&&!ev.shiftKey&&!LAB.esc){ev.preventDefault();t.setRangeText('    ',t.selectionStart,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}))}});
document.addEventListener('focusin',ev=>{if(ev.target.id=='ed')LAB.esc=false});
document.addEventListener('scroll',ev=>{if(ev.target.id=='ed'){const g=$('#gut');if(g)g.scrollTop=ev.target.scrollTop}},true);
R();
</script></body></html>
