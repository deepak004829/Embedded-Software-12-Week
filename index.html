[1,"C","What is the difference between stack and heap?","Stack: automatic, LIFO, fast, small and per-thread; freed on return. Heap: manual (malloc/free), flexible lifetime, slower, can fragment or leak."],
[1,"C","Where are global, static and constant data stored?","Initialised globals and statics in .data, zero-initialised in .bss, string literals and const data in .rodata; code in .text."],
[1,"C","Dangling pointer vs wild pointer?","Dangling: points to memory already freed or out of scope. Wild: never initialised. Initialise pointers and set them to NULL after free."],
[2,"C","What is the difference between arr and &arr?","arr decays to &arr[0] (type T*); &arr is a pointer to the whole array (T(*)[N]). Same address, but +1 steps by one element vs the whole array."],
[2,"C","const int* vs int* const?","const int*: pointee is read-only, pointer can move. int* const: pointer is fixed, pointee writable. Read the declaration right to left."],
[2,"C","Why does sizeof(arr) differ inside a function?","Array parameters decay to pointers, so sizeof gives the pointer size. Pass the length explicitly."],
[3,"C","memcpy vs memmove?","memmove is safe for overlapping regions; memcpy is undefined if they overlap and may be faster."],
[3,"C","strlen vs sizeof on a char array?","strlen counts characters up to the terminating \\0 at run time; sizeof is the compile-time size of the whole array including the terminator."],
[4,"C","Why does struct padding exist and how do you reduce it?","CPUs access aligned data faster (or only aligned). The compiler pads members to alignment; order members from largest to smallest or use packed (watch for unaligned access)."],
[4,"C","How do you detect endianness?","Store 0x01 in a uint32_t and read the first byte through a char pointer: 1 means little-endian. Network byte order is big-endian."],
[4,"Embedded","Why are unions and bit fields used for registers?","They overlay named fields on a raw word for readable register access. Bit-field layout is implementation-defined, so portable code prefers masks and shifts."],
[5,"C","How do you set, clear, toggle and test bit n?","Set: x |= (1u<<n). Clear: x &= ~(1u<<n). Toggle: x ^= (1u<<n). Test: (x>>n)&1."],
[5,"C","How do you check for a power of two and count set bits?","Power of two: n>0 && (n&(n-1))==0. Count bits (Kernighan): repeat n &= n-1 until zero; one iteration per set bit."],
[6,"C","What does volatile do and when is it needed?","It stops the compiler caching or removing accesses. Needed for MMIO registers and flags changed by ISRs. It does not give atomicity or thread synchronization."],
[6,"C","What does static mean in C?","Local static: keeps its value across calls. File-scope static: internal linkage, visible only in that file."],
[6,"C","Macro vs inline function?","Macros are textual, untyped and can evaluate arguments twice. Inline functions are typed and debuggable; prefer them."],
[8,"C","What happens when malloc fails, and what does free(NULL) do?","malloc returns NULL, so always check it. free(NULL) is a safe no-op."],
[8,"C","What are the realloc pitfalls?","It may move the block and returns NULL on failure; assign to a temporary pointer so you do not leak the original."],
[8,"C","Memory leak vs use-after-free vs double free?","Leak: memory lost without free. Use-after-free: access after free. Double free: freeing twice corrupts the heap. Tools: ASan and Valgrind."],
[9,"C","How do you implement a state machine in C?","enum for states and events, then a switch or a table of function pointers indexed by state and event; keep actions separate from transitions."],
[10,"C","How do you build a generic container in C?","Store void* plus the element size, and accept function pointers for compare, copy and free. Document ownership clearly."],
[11,"C++","What is RAII?","Resource lifetime is tied to object lifetime: acquire in the constructor, release in the destructor, so cleanup runs on every exit path."],
[11,"C++","What are the rules of three, five and zero?","If you define a destructor, copy constructor or copy assignment, define all three (five with move). Better: use RAII members so you define none."],
[12,"C++","How do virtual functions work?","Each polymorphic object holds a vptr to its class vtable of function pointers; calls are resolved through it at run time."],
[12,"C++","Why do base classes need virtual destructors?","Deleting a derived object through a base pointer without one is undefined behaviour and skips the derived destructor."],
[12,"C++","Overload vs override vs hide?","Overload: same name, different parameters. Override: derived replaces a virtual function. Hide: a derived name shadows base overloads."],
[13,"C++","unique_ptr vs shared_ptr vs weak_ptr?","unique_ptr: sole ownership, no overhead. shared_ptr: reference-counted shared ownership. weak_ptr: non-owning observer that breaks cycles."],
[13,"C++","What is move semantics?","Transfers resources from a temporary instead of copying, using rvalue references and std::move; the source stays valid but unspecified."],
[15,"C++","How does vector grow and when are iterators invalidated?","Growth is amortised O(1) via capacity doubling; reallocation invalidates all iterators, insert or erase invalidates those after the point."],
[15,"C++","map vs unordered_map?","map: balanced tree, ordered, O(log n). unordered_map: hash table, average O(1), worst O(n), unordered."],
[16,"C++","Pointer vs reference?","A reference is an alias that must bind at initialisation and cannot be reseated or null; a pointer can be null, reassigned and has its own address."],
[17,"C","Explain the compilation stages.","Preprocess (macros, includes), compile (to assembly), assemble (object files), link (resolve symbols into an executable)."],
[17,"C","Static vs dynamic linking?","Static: library code copied into the binary; larger, self-contained. Dynamic: resolved at load time from .so files; smaller, shareable, updateable."],
[18,"C","How would you debug a segmentation fault?","Reproduce it, run under GDB and read the backtrace, inspect the faulting pointer, build with -g and ASan, check NULL, bounds and use-after-free."],
[19,"C","What is undefined behaviour? Give examples.","Code the standard does not define: signed overflow, out-of-bounds access, null dereference, uninitialised reads. Compilers may assume it never happens."],
[20,"Embedded","Why avoid malloc in embedded firmware?","Fragmentation, non-deterministic timing and allocation failure. Use static allocation or fixed-size pools."],
[20,"Embedded","How do you access a hardware register in C?","Cast the address to a volatile pointer, for example *(volatile uint32_t*)0x40021000 = val, wrapped in macros or a struct overlay."],
[22,"OS","What are user and kernel mode, and what is a system call?","Kernel mode has full hardware access. A syscall is a controlled trap from user to kernel to request a service, then it returns."],
[23,"OS","Process vs thread?","Processes have separate address spaces; threads share memory, heap and file descriptors in a process but have their own stack and registers."],
[23,"OS","What are fork, exec, zombie and orphan?","fork clones the process (copy-on-write); exec replaces the image. Zombie: finished but not yet reaped by wait. Orphan: parent exited; init adopts it."],
[24,"OS","What happens in a context switch?","Save the current CPU context in the PCB or TCB, pick the next task, restore its context, and possibly switch the address space (TLB cost)."],
[25,"OS","What is priority inversion and how is it fixed?","A low-priority task holds a lock needed by a high-priority one while a medium task preempts it. Fix: priority inheritance or priority ceiling."],
[25,"OS","Preemptive vs cooperative scheduling?","Preemptive: the scheduler can interrupt tasks. Cooperative: tasks yield voluntarily; simpler, but one task can hog the CPU."],
[26,"OS","Mutex vs semaphore vs spinlock?","Mutex: ownership-based lock for mutual exclusion. Semaphore: counter for signalling or resource counting. Spinlock: busy-waits; only for very short holds."],
[27,"OS","What are the four conditions for deadlock?","Mutual exclusion, hold and wait, no preemption, circular wait. Break any one (commonly with lock ordering) to prevent it."],
[29,"OS","What is virtual memory and what happens on a page fault?","Each process sees its own address space mapped by page tables. On a fault the OS validates the access, loads or allocates the page, updates the page table and retries."],
[29,"OS","What is a TLB?","A cache of recent virtual-to-physical translations that avoids walking the page tables on every access."],
[30,"OS","What is thrashing?","The system spends more time swapping pages than executing because working sets exceed physical memory."],
[31,"OS","Internal vs external fragmentation?","Internal: wasted space inside an allocated block. External: free memory split into pieces too small to use. Buddy and slab allocators mitigate it."],
[32,"Linux","How do you find the process using port 8080 and the process using most CPU?","ss -ltnp or lsof -i :8080 for the port; top, htop or ps aux --sort=-%cpu for CPU."],
[33,"Linux","SIGTERM vs SIGKILL?","SIGTERM can be caught for graceful shutdown; SIGKILL cannot be caught or ignored."],
[34,"Linux","What is a file descriptor?","A small integer indexing the process's table of open files, sockets, pipes and devices; 0, 1 and 2 are stdin, stdout and stderr."],
[34,"Linux","Hard link vs soft link?","Hard link: another name for the same inode (same filesystem). Soft link: a file holding a path; can dangle and can cross filesystems."],
[34,"Linux","select vs poll vs epoll?","select and poll scan all descriptors each call (O(n)); epoll keeps an interest list in the kernel and returns only ready descriptors, so it scales better."],
[36,"Linux","Which IPC mechanism is fastest and why?","Shared memory: no kernel copy per message, but you must add your own synchronization."],
[38,"OS","What is false sharing?","Two threads write different variables on the same cache line, so the line bounces between cores. Fix with padding or alignment."],
[39,"Embedded","What happens when a Cortex-M MCU resets?","It loads the stack pointer and reset vector from the vector table, runs the reset handler (init .data and .bss, clocks), then calls main()."],
[40,"Embedded","What are the rules for writing an ISR?","Keep it short, no blocking or malloc, clear the interrupt source, use volatile for shared data, defer heavy work to a task or the main loop."],
[40,"Embedded","Top half vs bottom half?","Top half runs in interrupt context and does the minimum; the bottom half (tasklet, workqueue or task) does the rest with interrupts enabled."],
[41,"Concurrency","Is volatile enough for thread synchronization?","No. It prevents some compiler optimisations but gives no atomicity or memory ordering; use atomics or locks."],
[43,"Networking","Name the OSI layers. What does ARP do?","Physical, Data link, Network, Transport, Session, Presentation, Application. ARP maps an IP address to a MAC address on the local link."],
[44,"Networking","What does NAT do and how does DHCP work?","NAT translates private addresses and ports to public ones. DHCP: Discover, Offer, Request, Acknowledge."],
[44,"Networking","How does a DNS lookup work?","Stub resolver, recursive resolver, root server, TLD server, authoritative server, with caching at each level."],
[45,"Networking","TCP vs UDP?","TCP: connection-oriented, reliable, ordered, with flow and congestion control. UDP: connectionless, low overhead, no guarantees; good for real-time and streaming."],
[45,"Networking","Describe the TCP three-way handshake and TIME_WAIT.","SYN, SYN-ACK, ACK. TIME_WAIT keeps the closer's socket for about 2xMSL so late packets cannot corrupt a new connection."],
[45,"Networking","Flow control vs congestion control?","Flow control protects the receiver (window size). Congestion control protects the network (slow start, congestion window)."],
[46,"Networking","What is the call order for a TCP server and client?","Server: socket, bind, listen, accept, read/write, close. Client: socket, connect, read/write, close."],
[46,"Networking","Why do you need htons and ntohs?","Network byte order is big-endian and hosts may be little-endian, so convert multi-byte fields."],
[48,"Networking","MQTT vs HTTP for IoT?","MQTT is a lightweight publish/subscribe protocol over a persistent TCP connection with small headers and QoS levels; HTTP is heavier request/response."],
[50,"Concurrency","Race condition vs data race? Thread-safe vs reentrant?","Race condition: outcome depends on timing. Data race: unsynchronised concurrent access with at least one write. Reentrant: safe to re-enter with no shared state; thread-safe code is not always reentrant."],
[52,"Concurrency","Why wait on a condition variable in a while loop?","Spurious wakeups and multiple consumers mean the condition may be false after waking; always recheck the predicate under the lock."],
[53,"Concurrency","How do you avoid deadlock in dining philosophers?","Impose resource ordering, limit diners to N-1, or use an arbiter so a circular wait cannot form."],
[54,"Concurrency","Atomics vs mutex? What is the ABA problem?","Atomics suit small lock-free updates; mutexes protect larger invariants. ABA: a CAS succeeds because a value went A to B and back to A; fix with version tags or hazard pointers."],
[55,"Concurrency","How do you shut down a thread pool gracefully?","Set a stop flag under the lock, notify all workers, let them drain or discard the queue, then join."],
[57,"Embedded","MCU vs MPU? Harvard vs von Neumann?","An MCU integrates CPU, memory and peripherals on one chip; an MPU needs external memory. Harvard has separate instruction and data buses; von Neumann shares one."],
[58,"Embedded","How do you debounce a switch?","Hardware RC filter, or in software sample until the input is stable for about 10 to 50 ms, or use a timer-driven state machine."],
[59,"Embedded","I2C vs SPI vs UART?","I2C: 2 wires, addressed multi-device, slower, needs pull-ups. SPI: 4 wires, fast, full duplex, chip select per slave. UART: 2 wires, point-to-point, asynchronous."],
[59,"Embedded","What is I2C clock stretching?","A slave holds SCL low to delay the master until it is ready."],
[60,"Embedded","How does CAN arbitration work?","Nodes send their IDs bit by bit; dominant (0) beats recessive (1), so the lowest ID wins without losing data."],
[61,"Embedded","What does DMA do and what is the cache-coherence issue?","DMA moves data without the CPU. With caches you must clean or invalidate (or use non-cacheable memory) so the CPU and DMA see the same data."],
[61,"Embedded","What do startup code and the linker script do?","They place sections in flash and RAM, copy .data from flash, zero .bss, set the stack pointer and vector table, then call main()."],
[62,"Embedded","How does a watchdog work and how do you use it well?","A timer that resets the MCU unless firmware kicks it. Kick it only after all critical tasks have proved they are alive."],
[64,"Embedded Linux","What are the components of an embedded Linux system?","Toolchain, bootloader, kernel, root filesystem (BusyBox or systemd) and applications, built with Yocto or Buildroot."],
[65,"Embedded Linux","Describe the Linux boot sequence.","ROM code, SPL and U-Boot, kernel with device tree and initramfs, mount rootfs, init or systemd, services."],
[65,"Embedded Linux","What is a device tree?","A data structure describing hardware (addresses, IRQs, clocks) so one kernel image supports many boards; drivers bind through compatible strings."],
[66,"Embedded Linux","How does a kernel module differ from a user program?","It runs in kernel space with full privileges, has no main(), loads with insmod and uses module_init and module_exit; a bug can crash the system."],
[67,"Embedded Linux","How does a char driver exchange data with user space?","Register file_operations (open, read, write, ioctl) and use copy_to_user and copy_from_user to cross the boundary safely."],
[68,"Embedded Linux","kmalloc vs vmalloc? Spinlock vs mutex in the kernel?","kmalloc: physically contiguous, fast. vmalloc: virtually contiguous only. Use spinlocks in atomic or interrupt context; mutexes may sleep."],
[69,"Embedded","RTOS vs general-purpose OS?","An RTOS gives deterministic, bounded latency with priority-based preemptive scheduling and a small footprint; a GPOS optimises throughput and fairness."],
[69,"Embedded","How does priority inheritance work in an RTOS?","A task holding a mutex temporarily inherits the priority of the highest-priority waiter, which prevents priority inversion."],

// ---------- C ----------
[1,"C","What does this print on a 64-bit system, and why?","12 and 8. sizeof(a) is the size of the whole array (3 ints x 4 bytes); sizeof(p) is the size of a pointer. Arrays are not pointers; they only decay to a pointer to the first element in most expressions.","12;8;pointer|pointer size;decay|decays|whole array",`int a[3] = {1, 2, 3};
int *p = a;
printf("%zu %zu\\n", sizeof(a), sizeof(p));`,"What changes if a is a function parameter declared as int a[3]?","E"],
[1,"C","Why is returning the address of a local variable a bug, and what are the safe alternatives?","The local lives in the stack frame, which is reclaimed on return, so the pointer dangles and using it is undefined behaviour. Safe options: return by value, return a pointer to static storage, let the caller pass in a buffer, or heap-allocate and document who frees it.","stack|frame;dangl;undefined;caller|buffer;heap|static|by value","","Is returning a pointer to a string literal safe? Why?","E"],
[1,"C","What is the difference between a segmentation fault and a bus error?","A segfault is an access to memory the process is not allowed to use: unmapped address, NULL, or writing read-only memory. A bus error is a hardware-level failure such as an unaligned access on a strict-alignment CPU or touching an address with no backing, for example an mmapped file beyond its end.","unmapped|invalid|not allowed|null;read-only|permission;unaligned|alignment;hardware|backing",null,"How would you tell them apart from a core dump?","M"],
[2,"C","Predict the output.","2 4 4. p points to a[1], which is 2. p[2] is a[3], which is 4. *(a+4) - *a is 5 - 1 = 4. Pointer arithmetic is scaled by the element size.","pointer arithmetic|scaled|element size;a[1]|second element|index 1;a[3]|fourth element|index 3",`int a[5] = {1, 2, 3, 4, 5};
int *p = a + 1;
printf("%d %d %d\\n", *p, p[2], *(a + 4) - *a);`,"What does p - a evaluate to, and what is its type?","E"],
[2,"C","What is the difference between char *s = \"abc\" and char s[] = \"abc\"?","char s[] creates a writable array of 4 bytes initialised from the literal. char *s points at a string literal in read-only memory, so modifying it is undefined behaviour (often a crash), and sizeof(s) is the pointer size.","array|copy;read-only|rodata|literal;undefined|crash|segfault;writable|modify|modifiable","","How do you declare the pointer so the compiler rejects writes?","M"],
[2,"C","What is pointer aliasing and why does restrict matter?","Aliasing means two pointers may refer to the same memory, so the compiler must assume a write through one can change what the other reads, which blocks optimisation. restrict promises that the object is accessed only through that pointer, enabling vectorisation and load reuse. Breaking the promise is undefined behaviour.","alias|same memory;restrict;optimi|vectori;undefined",null,"Why does memcpy use restrict but memmove does not?","H"],
[3,"C","Find the bug.","malloc(strlen(s)) leaves no room for the terminating null byte, so strcpy writes one byte past the buffer: a heap overflow. Allocate strlen(s) + 1, check for NULL, and make clear the caller must free the result.","terminator|null byte|terminating;+1|plus one;overflow|past the end|one byte;check|null;free",`char *dup(const char *s) {
    char *p = malloc(strlen(s));
    strcpy(p, s);
    return p;
}`,"What is the standard library function that already does this?","E"],
[3,"C","Why was gets() removed from the C standard and what should you use?","gets cannot limit input length, so any long line overflows the buffer, the classic stack-smashing bug. Use fgets(buf, sizeof buf, stdin) and strip the newline, or POSIX getline.","overflow|buffer;length|limit|size;fgets;getline",null,"What does fgets do with the newline and with lines longer than the buffer?","E"],
[3,"C","What are the pitfalls of strncpy?","strncpy does not null-terminate when the source is at least n bytes long, and it pads the remainder of the destination with zeros, which can be slow. Terminate manually (dst[n-1] = 0) or use snprintf or a bounded helper.","terminat|null;pad|zero|fill;snprintf|manually|strlcpy",null,"What is strlcpy and why is it not in glibc for a long time?","M"],
[4,"C","What are sizeof(struct S) and sizeof(struct T) on a typical ABI, and why do they differ?","12 and 8. In S there is padding after a to align b to 4 and tail padding so the size is a multiple of 4. In T the two chars sit together after the int, so only tail padding is needed. Ordering members from largest to smallest reduces padding.","12;8;padding|alignment;order|reorder|largest",`struct S { char a; int b; char c; };
struct T { int b; char a; char c; };`,"How do you see the padding using offsetof?","M"],
[4,"C","When is reading a different union member than the one last written defined, and what is the portable alternative?","In C (since C99 TC3) it is allowed and reinterprets the bytes; in C++ it is undefined behaviour. Portable options are memcpy into the target type (compilers optimise it) or std::bit_cast in C++20. Casting a float* to an int* violates strict aliasing.","union;memcpy;bit_cast|bit cast;strict aliasing|undefined",null,"Why is memcpy the correct and still fast way to do this?","H"],
[4,"C","What does packed do to a struct, and what are the costs?","It removes padding so the layout matches a wire or register format. Members can become unaligned, which is slower on some CPUs and a fault on others, and taking a pointer to a packed member is dangerous. Prefer explicit serialisation with fixed-width types.","padding;unaligned|alignment;fault|slower|slow;serializ|serialis|memcpy|wire",null,"How would you read a packed 32-bit field safely on a strict-alignment CPU?","M"],
[5,"C","How do you count the trailing zero bits of a 32-bit value without looping over all bits?","Isolate the lowest set bit with x & -x and compute its index, or use a builtin such as __builtin_ctz or _BitScanForward, which maps to one CPU instruction. Handle x == 0 separately (result 32). A de Bruijn multiplication table also works.","lowest set bit|x -x|isolate;builtin|ctz|bitscan|instruction;zero|x 0|special case",null,"How would you implement it with a de Bruijn sequence?","M"],
[5,"C","Why is XOR swapping a bad idea in production code?","a ^= b; b ^= a; a ^= b swaps without a temporary, but fails (zeroes the value) when both operands refer to the same object, is no faster on modern compilers, and is harder to read. Use a temporary.","xor;same|alias|zero;temp|readab|compiler",null,"How do you swap two array elements safely when i may equal j?","E"],
[5,"C","What is wrong with right-shifting negative values and with shifting by too much?","Right shift of a negative signed value is implementation-defined (usually arithmetic, sign-extending). Left shifting a negative value, or shifting by a negative amount or by at least the bit width, is undefined behaviour. Use unsigned types for bit manipulation.","implementation|arithmetic|sign;undefined;unsigned",null,"What does 1 << 31 give for a 32-bit int?","M"],
[5,"C","How do you write a 4-bit value into bits 7:4 of a register without disturbing the other bits?","Clear the field then insert the masked value: reg = (reg & ~(0xFu << 4)) | ((val & 0xFu) << 4). Mask val so it cannot spill into neighbouring fields and use unsigned constants. To read it: (reg >> 4) & 0xF.","mask;shift;clear|~|and not;val|mask the value|mask val",null,"Why is this read-modify-write a problem if an ISR also writes the register?","M"],
[6,"C","What does volatile not guarantee?","It does not make accesses atomic, does not order them against other threads or the CPU's own reordering, and gives no mutual exclusion. It only stops the compiler from removing or reordering accesses to that object relative to other volatile accesses.","atomic;ordering|barrier|reorder;mutual exclusion|thread;compiler",null,"So how do you share a flag between an ISR and main safely?","M"],
[6,"C","A function defined in a header gives multiple definition link errors. Why and how do you fix it?","Every .c file that includes the header gets its own definition, so the linker sees the same symbol several times. Make the function static or static inline, or declare it in the header and define it once in a single .c file.","multiple definition|each|every;static inline|static;define once|one definition|single|one .c",null,"What is the difference between inline in C99 and in C++?","H"],
[6,"C","What is wrong with this macro?","SQUARE(a+1) expands to a+1*a+1, wrong precedence; parenthesise every argument and the whole expression. Even then SQUARE(i++) evaluates i++ twice, which is undefined behaviour. Prefer a static inline function.","precedence|parenthes;twice|multiple|side effect;inline|function",`#define SQUARE(x) x*x
int r1 = SQUARE(a + 1);

[6,"C","How would you design a driver interface in C using function pointers?","A struct of function pointers (an ops table or vtable) holds open, read, write and close; each driver fills it and the core calls through it, so the core is independent of implementations. Pass a context or void* pointer as the first argument to carry per-instance state. Linux file_operations is the standard example.","struct|ops table|vtable|table of function pointers;context|void|state;file_operations|driver|interface",null,"How do you add a new method without breaking existing drivers?","M"],
[8,"C","What happens if you free a pointer not returned by malloc, or call malloc(0)?","free on a stack address or an interior pointer is undefined behaviour and usually corrupts the allocator or aborts. malloc(0) is implementation-defined: it returns NULL or a unique pointer that must still be freed, so never rely on either.","undefined;corrupt|abort|crash;implementation|unique pointer;null",null,"What does free(NULL) do and why is it useful?","M"],
[8,"C","How do you find a memory leak in a long-running embedded Linux process?","Watch RSS over time (/proc/PID/status or smaps), run a host build under Valgrind memcheck or ASan/LeakSanitizer, use heap profiling (tcmalloc, jemalloc, mtrace), add allocation counters or wrapper macros, and look for growth per request cycle.","rss|proc|growth;valgrind|lsan|asan|leaksanitizer;profil|counter|wrapper|mtrace",null,"What if you cannot run Valgrind on the target because of memory limits?","M"],
[8,"C","Explain buffer overflow, stack overflow and heap overflow.","A buffer overflow is writing past the end of any buffer. Stack overflow means either running out of stack space (deep recursion, huge locals) or overflowing a stack buffer, which can overwrite the return address. A heap overflow corrupts neighbouring heap blocks or allocator metadata. Mitigations: bounds checks, canaries, ASLR, sanitizers.","past the end|beyond|bounds;return address|recursion;heap metadata|neighbour|adjacent|heap;canar|asan|sanitizer|aslr",null,"How does a stack canary detect an overflow?","M"],
[9,"C","Why prefer a table-driven state machine over nested switch statements?","States and events are enums and a table [state][event] holds the next state and an action function pointer. Transitions become data that is easy to review, extend and test; nested switches grow unreadable and hide missing transitions. Add a handler for invalid events and log every transition.","table|2d|matrix;action|function pointer;next state|transition;test|review|extend",null,"How do you test that every state handles every event?","M"],
[9,"C","What is an opaque pointer and why use it in a module API?","The header only forward-declares the struct (typedef struct foo foo_t;) and the layout lives in the .c file. Callers cannot touch internals, so the implementation can change without recompiling clients and invariants stay enforced.","forward declar|incomplete|header;encapsulat|hide|internals|private;recompil|abi|change",null,"How does the caller allocate one if the size is hidden?","M"],
[9,"C","Why do C APIs such as qsort_r and pthread_create take a void* user-data argument?","Plain function pointers cannot carry state, so the API passes an extra void* back to the callback, which simulates a closure. The callback casts it to the real type, so the lifetime and ownership of that context must be clear.","state|closure;void|user data|context;cast;lifetime|ownership",null,"What bug appears if the context lives on the caller's stack and the callback runs later?","M"],
[10,"C","How would you implement a hash map in C? Discuss collisions and resizing.","An array of buckets indexed by hash(key) % capacity. Resolve collisions with chaining (a list per bucket) or open addressing (linear or quadratic probing, double hashing). Track the load factor and, above about 0.75, allocate double the capacity and rehash every entry. Average lookup is O(1), worst case O(n).","hash;chaining|open addressing|probing;load factor;resiz|rehash;o 1|constant",null,"Why is deletion tricky in open addressing?","M"],
[10,"C","How do you build a generic list in C? What is an intrusive list?","Store void* data per node, or embed the link node inside the user's struct (intrusive, like Linux list_head) and recover the owner with container_of using offsetof. Intrusive lists need no extra allocation and one object can sit on several lists.","void|generic;intrusive|list_head|embed;container_of|offsetof",null,"How does container_of work?","H"],
[17,"C","Walk through what the linker does and what an undefined reference means.","The linker resolves symbols across object files. A static library (.a) contributes only the objects that are needed, in command-line order; a shared library is resolved at load time by the dynamic loader. Undefined reference means a used symbol has no definition: missing library, wrong order, a missing definition, or a C versus C++ name-mangling mismatch (extern C).","symbol;order|-l|library;extern c|mangling;shared|dynamic loader|ld.so",null,"Why does link order matter for static libraries but not shared ones?","H"],
[17,"C","What is position-independent code and why do shared libraries need it?","PIC uses PC-relative addressing and the GOT and PLT so the code works at any load address and the same pages can be shared between processes; ASLR relies on it. It costs a little performance, more on 32-bit architectures.","pic|position independent|position-independent;got|plt|relative;load address|aslr|any address;shared",null,"What does the PLT do on the first call of a function?","H"],
[18,"C","How do you debug a crash when all you have is a core dump from the field?","Keep the exact binary with symbols (or a separate debug file matched by build ID). Run gdb binary core, then bt full, info registers and inspect frames. Use addr2line for raw addresses and add a crash handler that saves registers and a log tail.","symbol|debug info|build id;gdb|bt;core;addr2line|register",null,"What do you do if the binary was stripped?","M"],
[19,"C","What does this print?","Undefined behaviour: x is modified twice with no sequence point between the modifications (unsequenced side effects). Any result is possible, so never write such code.","undefined;sequence point|unsequenced|sequenc;twice|modified|multiple",`int x = 5;

[19,"C","Why might the compiler delete this null check?","Dereferencing p first is undefined if p is NULL, so the compiler may assume p is non-null and remove the later test. Always test before dereferencing.","undefined;assume|infer|optimi;before|check",`int v = *p;
if (p == NULL)
    return -1;`,"Which compiler flag disables this optimisation in the Linux kernel?","M"],
[19,"C","Predict the result and explain the trap.","The comparison is false. i is converted to unsigned (usual arithmetic conversions) and becomes a huge value, so i < u fails. Mixing signed and unsigned in comparisons is a classic bug; enable -Wsign-compare and keep types consistent.","convert|conversion|promot;unsigned;huge|large|wrap;false;warning|wsign|-wsign",`unsigned int u = 1;
int i = -1;

[20,"C","Why do embedded standards (MISRA, Barr) ban recursion and dynamic allocation?","Recursion makes worst-case stack use unbounded and hard to prove; dynamic allocation brings fragmentation, non-deterministic timing and run-time out-of-memory failures. Static allocation gives analysable memory and timing, which safety certification needs.","stack;fragment;determinis|timing;static;analys|prove|certif",null,"What do you use instead of malloc for variable numbers of objects?","M"],
[20,"C","How can a missing volatile break this code?","The compiler may hoist the read out of the loop and spin forever, or read the register only once, because it assumes memory does not change by itself. volatile forces a real read every iteration. Similarly two writes to a command register may be merged into one.","optimi|hoist|once;loop|poll;volatile;merge|elide|single",`#define STATUS (*(uint32_t *)0x40000000)
while (!(STATUS & READY)) { }`,"What else do you need for a multi-register hardware sequence?","E"],
[20,"C","How do you write an endian-independent serializer?","Write each field byte by byte using shifts (buf[0] = v >> 24 and so on) and read it back with shifts, never by casting a struct pointer to bytes. Use fixed-width types and define the wire byte order explicitly, typically big-endian network order.","shift|byte by byte;fixed width|uint32|fixed-width;byte order|endian|network;struct",null,"Why is casting a struct pointer to a byte buffer dangerous?","M"],
[20,"C","How do you build a lock-free ring buffer between an ISR and the main loop?","Single producer, single consumer: the ISR owns the head index and the main loop owns the tail. The producer writes the element then advances head; the consumer reads then advances tail. Use a power-of-two size with masking, full when head - tail equals size, and volatile or atomic indices with correct ordering.","head|tail;single producer|one writer|spsc|one side;power of two|mask;ordering|atomic|volatile",null,"What breaks if two ISRs both produce?","M"],

[11,"C++","What is the output order?","A B C ~C ~B ~A. Members are constructed in declaration order before the constructor body runs, and destroyed in reverse order after the destructor body.","declaration order|declared order;reverse;member|before the body",`struct A { A() { puts("A"); } ~A() { puts("~A"); } };

[11,"C++","What does explicit do on a constructor?","It stops the constructor from being used for implicit conversions and copy-initialisation, such as passing 5 where a Buffer is expected. That avoids surprising conversions and overload ambiguities. Mark single-argument constructors explicit by default.","implicit|conversion;constructor;surpris|ambigu|accident",null,"Does explicit matter for multi-argument constructors?","E"],
[12,"C++","What happens if you call a virtual function from a constructor?","Virtual dispatch resolves to the class currently being constructed, not the derived override, because the derived part does not exist yet. The same applies in destructors. Calling a pure virtual function there is undefined and usually aborts.","base|current class|not the derived|derived part;constructor;pure virtual|abort|undefined",null,"How would you design an init() step to avoid this?","M"],
[12,"C++","What is the diamond problem and how does virtual inheritance solve it?","Two classes derive from the same base and a fourth derives from both, giving two copies of the base and ambiguous members. Virtual inheritance makes the most-derived class construct one shared base subobject, at the cost of extra indirection (a virtual base pointer).","two copies|duplicate|ambigu;virtual inheritance|virtual base;shared|single|one;cost|indirection|vptr",null,"Who calls the virtual base constructor?","H"],
[12,"C++","What is the cost of a virtual call and when would you avoid it in firmware?","An extra load of the vptr and an indirect call through the vtable, which blocks inlining and can mispredict; every object carries a vptr. In hot paths or tiny MCUs use templates (CRTP), function pointers chosen at init, or plain structs. Elsewhere virtual is fine.","indirect|vtable|vptr;inlin;crtp|template|function pointer;hot|overhead|cost",null,"What is CRTP and how does it avoid the cost?","M"],
[13,"C++","What is the difference between std::move and std::forward?","std::move unconditionally casts to an rvalue reference so the object can be moved from. std::forward<T> casts conditionally, preserving the value category of a forwarding reference (T&&) so wrappers pass lvalues as lvalues and rvalues as rvalues: perfect forwarding.","rvalue;unconditional|always;forwarding reference|universal|template;perfect forwarding|value category",null,"What is a forwarding reference?","H"],
[13,"C++","Why should move constructors be noexcept?","std::vector grows by moving elements only if the move constructor is noexcept; otherwise it copies to keep the strong exception guarantee, because a throwing move would leave the container half-moved. noexcept also allows better code generation.","vector|container;copy;strong exception|exception safe|throw;noexcept",null,"What does std::move_if_noexcept do?","H"],
[13,"C++","How can shared_ptr leak and how does weak_ptr help?","Cycles (A holds a shared_ptr to B and B to A) keep both reference counts above zero forever. Make one direction a weak_ptr, which does not own; call lock() to get a temporary shared_ptr or an empty one if the object expired.","cycle|circular;reference count|ref count|count;weak_ptr;lock|expire",null,"Is shared_ptr's reference count thread-safe?","M"],
[13,"C++","Why are exceptions and RTTI often disabled in embedded C++?","Unwinding tables add flash size and make latency non-deterministic, and RTTI adds type information; safety-critical toolchains build with -fno-exceptions -fno-rtti. Use error codes or expected-style results and static dispatch instead.","size|flash|binary;determinis|latency|timing;error code|expected|result;fno",null,"How do you report constructor failure without exceptions?","M"],
[15,"C++","When are iterators invalidated in vector, list and map?","vector: insert or erase invalidates iterators at and after the point, and a reallocation invalidates all. list and map: insertion never invalidates; erase invalidates only the erased element. In loops use the iterator returned by erase.","vector;realloc|reallocation|capacity;list|map|node;erase|return",null,"Why is erase-remove idiom needed for vector?","M"],
[15,"C++","How does unordered_map handle collisions and why can it degrade to O(n)?","Usually separate chaining in buckets. If many keys share a bucket (a poor hash or adversarial input) lookups scan long chains. Rehashing at the maximum load factor limits average cost; use a good hash and reserve() to avoid rehashes.","bucket|chain;bad hash|poor hash|collision|adversarial;load factor|rehash;reserve",null,"How would you protect a server from hash-flooding attacks?","M"],
[16,"C++","What is dangerous about capturing by reference in a stored lambda?","If the lambda outlives the captured locals (a callback run after the scope ended, a thread, an async task) the references dangle, which is undefined behaviour. Capture by value or by move, or tie lifetimes with shared_ptr.","outlive|lifetime|scope;dangl;value|move|shared_ptr;callback|thread|async",null,"How do you capture a unique_ptr into a lambda?","M"],
[16,"C++","What is the One Definition Rule?","Every non-inline function and variable must be defined exactly once in the program, and inline functions, classes and templates must have identical definitions in every translation unit. Violations give multiple-definition link errors or, worse, silent undefined behaviour when definitions differ.","once|exactly one|single;link|multiple definition;undefined|differ|identical",null,"Why can a header-defined function without inline break the build?","H"],

[22,"OS","Describe step by step what happens when a program calls read() on a file.","The libc wrapper loads the syscall number and arguments into registers and executes the syscall instruction; the CPU switches to kernel mode and the kernel looks up the handler. VFS finds the open file from the file descriptor; the page cache serves the data or the block layer issues I/O while the process sleeps. The data is copied to the user buffer and the kernel returns to user mode.","syscall|trap;kernel mode;file descriptor|vfs;page cache|block|disk;copy;return",null,"What makes the first read slower than the second?","H"],
[22,"OS","Compare interrupts, exceptions and traps.","An interrupt is asynchronous, raised by hardware (timer, NIC). An exception or fault is synchronous and caused by the executing instruction (page fault, divide by zero). A trap is a deliberate synchronous exception such as a syscall or breakpoint. All enter the kernel through the interrupt or vector table.","asynchronous|hardware;synchronous|instruction;syscall|breakpoint|trap;vector|handler",null,"Which of these can be restarted after handling?","M"],
[23,"OS","What happens to memory and file descriptors after fork(), and what does exec() change?","The child gets a copy-on-write copy of the parent's address space and duplicate descriptors that share file offsets; only the calling thread exists in the child. exec replaces the process image (code, heap, stack) but keeps the PID and, unless close-on-exec is set, the open descriptors.","copy on write|copy-on-write|cow;file descriptor|offset;pid|same process;image|replace",null,"Why is vfork or posix_spawn used sometimes?","M"],
[23,"OS","How does a shell implement the pipeline ls | grep foo?","It creates a pipe, forks twice; the first child dup2s the write end onto stdout and execs ls, the second dup2s the read end onto stdin and execs grep. Every unused pipe end must be closed so EOF reaches grep, and the shell waits for the children.","pipe;fork;dup2;close;wait|eof",null,"What happens if the parent forgets to close the write end?","M"],
[23,"OS","How do you turn a program into a classic daemon?","Fork and exit the parent, call setsid to leave the controlling terminal and start a new session, fork again so it cannot reacquire a terminal, chdir to /, reset umask and redirect the standard descriptors to /dev/null. Modern systems usually let systemd do this.","fork;setsid|session;terminal;systemd|dev null",null,"Why fork a second time?","M"],
[24,"OS","Compare user-level threads, kernel threads and the Linux pthread model.","User-level (N:1) threads are scheduled by a library: cheap, but one blocking syscall stalls them all and there is no multicore parallelism. Linux uses 1:1: every pthread is a kernel task scheduled across cores independently, with higher creation and switch cost. M:N hybrids are complex.","1 1|1:1|kernel thread;block|multicore|parallel;library|user level|user-level;cost|switch",null,"What is a green thread?","M"],
[24,"OS","What is thread-local storage and where is it useful?","Each thread gets its own instance of a variable (thread_local, __thread, pthread keys). It is used for errno, per-thread buffers, caches and contexts, avoiding locks for state that does not need to be shared.","own copy|per thread|per-thread|each thread;errno|buffer|cache|context;lock",null,"How does errno stay correct with threads?","E"],
[25,"OS","How does Linux CFS pick the next task, and how do real-time priorities differ?","CFS keeps a virtual runtime per task in a red-black tree and runs the task with the smallest vruntime, weighted by nice value, for fairness. SCHED_FIFO and SCHED_RR tasks always preempt normal tasks and run by static priority, so a runaway RT task can starve the system unless throttled.","vruntime|virtual runtime;red black|tree;nice|weight;sched fifo|real time|rt;starv|preempt",null,"What is RT throttling?","H"],
[25,"OS","What is priority inversion? Explain the Mars Pathfinder case.","A high-priority task blocks on a mutex held by a low-priority task that a medium-priority task keeps preempting, so the high task effectively waits for the medium one. Pathfinder kept resetting because of this and was fixed by enabling priority inheritance on the mutex.","low|medium|high;mutex;inherit|ceiling;pathfinder|reset|watchdog",null,"What is the priority ceiling protocol?","M"],
[26,"OS","Why can't an interrupt handler take a mutex and what do you use instead?","A mutex may sleep, but an ISR has no process context and must never sleep. Use spinlocks with interrupts disabled (spin_lock_irqsave), atomics or lock-free structures, or defer the work to a thread or bottom half.","sleep|block;context|isr;spinlock;defer|bottom half|atomic|thread",null,"What if the spinlock holder is preempted on a single-core system?","M"],
[26,"OS","What are spurious wakeups and the lost-wakeup problem?","A waiting thread can return from cond_wait with no signal, so always recheck the predicate in a loop. A lost wakeup happens when the signal is sent before the waiter starts waiting; avoid it by changing the predicate under the same mutex before signalling.","predicate|loop;mutex;before|lost;spurious",null,"Why must the predicate change happen under the mutex?","H"],
[27,"OS","How do you debug a deadlock in a running process?","Attach gdb and run thread apply all bt to see which threads are blocked in lock calls and what they hold; inspect mutex owner fields; use pstack, Helgrind or ThreadSanitizer for lock-order checks; then impose a global lock order and use try_lock with timeouts to detect it.","gdb|backtrace|thread apply;lock order|ordering;helgrind|tsan|lockdep;owner|hold",null,"How does the kernel's lockdep find potential deadlocks?","M"],
[29,"OS","Explain physical versus virtual addresses and who translates them.","Processes use virtual addresses; the MMU translates them to physical addresses using page tables maintained by the OS, and the TLB caches recent translations. This gives isolation, protection and a flexible layout.","mmu;page table;tlb;isolation|protection",null,"What bits of a virtual address select the page-table entry?","E"],
[29,"OS","Walk through a page fault on the first access to malloc'ed memory.","malloc returns virtual addresses without physical frames. The first touch faults; the kernel allocates a zeroed frame, updates the page table (and TLB), and restarts the instruction. This is demand paging, so the cost appears on first access rather than in malloc.","demand|lazy;page fault;zero|frame;page table;restart",null,"How can you pre-fault memory on a real-time system?","M"],
[29,"OS","What is a TLB shootdown?","When a mapping changes (munmap, mprotect, migration) on a multicore system, other cores may hold stale TLB entries, so the kernel sends inter-processor interrupts that make them invalidate those entries. It is expensive for multithreaded processes.","stale|invalidate;ipi|inter processor|interrupt;core|multi",null,"Why do large munmap calls hurt multithreaded programs?","H"],
[30,"OS","What is the OOM killer and why does overcommit matter on embedded Linux?","Linux may promise more memory than exists, assuming pages go untouched; when memory truly runs out the OOM killer terminates a process chosen by a badness score, possibly a critical one. Embedded systems tune vm.overcommit_memory, set cgroup limits, use watchdogs and size memory deliberately.","overcommit;oom|killer;cgroup|limit;score|badness",null,"How can you protect a critical process from the OOM killer?","M"],
[31,"OS","How do malloc implementations reduce fragmentation?","Size-segregated free lists (size classes), splitting and coalescing of neighbouring free blocks, per-thread arenas to reduce contention, and mmap for large blocks that can be returned to the OS. Fixed-size pools remove fragmentation entirely for known object sizes.","size class|segregated;coalesc;arena|thread;mmap|pool",null,"Why can a long-running process still bloat even without leaks?","H"],
[33,"OS","What does async-signal-safe mean and why not call printf in a handler?","A function is async-signal-safe if it can be called when a signal interrupts arbitrary code. printf and malloc use locks or static state, so if the signal interrupted them, calling them again can deadlock or corrupt state. Use write() or only set a flag.","lock|reentrant|deadlock;write|flag;interrupt",null,"Which flag type is guaranteed safe to set in a handler?","M"],

[33,"Linux","Which signals cannot be caught, and how should a program handle SIGINT?","SIGKILL and SIGSTOP cannot be caught or ignored. For SIGINT the handler should only set a volatile sig_atomic_t flag, and the main loop checks it and cleans up; avoid printf and malloc in the handler.","sigkill;sigstop;flag|sig_atomic_t|volatile;async|safe",null,"What is sigaction better than signal for?","M"],
[34,"Linux","What is the difference between a file descriptor and an open file description, and what does dup2 do?","A descriptor is a per-process index into a table; it points to a kernel open file description that holds the offset and flags, and is shared by duplicates (dup, fork). dup2(old, new) makes new refer to the same description as old after closing new; shells use it for redirection.","per process|per-process|table|index;offset;same|shared|description;redirect",null,"Why do parent and child share a file offset after fork?","H"],
[34,"Linux","What is an inode and why can the disk stay full after deleting a log file?","An inode holds metadata and block pointers; directory entries map names to inodes. rm removes a name; the data is freed only when the link count is zero and no process has the file open. A running process holding the deleted file keeps the space until it closes it (see lsof +L1).","inode;link count|link;open|process;lsof|truncate",null,"How do you reclaim space without restarting the process?","H"],
[36,"Linux","How would you handle 10,000 concurrent connections in a server?","Use non-blocking sockets with epoll (or io_uring) in one event loop per core (reactor), keep per-connection memory small, never block in the loop, hand CPU-heavy work to a thread pool, raise fd limits and the listen backlog, and add timeouts and backpressure.","epoll|event loop|reactor;non blocking|nonblocking;thread pool|per core;fd|limit|backlog|timeout",null,"What is the C10K problem?","M"],

[43,"Networking","What happens, network-wise, when you type a URL and press Enter?","DNS lookup (caches, resolver, root, TLD, authoritative), then ARP for the next-hop MAC, a TCP three-way handshake with the server, a TLS handshake for HTTPS, the HTTP request and response, then keep-alive or teardown. Routers forward by IP and NAT may rewrite addresses at the edge.","dns;tcp|handshake;arp|mac;tls|https;http",null,"Where could a captive portal intercept this?","M"],
[43,"Networking","How do a hub, a switch and a router differ?","A hub repeats bits to every port (one collision domain). A switch learns MAC addresses and forwards frames only to the right port (layer 2). A router forwards packets between networks using IP routing tables (layer 3) and separates broadcast domains.","hub;switch|mac;router|ip;broadcast|collision",null,"What does a switch do with an unknown destination MAC?","E"],
[43,"Networking","What are MTU, MSS and fragmentation?","MTU is the largest layer-2 payload (1500 on Ethernet); MSS is the largest TCP payload, MTU minus IP and TCP headers (about 1460). IP fragments packets larger than the MTU unless DF is set; path MTU discovery avoids fragmentation, which hurts performance and reliability.","mtu;mss;1500|1460;fragment;path mtu|df",null,"What happens to a DF packet that is too large?","M"],
[44,"Networking","How many usable hosts are in 10.0.5.0/22 and what is the broadcast address?","/22 leaves 10 host bits: 1024 addresses, 1022 usable. The mask is 255.255.252.0, so 10.0.5.0 lies in the network 10.0.4.0/22, which spans 10.0.4.0 to 10.0.7.255. The broadcast address is 10.0.7.255.","1022;255.255.252.0|mask;10.0.4.0|network address;10.0.7.255|broadcast",null,"What is the smallest subnet that can host 500 devices?","M"],
[44,"Networking","What is ARP and what is ARP spoofing?","ARP resolves an IPv4 address to a MAC address on the local link by a broadcast request and a unicast reply, cached in the ARP table. Spoofing sends forged replies to poison caches and intercept traffic; defences are static entries, dynamic ARP inspection and encryption.","ip|mac address|mac;broadcast;cache;spoof|poison|forge",null,"Why does IPv6 not use ARP?","M"],
[45,"Networking","List the mechanisms TCP uses to be reliable.","Sequence numbers and acknowledgements, retransmission on timeout or three duplicate ACKs (fast retransmit), checksums, sliding-window flow control, congestion control (slow start, congestion avoidance) and ordered delivery with reassembly.","sequence;ack;retransmi;window;checksum|congestion",null,"How is the retransmission timeout calculated?","M"],
[45,"Networking","What are Nagle's algorithm and delayed ACK, and why can they cause 40 ms stalls?","Nagle holds small writes until earlier data is acknowledged, to avoid tiny packets; delayed ACK waits up to about 40 ms hoping to piggyback. Together a write-write-read pattern can stall. Fix with TCP_NODELAY or by coalescing writes.","nagle;delayed ack|delayed;nodelay|tcp nodelay;small|latency",null,"When would you want Nagle on?","H"],
[45,"Networking","Explain slow start, congestion avoidance and fast retransmit.","Slow start doubles cwnd every RTT from a small window until ssthresh or loss; congestion avoidance then grows linearly. A timeout resets cwnd to one segment; three duplicate ACKs trigger fast retransmit and fast recovery, halving cwnd.","cwnd|congestion window;slow start;exponential|double;linear|additive;duplicate ack|fast retransmit",null,"How does CUBIC or BBR change this?","H"],
[46,"Networking","Why must you loop on recv() and send(), and what is message framing?","TCP is a byte stream: one send may arrive as several recv chunks or merge with other data, and send may write fewer bytes than requested. Loop until everything is handled and define framing yourself: a length prefix, a delimiter or fixed-size messages.","byte stream|stream;partial|fewer|short;loop;length prefix|delimiter|framing",null,"How do you frame messages in a binary protocol?","M"],
[47,"Networking","Why is edge-triggered epoll harder than level-triggered?","Edge-triggered reports only state changes, so you must use non-blocking descriptors and read or accept until EAGAIN, otherwise leftover data may never trigger again. Level-triggered keeps notifying while data remains, which is simpler and safer.","edge;level;eagain|non blocking|nonblocking;drain|until",null,"Which would you pick for a first implementation?","H"],
[48,"Networking","Compare MQTT QoS 0, 1 and 2.","QoS 0 is at most once (fire and forget). QoS 1 is at least once with a PUBACK, so duplicates are possible. QoS 2 is exactly once through a four-step handshake with the most overhead. Choose per message by the cost of loss versus duplicates.","at most once;at least once;exactly once;duplicate|handshake|overhead",null,"What is a retained message and a last-will message?","M"],
[48,"Networking","What does TLS provide and how does the handshake work roughly?","Confidentiality, integrity and server authentication (optionally client). Hellos agree on version and cipher, the server proves identity with a certificate chain, ECDHE key exchange derives shared session keys, and data then flows encrypted with a symmetric AEAD cipher. On constrained devices the cost is certificate verification and RAM.","certificate;key exchange|ecdhe|diffie;symmetric|session key;authenticat;integrity|encrypt",null,"How do you do TLS on a device with 64 KB of RAM?","H"],

[51,"Concurrency","What is lock contention and how do you reduce it?","Many threads waiting for the same lock serialise execution. Reduce it with shorter critical sections, finer-grained or sharded locks, reader-writer locks, per-thread data merged later, lock-free structures, or avoiding sharing altogether.","serial|wait;shorter|critical section;shard|fine grained|per thread;reader",null,"How would you measure contention?","M"],
[51,"Concurrency","Compare lock_guard, unique_lock and scoped_lock.","lock_guard locks in its constructor and unlocks in its destructor, exception-safe and not movable. unique_lock adds deferred locking, early unlock and works with condition_variable. scoped_lock locks several mutexes at once using a deadlock-avoidance algorithm (C++17).","constructor|destructor|raii;unique_lock;condition variable|condition_variable;scoped_lock|multiple",null,"Why can't lock_guard be used with condition_variable::wait?","M"],
[52,"Concurrency","What does a correct bounded blocking queue need?","One mutex protecting the buffer and counts, two condition variables (not_full and not_empty), producers waiting while full and consumers while empty in predicate loops, notifications after state changes, and a closed flag that wakes everybody for shutdown. Do not hold the lock while processing items.","mutex;not full|not empty|two condition;predicate|while;closed|shutdown",null,"What changes if there is one producer and one consumer?","M"],
[53,"Concurrency","What is the starvation problem with reader-writer locks?","Reader preference can starve writers when readers keep arriving; writer preference can starve readers. Fair or ticket-based implementations queue requests. Reader-writer locks also cost more than a plain mutex for short critical sections.","starv;reader preference|writer preference|fair;overhead|cost",null,"When is a plain mutex faster than an rwlock?","M"],
[54,"Concurrency","Explain acquire and release semantics with a flag and data example.","The writer stores the data, then does a release-store to the flag. A reader does an acquire-load of the flag and, if it is set, is guaranteed to see the data written before the release. This orders accesses across the pair without a full barrier; relaxed gives no ordering.","release;acquire;flag;ordering|reorder|happens before",null,"Why is relaxed enough for a plain counter?","H"],
[54,"Concurrency","Why is naive double-checked locking broken and what is the correct C++11 approach?","Without atomics the pointer may become visible before the object is fully constructed because of reordering, so another thread sees a half-built object. Use std::call_once, a function-local static (thread-safe initialisation since C++11), or atomics with acquire and release.","reorder|half|partial;call_once|static|local static;atomic|acquire",null,"Is the function-local static initialisation lock-free after the first call?","H"],
[55,"Concurrency","How would you size a thread pool?","For CPU-bound work about the number of cores; for I/O-bound work more threads, roughly cores x (1 + wait time / compute time). Measure, bound the queue for backpressure and avoid oversubscription.","cores|hardware concurrency;cpu bound|compute;io|i/o|wait;measure|backpressure|queue",null,"What happens with 1000 threads on 4 cores?","M"],
[56,"Concurrency","If 20% of a program is serial, what is the maximum speedup, and what is it with 8 threads?","Amdahl's law: speedup = 1 / (s + (1 - s) / N). With s = 0.2 the limit is 5x, and with 8 threads it is 1 / (0.2 + 0.8 / 8) = 3.33x. Serial parts and synchronisation cap scalability.","amdahl;serial;5|five;3.33|3.3",null,"What does Gustafson's law say differently?","E"],
[41,"Concurrency","What is a memory barrier and when do drivers need one?","A barrier stops the compiler and CPU from reordering memory operations across it. Drivers need them to order device-register writes against DMA descriptors, for example write the descriptor, barrier, then ring the doorbell. Linux offers wmb(), rmb(), mb(), and readl/writel have ordering built in.","reorder;dma|descriptor|doorbell;device|register;wmb|mb|barrier",null,"What is the difference between a compiler barrier and a CPU barrier?","H"],

[39,"Embedded","What does the Cortex-M hardware push onto the stack when an interrupt occurs?","It automatically stacks R0-R3, R12, LR, PC and xPSR (eight words), then loads PC from the vector table. LR receives an EXC_RETURN value so that returning from the handler unstacks the frame. The floating-point context may also be stacked (lazy stacking).","r0|r3;pc|lr|xpsr;exc return|exc_return|magic|bx lr;vector table",null,"Why can a normal C function serve as an ISR on Cortex-M?","H"],
[39,"Embedded","What causes a HardFault on Cortex-M and how do you debug it?","An invalid memory access, an unaligned access where not allowed, a bus error, an undefined instruction, divide by zero if trapped, stack overflow, or an escalated fault. In the handler read the stacked PC and LR, the CFSR, HFSR and MMFAR or BFAR registers, then map the PC to source with the map file or disassembly.","cfsr|hfsr|fault status;pc|lr|stacked;null|unaligned|stack overflow;map|disassembl",null,"How do you find the faulting instruction when the stack itself is corrupted?","H"],
[40,"Embedded","How do you share data safely between an ISR and the main loop?","Keep the ISR short; share through a volatile flag or a single-producer single-consumer ring buffer with atomic or volatile indices; for multi-word data briefly disable interrupts (critical section) or use a double buffer; never block in the ISR.","volatile;ring buffer|queue|flag;critical section|disable interrupt|atomic;short",null,"What if the shared data is 64 bits on a 32-bit CPU?","M"],
[40,"Embedded","What is interrupt latency and what affects it?","The time from the hardware event to the first instruction of the ISR. It depends on interrupts being disabled in critical sections, higher-priority interrupts, completion of the current instruction, stacking time, flash wait states and cache misses. Keep critical sections short to bound it.","disabled|critical section;priority|nested;stack|flash|wait state;bound|worst case",null,"How would you measure it?","M"],
[40,"Embedded","How do nested interrupts and priority grouping work on Cortex-M?","The NVIC gives each interrupt a priority and a lower number is more urgent; a higher-priority interrupt can preempt a running ISR. Priority grouping splits the bits into preempt priority and sub-priority, and only a different preempt level can preempt. Tail-chaining skips the unstack and restack between pending interrupts.","nvic;preempt;lower number|higher priority|urgent;tail chain|tail-chaining",null,"What is the BASEPRI register used for?","H"],
[57,"Embedded","Why does I2C need pull-up resistors and what happens if the value is wrong?","The lines are open-drain: devices only pull low and the pull-ups create the high level. Too large a resistor with the bus capacitance gives slow rising edges and failures at speed; too small draws excess current and can exceed the sink limit. Choose per the spec and the capacitance.","open drain|open-drain;pull low|low;rise|capacitance|slow;current|sink",null,"What changes at 400 kHz versus 100 kHz?","M"],
[57,"Embedded","Compare a super-loop, an interrupt-driven design and an RTOS design.","A super-loop polls tasks in sequence: simple but weak timing guarantees. Interrupt-driven designs react in ISRs with a foreground loop: good latency but shared-data hazards. An RTOS adds preemptive priority scheduling, synchronisation and timing services at the cost of RAM, flash and complexity.","super loop|superloop|polling;interrupt;rtos|preemptive;ram|flash|complexity|cost",null,"What would make you move from a super-loop to an RTOS?","M"],
[58,"Embedded","How do you compute timer registers for a PWM signal?","The timer counts to ARR; frequency = clock / ((PSC + 1) x (ARR + 1)); the compare register CCR sets the duty cycle = CCR / (ARR + 1). Example: 72 MHz, PSC 71, ARR 999 gives 1 kHz and CCR 250 gives 25 percent.","prescaler|psc;arr|auto reload|period;ccr|compare;duty;frequency",null,"How do you get finer duty resolution at a fixed frequency?","M"],
[58,"Embedded","How do you convert ADC counts to a voltage, and what limits accuracy?","A 12-bit ADC gives 0 to 4095 counts across 0 to Vref, so Vin = counts x Vref / 4095 (4096 by some conventions); one LSB is Vref / 2^N. Noise, source impedance, sampling time and reference accuracy limit real accuracy; oversampling and averaging add effective resolution.","vref|reference;counts|code;lsb|resolution;sampling|impedance|noise",null,"What is oversampling and how many extra bits can you get?","M"],
[58,"Embedded","How do you debounce an input in firmware without blocking delays?","Sample at a fixed tick (for example every 1 ms from a timer), keep a counter or shift register, and accept a new state only after it has been stable for N samples (10 to 50 ms). Use a small state machine for press, release and long press.","tick|timer|sample;stable|n samples|counter;state machine|non blocking|no delay",null,"How would you detect a double click?","E"],
[59,"Embedded","What happens if an I2C slave holds SDA low forever, and how do you recover?","The bus is stuck and the master cannot send START or STOP. Toggle SCL up to nine times as a GPIO so the slave can finish its byte and release SDA, then generate a STOP; reset or power-cycle the slave if needed, and put timeouts in the driver.","sda;scl|clock;9|nine|pulse;stop;timeout",null,"Why nine clock pulses?","H"],
[59,"Embedded","How would you choose between UART, SPI, I2C and CAN for different links in a car?","SPI for fast point-to-point links on a board (displays, flash); I2C for several slow sensors with few wires; CAN between ECUs over distance and noise because it is differential, multi-master with arbitration and error detection; UART for simple debug or point-to-point links.","differential|noise|robust;multi master|arbitration|ecus;fast|high speed|display|flash;few wires|slow sensors|sensors;debug|point to point|simple",null,"Why is CAN preferred over SPI between ECUs?","M"],
[60,"Embedded","How does CAN error handling work and what is bus-off?","Nodes detect errors by CRC, bit monitoring, bit stuffing, ACK and form checks and send error frames. Each node keeps transmit and receive error counters; above thresholds it becomes error-passive and then bus-off, where it stops transmitting to protect the bus until a recovery sequence.","crc|bit stuff|ack;error counter|tec|rec;error passive;bus off|bus-off",null,"How does a node recover from bus-off?","H"],
[61,"Embedded","What do a linker script, VMA and LMA mean?","The linker script defines memory regions (FLASH, RAM) and maps input sections (.text, .rodata, .data, .bss) into them, plus the entry point and stack symbols. LMA is where a section is stored (load address in flash); VMA is where it runs. .data has its LMA in flash and its VMA in RAM, so startup copies it.","memory region|flash|ram;.data;vma|lma|load address;startup|copy",null,"Why does .bss take no space in the image?","H"],
[61,"Embedded","How do you handle DMA buffers on a CPU with a data cache?","Place buffers in a non-cacheable region (MPU) or manage the cache explicitly: clean (flush) before DMA reads data the CPU wrote, invalidate after DMA writes data the CPU will read, and align buffers to cache lines so neighbouring data is not corrupted.","clean|flush;invalidate;align|cache line;non cacheable|mpu",null,"What goes wrong if the buffer shares a cache line with another variable?","H"],
[62,"Embedded","How do you detect stack overflow in an RTOS task?","Fill the stack with a known pattern and check the high-water mark (for example uxTaskGetStackHighWaterMark); enable the RTOS overflow hook that checks the last bytes; use an MPU guard region to fault immediately; size from the measured worst case plus margin.","pattern|canary|watermark|high water;hook|check;mpu|guard;margin|worst case",null,"Why does the pattern check miss some overflows?","M"],
[62,"Embedded","What is the difference between independent and window watchdogs?","An independent watchdog runs from its own low-speed clock and keeps working if the main clock fails, but only needs a refresh before the timeout. A window watchdog also rejects refreshes that come too early, catching runaway loops that kick the dog too often.","independent|separate clock|low speed;window;too early|early;refresh|kick",null,"Where should the watchdog be kicked in a multi-task system?","H"],
[62,"Embedded","How do you design firmware for low power while meeting latency needs?","Sleep (WFI) in the idle loop or use tickless idle, run at the lowest sufficient clock, gate unused peripherals, use DMA and interrupts instead of polling, batch work, choose wake-up sources, and measure current. Deeper sleep saves energy but adds wake-up latency.","sleep|wfi|idle;clock|gate|peripheral;interrupt|dma|polling;wake|latency|measure",null,"How do you measure microamps accurately?","M"],
[63,"Embedded","What must a robust bootloader verify before jumping to the application?","The image header and magic value, version and length, a CRC or hash and preferably a signature, and that the reset vector and initial stack pointer are in valid ranges. If anything fails it stays in recovery or falls back to the previous image.","header|magic;crc|hash|signature;reset vector|stack pointer|vector;recover|fallback",null,"Where do you store the public key and why?","M"],
[72,"Embedded","How would you filter noise from a temperature sensor on a small MCU?","Oversample and average, apply a moving average or an exponential filter in integer math (y += (x - y) >> k), use a median filter for spikes, add hysteresis to thresholds and a stuck-sensor check. Choose by the noise type and the latency and memory limits.","moving average|average|exponential;median|spike;integer|fixed point;hysteresis",null,"What is the lag of an exponential filter with k = 4?","M"],
[74,"Embedded","How do you protect data integrity when power may fail during a flash write?","Never overwrite in place: write new data to a fresh location with a sequence number and CRC, commit with a valid marker written last, and on boot scan for the newest valid record. Use journaling or A/B pages and size the hold-up capacitor for the write time.","crc;sequence|version;commit|marker|atomic;a b|journal|recover",null,"How do you wear-level the log area?","H"],
[75,"Embedded","Describe a secure and safe over-the-air update flow.","Download to the inactive slot, verify size, hash and a digital signature with a key held in the bootloader, mark pending and reboot into it, run a self-test and confirm; if confirmation does not arrive within N boots the bootloader rolls back. Add anti-rollback counters and power-loss resume.","inactive|a b|slot;signature|hash|verify;confirm|self test;rollback;anti rollback|version",null,"How do you stop an attacker from installing an older vulnerable image?","H"],

[72,"Design","Design a firmware update and configuration system for 10,000 field devices.","Staged rollout with canary groups, signed images, A/B partitions with rollback, version and health reporting, retry with backoff, bandwidth limits and delta updates, device identity with secure transport, a remote disable switch and monitoring dashboards.","staged|canary|rollout;signed|secure;rollback|a b;delta|bandwidth;telemetry|monitor",null,"What do you do when 5% of devices fail to boot the new image?","H"],

[64,"Embedded Linux","Yocto or Buildroot: how do you choose?","Buildroot is simple and fast and produces one root filesystem image, which suits small fixed products. Yocto uses layers and recipes, supports package management and SDK generation and reproducible multi-product builds, but has a steeper learning curve and longer builds. Choose Buildroot for simplicity and Yocto for scale and long-term maintenance.","buildroot;yocto;layer|recipe;simple|learning curve;sdk|package",null,"What is a Yocto layer?","M"],
[65,"Embedded Linux","What does U-Boot do and what does it hand to the kernel?","U-Boot initialises RAM and basic devices, loads the kernel image, the device tree blob and optionally an initramfs into memory, sets the kernel command line (bootargs) and jumps to the kernel entry with registers pointing to the DTB. It also supports network and USB boot and recovery.","bootloader|u boot;dtb|device tree;bootargs|command line;initramfs|load",null,"How does the kernel know where the DTB is?","M"],
[65,"Embedded Linux","How does the kernel match a driver to a device in the device tree?","The node's compatible string is matched against the driver's of_match_table when the bus is probed; on a match the driver's probe() runs with the node's resources (reg, interrupts, clocks, gpios) which it reads with the platform or OF helpers.","compatible;of match|match table|match;probe;reg|interrupt|resource",null,"What if two drivers match the same compatible string?","M"],
[66,"Embedded Linux","Why can't a kernel module use the C standard library?","The kernel is freestanding: no libc, no floating point by default and small fixed stacks. Modules use kernel APIs instead: printk, kmalloc and kfree, memcpy variants, copy_to_user, mutexes and spinlocks, and list helpers.","libc|freestanding|standard library;printk;kmalloc;stack|floating",null,"Why is floating point avoided in the kernel?","M"],
[67,"Embedded Linux","What can go wrong if a driver dereferences a user pointer directly?","The pointer may be invalid, unmapped, malicious or point into kernel memory, causing an oops or a privilege escalation, and the page may be swapped out. Use copy_from_user and copy_to_user (or get_user and put_user), which validate access and handle faults, and check their return values.","invalid|malicious|unmapped;copy from user|copy_from_user|copy to user|copy_to_user;fault|oops|security;check|return value",null,"What does copy_to_user return on failure?","H"],
[68,"Embedded Linux","Tasklet, workqueue or threaded IRQ: when do you use which?","Tasklets and softirqs run in atomic context and cannot sleep, so they suit short deferred work. Workqueues run in process context and can sleep, take mutexes and do I/O. A threaded IRQ runs the bottom half in a kernel thread, which simplifies drivers that need to sleep; new code mostly uses workqueues or threaded IRQs.","atomic|cannot sleep|no sleep;workqueue|process context|sleep;threaded irq|kernel thread;tasklet",null,"What context is a timer callback in?","H"],
[69,"Embedded","What are the rules for calling FreeRTOS APIs from an ISR?","Use only the FromISR variants (for example xQueueSendFromISR), pass a higher-priority-task-woken flag and call portYIELD_FROM_ISR at the end, keep the ISR priority at or below configMAX_SYSCALL_INTERRUPT_PRIORITY, and never block.","fromisr|from isr;higher priority task woken|yield;never block|no block|not block;priority|configmax",null,"What happens if the ISR priority is too high?","M"],
[69,"Embedded","What is the rate-monotonic utilisation bound and when does it not apply?","Rate-monotonic scheduling gives the shortest period the highest priority. For n independent periodic tasks it is guaranteed schedulable if total utilisation is at most n(2^(1/n) - 1), about 69% for large n. The test is sufficient, not necessary; blocking, jitter and aperiodic tasks need extra analysis such as response-time analysis.","shortest period|shorter period|period;utilisation|utilization|69|ln 2;sufficient;blocking|jitter|response time",null,"Is a task set at 80% utilisation always unschedulable?","H"],

["**static** at file scope hides a symbol from other files, inside a function it keeps its value between calls;**volatile** tells the compiler a value can change outside its knowledge (hardware, ISR), so every access really happens;A **function pointer** plus a context pointer gives callbacks, and macros need **parentheses** and evaluate arguments twice","Assuming volatile makes code thread-safe: it gives neither atomicity nor ordering.","Explain volatile, static and extern, and write a safe macro (or say why you would use inline instead)."],
