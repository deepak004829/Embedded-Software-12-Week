const NEWD={
36:["How to approach a system design interview","The six-step framework: requirements, estimation, API, data model, high-level design, deep dive;Functional versus non-functional requirements (latency, availability, consistency, durability);Back-of-the-envelope maths: QPS, storage and bandwidth","Follow a **framework**: clarify requirements, estimate scale, define APIs, model data, draw the high-level design, then deep dive into bottlenecks;**Non-functional** requirements (latency, availability, consistency, durability) drive the design more than features;Know the **numbers**: a day is 86,400 s, 1 million requests a day is about 12 QPS, memory is far faster than SSD","Jumping to boxes and databases before clarifying requirements and scale.","Design X: the interviewer expects you to drive the discussion and justify trade-offs.",["Estimation drill","Practise back-of-the-envelope maths: for three products (a URL shortener, a photo app, a chat app) estimate QPS, read to write ratio, storage per year and bandwidth, from stated assumptions.","Write assumptions for each product;Compute average and peak QPS;Compute storage for 5 years and the cache size for the hot 20%","One page with three estimates and the formulas used","x"]],
37:["Scaling blocks: load balancers, caching, CDN","Load balancing: round robin, least connections, consistent hashing, layer 4 versus layer 7;Caching: cache-aside, write-through, write-back, eviction, TTL, stampede;Horizontal versus vertical scaling and CDNs","**Horizontal scaling** adds machines behind a **load balancer** (L4 by IP and port, L7 by HTTP content);**Cache-aside**: read the cache, on a miss read the database and fill the cache. **Write-through** updates both and **write-back** delays DB writes;Guard against a **cache stampede** with locking, request coalescing or jittered TTLs","Adding a cache without an invalidation plan: stale data becomes a bug.","Where would you add a cache, what do you cache and how do you invalidate it?",["Cache simulator","Build a small cache library in C++ with LRU eviction and TTL, plus a simulator that replays a request trace and reports the hit rate for cache sizes 10, 100 and 1000.","O(1) get and put with a hash map and list;TTL expiry checked on access;Report hit ratio for three sizes","Hit-rate table for a skewed trace and a short explanation","w"]],
38:["Databases: SQL vs NoSQL, indexing, replication, sharding","Relational versus NoSQL (key-value, document, wide-column, graph): when to choose which;Indexes (B-tree versus LSM), replication (leader and follower), sharding (range, hash, consistent hashing);ACID transactions and isolation levels","Pick **SQL** for relations, transactions and ad-hoc queries and **NoSQL** for scale-out, flexible schema and simple access patterns;An **index** speeds reads (B-tree) at the cost of writes and space, while **LSM trees** favour writes;**Replication** gives availability and read scaling, **sharding** splits data by key so choose a key that avoids hotspots","Sharding by a skewed key such as country: one shard gets all the load.","Which database would you pick for this workload, and how would you scale it?",["Mini key-value store with an index","Build an on-disk key-value store in C++: an append-only data file with an in-memory hash index (Bitcask style) supporting put, get and delete.","Append records with length and CRC;Rebuild the index on startup by scanning the file;Delete via tombstone","Restart the program and all keys are recovered; tests pass","w"]],
39:["Messaging and asynchronous processing","Message queues versus pub/sub, Kafka-style logs, partitions and consumer groups;Delivery semantics: at-most-once, at-least-once, exactly-once and idempotency;Retries, backoff, dead-letter queues and backpressure","A **queue** decouples producers from consumers and smooths spikes, while **pub/sub** fans out to many subscribers;**At-least-once** delivery means duplicates, so make consumers **idempotent** with idempotency keys;Use **retries with exponential backoff** and a **dead-letter queue** for poison messages","Assuming exactly-once delivery: design for duplicates and out-of-order messages.","How do you make this pipeline reliable and handle failures or duplicates?",["Job queue with retries","Implement an in-process job queue in C++ with worker threads, at-least-once processing, exponential backoff retries and a dead-letter list.","Jobs have ids and attempt counts;Failed jobs retry with 1, 2 and 4 second backoff;After 3 failures move the job to dead letters","Test with a flaky handler: every job ends processed or dead-lettered, recorded in the log","w"]],
40:["Consistency, availability and distributed basics","CAP theorem and PACELC;Consistency models (strong, eventual, causal) and quorum reads and writes;Consensus and leader election (Raft idea), clocks and ordering","**CAP**: during a network partition you must choose **consistency** or **availability**;**Quorum**: with N replicas, writing to W and reading from R with **R + W > N** guarantees overlap with the latest write;**Raft** elects a leader and replicates a log by majority vote, so it tolerates minority failures","Quoting CAP as pick any two: partitions happen, so the real choice is consistency versus availability during one.","What happens to your design when a node or a network link fails?",["Quorum replication simulator","Simulate N replicas with versioned values. Implement write and read with configurable W and R and random node failures, and show when stale reads occur.","Vary N, W and R from the command line;Count stale reads over 100,000 operations;Show that R + W > N removes stale reads when no node is down","Table of N, W, R against stale read rate","w"]],
41:["API design, rate limiting and security basics","REST versus gRPC, pagination, versioning and idempotent methods;Rate limiting algorithms: token bucket, leaky bucket, sliding window;Authentication and authorisation: sessions, JWT, OAuth2 basics","Design **resource-oriented REST** APIs with **cursor pagination** and make **PUT and DELETE idempotent**;**Token bucket** allows bursts at a steady refill rate and **sliding window** is smoother but costs more memory;**JWT** is a signed stateless token and **OAuth2** delegates access without sharing passwords","Offset pagination on large changing tables: duplicates and slow queries, so use cursors.","Design the API for this service: endpoints, pagination, errors, idempotency and auth.",["Rate limiter library","Implement token bucket and sliding-window-log rate limiters in C++ with a per-key map, thread-safe, plus a test harness with a simulated clock.","Both algorithms behind one interface;Thread-safe per-key state;Tests for burst, steady rate and refill","All tests pass with a fake clock and you can compare memory per key","w"]],
42:["Boss: Design a URL shortener","Requirements: shorten, redirect, custom alias, expiry, read-heavy traffic;Key generation (base62 counter or hash with collision handling), storage and caching;Scaling: cache hot URLs, shard by key, rate limit, async analytics","Estimate: **read-heavy** (about 100 to 1), around 500 bytes per URL, so five years is a few TB;Generate keys with a **base62 counter** (distributed ID ranges) or a **hash with a collision check**;Serve redirects from a **cache**, store mappings in a **key-value or SQL store**, count analytics asynchronously","A random hash with no collision handling, or a single counter as a bottleneck.","The classic first system design question: be ready for 40 minutes of follow-ups.",["URL shortener service","Build a working URL shortener in C++ (or your preferred language) with a REST-like HTTP interface, base62 ids, persistence and an LRU cache.","POST /shorten returns a short code;GET /code redirects with 301 or 302;Data survives a restart","curl demo: create, redirect, restart the server, redirect again","w"]],
43:["Design a rate limiter","Where to place it: client, gateway or service, per user, IP or API key;Distributed counters with Redis (INCR with expiry, Lua scripts) and race conditions;Bursts, fairness and failure modes (fail open or fail closed)","Place limits at the **API gateway** keyed by user or IP and return **429** with **Retry-After**;Use **Redis atomic operations** (INCR with TTL or a Lua script) so counters stay correct across servers;Decide **fail-open or fail-closed** when the limiter store is down","Read-then-write counters without atomicity: two servers both allow the request.","Design a rate limiter for 1 million requests per second across data centres.",["Distributed rate limiter simulation","Simulate 5 gateway servers sharing a rate-limit store with network delay. Compare naive read-then-write against atomic increment accuracy under concurrency.","Simulated store with latency;Atomic and non-atomic modes;Report over-limit requests allowed","Atomic mode never exceeds the limit and naive mode leaks requests","w"]],
44:["Design a distributed cache","Consistent hashing with virtual nodes and rebalancing;Replication, eviction (LRU, LFU) and hot keys;Invalidation strategies and cache coherence","**Consistent hashing** puts keys and nodes on a ring so adding or removing a node moves only about 1/N of the keys;**Virtual nodes** even out the load and allow weighted capacity;Handle **hot keys** with replication, local caches or key splitting","Simple modulo hashing: adding a node remaps almost every key and empties the cache.","Design a distributed cache: partitioning, replication, eviction and failure handling.",["Consistent hashing ring","Implement a consistent hash ring in C++ with virtual nodes and measure key movement and load balance when nodes are added and removed.","add_node, remove_node and get_node(key);Compare with modulo hashing;Report the fraction of keys moved and the load standard deviation","Moves about 1/N of keys versus almost all with modulo","w"]],
45:["Design a key-value store","Partitioning and replication across nodes with tunable N, R and W;Write path: WAL, memtable, SSTables and compaction (LSM);Failure handling: hinted handoff, read repair, Merkle trees, gossip","An **LSM tree** writes to a **WAL** and an in-memory **memtable**, flushes sorted **SSTables** and **compacts** them in the background;**Dynamo-style** stores replicate each key to N nodes with tunable **R and W** quorums;**Gossip**, **hinted handoff** and **read repair** keep replicas converging","Ignoring compaction and read amplification: reads slow down as SSTables pile up.","Design a highly available key-value store: how do reads, writes and failures work?",["LSM-tree key-value engine","Implement a small LSM key-value engine in C++: memtable, write-ahead log, flush to sorted files and a simple compaction that merges two files.","WAL replay restores the memtable after a crash;Reads check the memtable then the newest files first;Compaction removes overwritten and deleted keys","Crash test: kill mid-run and recover every acknowledged write","w"]],
46:["Design a news feed","Fan-out on write versus fan-out on read versus hybrid;Feed storage in cache, ranking and pagination;The celebrity problem and caching strategy","**Fan-out on write** pre-computes each follower's timeline (fast reads, expensive for celebrities) and **fan-out on read** builds it on request;Use a **hybrid**: push for normal users, pull for celebrities and merge at read time;Store timelines as **lists of post ids in cache**, hydrate posts separately and use **cursor pagination**","Pushing a celebrity post to millions of followers synchronously.","Design Twitter's home timeline for 300 million users, including celebrities.",["Timeline fan-out simulator","Simulate a social graph with normal users and celebrities. Compare fan-out on write, fan-out on read and hybrid in write cost and read latency.","Generate a power-law follower distribution;Count write amplification and read work for each strategy;Report a recommendation with numbers","Table of the three strategies and a justified hybrid threshold","w"]],
47:["Design a chat system","Connections: WebSockets and long polling, presence and typing indicators;Message storage, per-conversation ordering, delivery and read receipts;Group chat fan-out and offline delivery with push notifications","Use **WebSockets** for persistent connections with a **gateway** layer that tracks which user is on which server;Give each message a **per-conversation sequence number** to order and deduplicate, with **ack and retry** for reliability;For offline users **persist** the message and send a **push notification**","Relying on client timestamps for ordering: clocks differ, so use server sequence numbers.","Design WhatsApp: one-to-one and group chat, delivery guarantees and offline users.",["Chat server with acks","Build a TCP chat server in C++ with rooms, per-room sequence numbers, ack and resend for undelivered messages, and an offline queue per user.","Messages are ordered per room by sequence number;Client acks remove messages from the pending queue;Reconnect delivers missed messages in order","Demo: disconnect a client, send messages, reconnect and receive them in order","l"]],
48:["Design a job scheduler and notifications","Priority queues, delayed, scheduled and recurring jobs;Workers, leases, at-least-once execution and idempotency;Multi-channel notifications (push, email, SMS), templates, rate limits and retries","A scheduler keeps jobs in a **priority queue by run time** and workers **lease** jobs so a crashed worker's job is retried;Make jobs **idempotent** and use **dedup keys** to avoid duplicate notifications;Separate **channels** (push, email, SMS) with their own queues, **rate limits** and retry policies","A single scheduler instance: it is a single point of failure, so use leader election or sharding.","Design a job scheduler or notification service: scale, reliability and exactly-once expectations.",["Delayed job scheduler","Implement a job scheduler in C++ with a min-heap by run time, worker threads, leases with timeout and retry, and recurring jobs.","Jobs run at or after their scheduled time;A simulated worker crash makes the job reappear after the lease timeout;Recurring jobs reschedule themselves","Test with 10,000 jobs: all run once or are retried and none are lost","w"]],
49:["Boss: Design a file storage service","Chunked uploads, deduplication and content-addressed storage;Metadata service versus blob storage, sync protocol and conflict resolution;Sharing, permissions, versioning and resumable uploads","Split files into **chunks** (about 4 MB), hash them (**content-addressed**) and upload only changed chunks;Keep **metadata** (file tree, versions, permissions) in a database and **blobs** in object storage;**Sync**: clients get notified of changes and conflicts create a conflicted copy or use versions","Storing whole-file uploads in the metadata database.","Design Dropbox: upload, sync across devices, sharing and consistency.",["Chunked file sync tool","Write a C++ tool that splits a file into fixed-size chunks, hashes them, stores unique chunks in a content-addressed folder and rebuilds the file from a manifest. Show deduplication savings after a small edit.","Manifest lists chunk hashes in order;Identical chunks are stored once;Editing one byte changes only one chunk","Report storage used for two versions of a 100 MB file","w"]],
50:["SOLID and clean OOP design","SRP, OCP, LSP, ISP and DIP with C++ examples;Composition over inheritance, interfaces and dependency injection;Finding entities, relationships and responsibilities","**Single responsibility**: one reason to change per class, and **open/closed**: extend with new classes instead of editing old ones;**Liskov**: subclasses must work wherever the base is expected, and **dependency inversion**: depend on abstractions;Start LLD by listing **entities, responsibilities and relationships**, then sketch classes and interfaces","Deep inheritance trees: prefer composition and small interfaces.","Design this system with classes: what are the entities, interfaces and extension points?",["Refactor to SOLID","Write a deliberately bad 200-line C++ order-processing program (one god class), then refactor it into classes with interfaces so a new payment method and a new discount rule can be added without editing existing code.","Name the SOLID principle each refactor fixes;Payment and discount behind interfaces;Add a new payment type in a new file only","Before and after class diagram plus a passing test for the new payment type","w"]],
52:["LLD: Parking lot","Requirements: vehicle types, spots, entry and exit, pricing;Classes: ParkingLot, Level, Spot, Vehicle, Ticket, PricingStrategy;Concurrency and extensibility for new vehicle types and pricing rules","Identify the **entities**: ParkingLot, Level, Spot (by size), Vehicle, Ticket, Payment;Use **Strategy** for pricing and spot allocation and **Factory** for vehicles;Keep **allocation thread-safe**: a lock per level or an atomic spot state","Putting all logic in ParkingLot: spot assignment, pricing and payment belong to separate classes.","Design a parking lot in C++: classes, methods and how to add a new vehicle type.",["Parking lot simulator","Implement the parking lot in C++ with multiple levels, spot sizes, entry and exit tickets, an hourly pricing strategy and a console menu, plus unit tests.","Park and unpark with ticket ids;Pricing strategy is swappable;Concurrent entries never assign the same spot","10 scripted scenarios pass including a full lot and a double exit","w"]],
53:["LLD: Elevator system","A state machine for each elevator (idle, moving, doors open);Scheduling strategies: SCAN or LOOK and nearest car;Concurrency, requests inside and outside, extensibility","Model each car as a **state machine** with a sorted set of **stops**;**SCAN or LOOK** serves requests in the current direction before reversing, like disk scheduling;Separate **Controller** (assigns requests), **Elevator** (executes) and **Request**, with a strategy to pick the car","Giving every elevator direct access to all requests: use one controller and per-car queues.","Design an elevator system for a 50-floor building with 4 elevators.",["Elevator controller","Implement an elevator controller simulation in C++ for N cars with SCAN scheduling, a dispatch strategy (nearest suitable car) and a text visualisation. Test with random requests.","Cars never skip a requested floor in their direction;Dispatch strategy is pluggable;No request is starved in 10,000 random requests","Simulation passes starvation and ordering tests","w"]],
54:["LLD: LRU cache and thread-safe designs","LRU with a hash map and doubly linked list, generics with templates, eviction policy interface;Thread-safe wrappers: mutex, shared_mutex, sharding;API design: const-correctness, RAII and error handling","**LRU** is a hash map to list nodes plus a doubly linked list for recency, giving **O(1)** get and put;Make the policy **pluggable** (LRU, LFU, FIFO) behind an interface and keep storage generic with **templates**;For concurrency start with one mutex, then **shard** the cache or use a **shared_mutex** for read-heavy loads","Returning references into the cache that eviction can invalidate: return copies or shared_ptr.","Implement an LRU cache class with get and put and discuss thread safety and extensions such as TTL and LFU.",["Generic cache library","Write a templated C++ cache with pluggable eviction (LRU and LFU), optional TTL, a thread-safe sharded wrapper and a benchmark across thread counts.","Cache<K,V,Policy> with get, put and erase;Sharded wrapper reduces contention;Benchmark 1, 2, 4 and 8 threads","Unit tests plus a throughput table showing sharding helps","w"]],
55:["LLD: Booking system and concurrency control","Entities: Movie, Show, Seat, Booking, Payment and seat locking with timeouts;Double-booking prevention: optimistic versus pessimistic locking and unique constraints;A state machine for bookings and idempotent payments","Prevent **double booking** with a **seat hold** (temporary lock with expiry) and an atomic compare-and-set or a unique constraint;**Pessimistic locking** locks rows up front and **optimistic locking** checks a version at commit and retries;Model the booking as a **state machine** (held, paid, confirmed, expired) with **idempotent** payment callbacks","Check-then-book without atomicity: two users get the same seat.","Design a ticket booking system: how do you prevent two users booking the same seat?",["Seat booking engine","Implement a booking engine in C++ with shows, seats, timed holds, confirmation and expiry. Stress test it with many threads trying to book the same seats.","Holds expire after a timeout;No seat is ever double-booked;Confirm is idempotent","Stress test with 100 threads on 20 seats ends with consistent counts","w"]],
56:["Boss: LLD mock (Splitwise)","Entities: User, Group, Expense, split types (equal, exact, percent) and balances;Simplifying debts with a heap-based algorithm;Extensibility and validation","Represent splits with a **Split strategy** (equal, exact, percentage) and keep a **balance** between users;**Simplify debts** by computing each user's net balance and matching debtors with creditors using heaps;Validate that **splits add up** and use integer cents to avoid rounding errors","Using floating point for money: rounding errors accumulate.","A 40-minute LLD round: requirements, classes, code a core method and discuss edge cases.",["Splitwise","Implement Splitwise in C++: users, groups, expenses with equal, exact and percent splits, balance tracking and a debt simplification algorithm. Include a CLI and tests.","Money stored as integer cents;Debt simplification reduces the number of transactions;Validation rejects splits that do not add up","Test: 4 users, 6 expenses, simplified settlement has at most 3 transfers","w"]],
57:["SQL essentials for interviews","Joins (inner, left, self), GROUP BY, HAVING and subqueries;Window functions: ROW_NUMBER, RANK and running totals;Common patterns: top N per group, deduplication, gaps and islands","**INNER JOIN** keeps matches and **LEFT JOIN** keeps all left rows, while **WHERE** filters rows and **HAVING** filters groups;**Window functions** (ROW_NUMBER, RANK, SUM OVER) compute per-row results without collapsing rows;Top N per group: **ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...)** then filter","Filtering a LEFT JOIN's right table in WHERE: it turns the join into an inner join.","Write a query: second highest salary, top 3 per department, users with consecutive logins.",["SQL practice set","Using SQLite (free), create employees, departments and orders tables with sample data and write 10 queries: joins, aggregation, top-N per group, running total and deduplication.","Use at least two window function queries;Explain query plans with EXPLAIN QUERY PLAN for two queries;Add an index and show the plan change","A .sql file with 10 queries and expected outputs","x"]],
58:["Indexes, query plans and transactions","B-tree indexes, composite index order and covering indexes;ACID, isolation levels and anomalies (dirty read, non-repeatable read, phantom);Locks, MVCC and deadlocks in databases","A **composite index** (a, b) helps filters on a or on a and b, not b alone (**leftmost prefix**);**ACID** means atomicity, consistency, isolation, durability, and higher **isolation** prevents more anomalies at more cost;**MVCC** lets readers see a snapshot without blocking writers","Indexing every column: writes slow down and the planner may still ignore the index.","Why is this query slow and what would you change? Explain isolation levels.",["Index and transaction lab","In SQLite or PostgreSQL (free) load 1 million rows, measure a slow query before and after adding a composite index, then reproduce a lost update and fix it with a transaction.","Show query time and plan before and after;Demonstrate a lost update with two sessions;Fix it with a proper transaction or an atomic update","Written results with timings and the fix","x"]],
59:["Replication, sharding and distributed transactions","Leader-follower replication, lag and failover;Sharding strategies, rebalancing and cross-shard queries;Distributed transactions: 2PC, sagas and the outbox pattern","**Replication lag** causes stale reads: route to the leader or use session tokens for read-your-writes;**2PC** gives atomic commits across shards but blocks if the coordinator fails, while **sagas** use compensating actions;The **outbox pattern** writes the event and the data in one local transaction and then publishes reliably","Assuming failover is instant and lossless: replication is often asynchronous and can lose acknowledged writes.","How do you keep data consistent across multiple services or shards?",["Saga workflow simulator","Simulate an order saga (reserve stock, charge payment, ship) across three services with random failures. Implement compensating actions and an outbox for events.","Each step has a compensation;A failure at any step leaves a consistent final state;The outbox publishes events at least once","Run 10,000 random-failure scenarios and verify the invariants","w"]],
60:["Production engineering: logs, metrics, tracing, reliability","Observability: logs, metrics, traces and alerting on SLIs and SLOs;Reliability: timeouts, retries with jitter, circuit breakers, bulkheads, graceful degradation;Incident handling and post-mortems","Track **SLIs and SLOs** (latency percentiles, error rate, availability) and alert on symptoms;Use **timeouts, retries with exponential backoff and jitter, and circuit breakers** to stop cascading failures;Prefer **graceful degradation** (serve stale or partial data) to total failure","Retrying without backoff or limits: a retry storm turns a small outage into a big one.","How would you make this service reliable and how would you debug a latency spike in production?",["Resilience toolkit","Build a C++ library with a retry-with-backoff-and-jitter helper, a circuit breaker and a bulkhead (bounded concurrency), and a simulation showing how each protects a failing dependency.","Circuit breaker states closed, open and half-open;Retry delays double with random jitter;Simulation compares with and without protection","Table of error rates with and without the toolkit","w"]],
63:["Boss: Mixed CS fundamentals exam","Rapid review: C++ internals, OS, concurrency, networking, databases;Answer 40 questions aloud in 60 minutes;Revisit everything you marked Review later","Spread the review across **C++, OS, concurrency, networking, databases**;Answer out loud in **60 to 90 seconds** with definition, example and pitfall;Everything you hesitate on goes on the **review list**","Skipping topics you already feel good about: confidence is not the same as recall.","A fundamentals round is rapid fire: breadth first, then one deep follow-up.",["Fundamentals oral exam","Pick 40 questions from the Questions page across all categories, answer each aloud within 90 seconds while recording audio, then rate yourself.","At least 5 questions per category;Mark each Clear, Shaky or Missed;Re-study every Missed one","Notes with scores and a re-study list","x"]],
80:["Project deep-dive for 3 years of experience","Pick 2 or 3 past projects and prepare the story: problem, constraints, architecture, your role, hardest bug, result with numbers;Prepare deep follow-ups: why this design, alternatives, what you would change;Quantify impact and ownership","Prepare each project as a **mini case study**: context, constraints, architecture, your contribution, trade-offs, results with numbers;Expect **why and what-if** follow-ups: alternatives, failure modes, scaling;Know every line on your resume well enough to discuss for **10 minutes**","Describing the team's work instead of your own contribution.","Walk me through the most complex system you built and the hardest bug you fixed.",["Project case study write-ups","Write a one-page case study for each of your two strongest projects: context, constraints, architecture diagram, your role, three hard problems, trade-offs, results with numbers, and what you would change.","Each includes a diagram;Each lists 3 trade-offs and 3 failure scenarios;Practise each aloud in 5 minutes","Two one-page PDFs and a recorded 5-minute walkthrough","x"]],
81:["Company-specific preparation","Amazon: Leadership Principles with STAR stories. Google: structured DSA and system design with ambiguity. Microsoft: DSA, design and collaboration;Embedded and semiconductor (NVIDIA, Qualcomm, Intel): C and C++, OS, concurrency, low-level debugging;Research the team, product and engineering blogs","Prepare **two stories per Amazon Leadership Principle** (ownership, customer obsession, dive deep, bias for action);Big-tech SDE loops are **coding, system design and behavioural**, and embedded loops add **C and C++ internals, OS, drivers and debugging**;Study each company's **interview guide and blog**, then tailor your examples","Using one generic set of answers for every company.","Expect the behavioural round to probe ownership, conflict, ambiguity and customer impact.",["Company prep sheets","For three target companies write a one-page prep sheet: interview format, common topics, your stories mapped to their values, five questions to ask them, and application status.","Map six stories to the company's values;List five questions for each;Find two referral contacts per company","Three one-page prep sheets and drafted referral messages","x"]],
83:["Mock: system design (timed)","Pick one prompt: a ride-sharing service, a video streaming platform or a web crawler;Use the framework: requirements, estimates, API, data model, high-level design, deep dive;Time-box: 5 minutes requirements, 10 design, 20 deep dive, 5 wrap-up","**Time-box** the 45 minutes: requirements and estimates first, then high-level design, then deep dives;Say your **trade-offs** aloud: why this database, cache or queue;Finish with **bottlenecks, failure modes and monitoring**","Spending 30 minutes on one component and never presenting the full picture.","Mock yourself: record the session and review where you lost time.",["System design mock","Design a web crawler (or a ride-sharing service) in 45 minutes on paper or a whiteboard app, recording yourself. Afterwards write what you missed and a five-line improvement list.","Follow the six-step framework;Estimate scale with numbers;Cover failure handling and monitoring","Diagram photo, recording and the improvement list","x"]],
85:["Mock: timed DSA round","Two unseen medium problems in 60 minutes and one hard in a further 40;Talk through approach, complexity and tests;Write clean code without autocomplete","Spend **5 minutes** clarifying and planning before coding;State **brute force first, then optimise**, with complexities;**Test** with your own edge cases before saying done","Coding silently: the interviewer scores communication too.","Coding rounds are 45 minutes: one medium or two easy-to-medium problems.",["Timed DSA mock","Pick three unseen LeetCode problems (two Medium, one Hard) and solve them in a 100-minute timer in a plain editor, speaking aloud. Record and review.","No hints or autocomplete;Write the complexity for each;Review your mistakes afterwards","Notes with approach, complexity and mistakes for each problem","x"]],
87:["Mock: HLD and LLD back to back","One 45-minute high-level design and one 45-minute low-level design with a break between;Practise drawing, API signatures and class diagrams;Review trade-offs and edge cases","HLD: **requirements, estimates, components, deep dive**;LLD: **entities, interfaces, patterns, code for one core method**;After each, **review** with the checklist: assumptions, trade-offs, failure modes, tests","Not writing real code or signatures in the LLD round.","Final design loop: expect one HLD and one LLD.",["Design loop mock","Run one HLD (design Instagram or a distributed message queue) and one LLD (design a library system or a vending machine in C++) back to back with timers. Score yourself on a rubric.","Strict 45-minute timers;Rubric scores for clarity, trade-offs, depth and communication;List improvements","Two design documents and a completed rubric","x"]]

const QN=[
[36,"System Design","How do you estimate QPS and storage for a service with 100 million daily active users?","Daily requests = users x actions per user (say 10) = 1 billion, divided by 86,400 seconds is about 11.6k average QPS, and peak is typically 2 to 5 times the average. Storage = records per day x size x retention (for example 100 M x 1 KB x 365 x 5 is about 180 TB before replication). State your assumptions and round numbers.","M"],
[36,"System Design","What non-functional requirements should you clarify first and how do they change the design?","Scale, latency, availability, consistency, durability and cost. Strong consistency and low latency push toward a single leader or a cache, high availability pushes toward replication and eventual consistency, and durability needs replication and write-ahead logs.","E"],
[36,"System Design","Walk me through a framework for a system design interview.","Clarify requirements and scope, estimate scale, define the APIs, design the data model, draw the high-level architecture, deep-dive into the hardest components (storage, caching, scaling, failures), then discuss trade-offs and bottlenecks.","E"],
[37,"System Design","Compare cache-aside, write-through and write-back caching.","Cache-aside: the app reads the cache, on a miss loads from the database and populates the cache. Simple but can serve stale data. Write-through: writes go to the cache and the database together, which is consistent but slower for writes. Write-back: write to the cache and flush later, which is fast but risks data loss if the cache fails.","M"],
[37,"System Design","What is a cache stampede and how do you prevent it?","When a hot key expires, many requests miss at once and hit the database. Prevent it with request coalescing (single flight), locks or leases, refreshing before expiry, jittered TTLs, or serving stale data while revalidating.","H"],
[37,"System Design","Layer 4 versus layer 7 load balancing, and common balancing algorithms?","L4 balances by IP and port without reading HTTP, so it is fast. L7 inspects HTTP (path, headers, cookies) for smarter routing, TLS termination and sticky sessions. Algorithms: round robin, weighted, least connections, IP hash and consistent hashing.","M"],
[38,"Database","SQL or NoSQL: how do you decide?","Use SQL when data is relational and you need joins, constraints and ACID transactions. Use NoSQL when you need horizontal scale, a flexible schema or simple key access at huge volume, accepting weaker consistency or no joins. Many systems use both.","E"],
[38,"Database","How do database indexes work and what do they cost?","A B-tree index keeps keys sorted so lookups and range scans are O(log n) instead of scanning the table. Every write must update the index and indexes use space, so index the columns used in filters, joins and ordering, not everything.","M"],
[38,"Database","Explain replication and sharding and the problems each solves.","Replication copies data to several nodes for availability and read throughput (leader-follower with lag, or multi-leader). Sharding splits data across nodes by a key (range or hash) to scale writes and storage. Challenges: hotspots, rebalancing and cross-shard queries.","M"],
[39,"System Design","What delivery guarantees exist in messaging and how do you get effectively-once processing?","At-most-once may lose messages, at-least-once may duplicate and exactly-once is hard, usually meaning at-least-once plus idempotent processing or transactional writes. Use idempotency keys, deduplication tables or conditional updates.","M"],
[39,"System Design","How does Kafka achieve ordering and scale?","Topics are split into partitions and each partition is an ordered append-only log, so ordering exists only within a partition. Producers choose a partition by key, consumer groups assign partitions to consumers (parallelism is limited by partition count) and consumers track offsets.","H"],
[39,"System Design","What is backpressure and a dead-letter queue?","Backpressure slows or rejects producers when consumers cannot keep up (bounded queues, rate limits, blocking) to avoid memory blowup. A dead-letter queue stores messages that repeatedly fail so they do not block the pipeline and can be inspected.","M"],
[40,"System Design","Explain the CAP theorem accurately.","During a network partition a distributed system must choose between consistency (every read sees the latest write) and availability (every request gets a non-error response). Without a partition you can have both. PACELC adds the latency versus consistency trade-off in normal operation.","M"],
[40,"System Design","What is a quorum and how do R + W > N guarantees work?","With N replicas a write succeeds after W acknowledgements and a read queries R replicas. If R + W > N every read set overlaps every write set in at least one replica, so a read sees the latest version (using version numbers to pick it).","M"],
[40,"System Design","How does Raft keep replicas consistent?","A leader is elected by majority vote in a term. Clients send writes to the leader, which appends them to its log and replicates to followers, and an entry is committed once a majority has it. If the leader fails a new election happens and logs are reconciled to match the leader.","H"],
[41,"System Design","Explain token bucket versus sliding window rate limiting.","Token bucket: a bucket refills at a fixed rate up to a capacity and each request takes a token, so bursts up to the capacity are allowed. Sliding window counts requests in the last T seconds (log or weighted counters): smoother and more accurate but needs more memory. Fixed window is simple but allows bursts at boundaries.","M"],
[41,"System Design","What makes an HTTP method idempotent and why does it matter?","Repeating the request has the same effect as doing it once (GET, PUT, DELETE). It matters for safe retries after timeouts. POST is not idempotent unless you add an idempotency key so the server can deduplicate.","E"],
[41,"System Design","JWT versus server-side sessions: what are the trade-offs?","JWTs are signed, self-contained and stateless so any server can validate them, but they are hard to revoke before expiry and can get large. Sessions store state on the server (or in Redis), which allows instant revocation but needs shared storage and lookups.","M"],
[42,"System Design","Design a URL shortener: how do you generate unique short keys?","Options: base62-encode an auto-increment id (needs a distributed counter, for example ranges handed to each server), hash the URL and take the first 7 characters with a collision check, or pre-generate keys in a key-generation service. Seven base62 characters give about 3.5 trillion combinations.","M"],
[42,"System Design","Where do 301 and 302 redirects matter in a URL shortener?","301 is permanent and cacheable by browsers, which reduces load but hides later clicks from analytics. 302 is temporary so every click hits your server, which allows analytics and changing the target.","E"],
[42,"System Design","How would you scale the read path of a URL shortener to 100k QPS?","Cache hot mappings in Redis or an in-process LRU with a high hit rate, add read replicas, put a CDN or edge cache in front, shard the store by key hash and keep redirect handling stateless behind a load balancer.","M"],
[43,"System Design","Design a distributed rate limiter: main components and trade-offs.","A gateway middleware checks a counter per key in a shared store such as Redis using atomic INCR plus expiry (fixed window) or a Lua script for a token bucket, and returns 429 with Retry-After. Trade-offs: the central store adds latency and a failure point (cache locally and sync, fail open or closed), fixed windows allow bursts and sliding windows cost memory.","H"],
[43,"System Design","How do you avoid race conditions in a distributed counter?","Use atomic operations in the store (INCR, compare-and-set, Lua scripts or transactions) instead of read-modify-write from the application, or shard counters per node and aggregate approximately.","M"],
[43,"System Design","Fail open or fail closed when the rate limit store is unavailable?","It depends on risk. Failing open (allow traffic) protects availability for most public APIs but risks abuse. Failing closed protects backends and security-sensitive endpoints. Many systems fail open with a local fallback limit.","M"],
[44,"System Design","Why use consistent hashing and what are virtual nodes?","Nodes and keys are placed on a hash ring and a key belongs to the next node clockwise, so adding or removing a node remaps only a neighbour's range (about 1/N of keys) instead of nearly all keys with modulo hashing. Virtual nodes give each server many ring positions to balance load and handle different capacities.","M"],
[44,"System Design","How do you handle a hot key in a distributed cache?","Replicate the hot key across several nodes or add a local in-process cache, split the key into sub-keys with random suffixes, use request coalescing, or add a short-TTL layer in front. Monitor key popularity to detect it.","H"],
[44,"System Design","Design an LRU cache node: what is the core data structure?","A hash map for O(1) lookup combined with a doubly linked list ordered by recency. get moves the entry to the head, put inserts at the head and evicts the tail when full. Protect with fine-grained locks or sharding for concurrency.","M"],
[45,"System Design","Explain the LSM-tree write path and why it is write-optimised.","Writes append to a write-ahead log for durability and go into an in-memory sorted memtable. When full it is flushed as an immutable sorted SSTable, and background compaction merges SSTables and drops obsolete versions. All disk writes are sequential, which is fast, and reads may check several files, mitigated by bloom filters.","H"],
[45,"System Design","How does a Dynamo-style store stay available during node failures?","Keys are replicated to N nodes on the ring. Writes use a sloppy quorum with hinted handoff so another node holds the data until the owner returns, reads use read repair and anti-entropy (Merkle trees) to fix divergence, gossip spreads membership and conflicts are resolved with vector clocks or last-write-wins.","H"],
[45,"System Design","What is a bloom filter and where does a storage engine use it?","A compact probabilistic set that can say definitely not present or probably present, with no false negatives. LSM engines keep one per SSTable to skip files that cannot contain a key, which cuts disk reads.","M"],
[46,"System Design","Compare fan-out on write and fan-out on read for a news feed.","Fan-out on write pushes a new post into every follower's timeline at post time, so reads are fast but writes are expensive and wasteful for inactive users or celebrities. Fan-out on read assembles the feed on request: cheap writes but slow, heavy reads. A hybrid pushes for ordinary users and pulls celebrity posts at read time.","M"],
[46,"System Design","How do you paginate a feed that changes constantly?","Use cursor (keyset) pagination based on a stable sort key such as post id or timestamp instead of offsets, so new items do not shift pages and duplicates or skips are avoided.","E"],
[46,"System Design","What would you cache in a news feed system?","Per-user timelines as lists of post ids in a cache like Redis, hot post and user objects and counters. Hydrate ids to full posts with batched lookups, set a TTL and evict inactive users' timelines.","M"],
[47,"System Design","How do you deliver chat messages reliably and in order?","Persist each message with a per-conversation sequence number, send it to the recipient's connected server, require a client ack, and retry or resend from the stored log until acked. Clients dedupe by sequence number and request missing ranges after reconnecting.","M"],
[47,"System Design","WebSockets versus long polling versus server-sent events?","WebSockets give full-duplex persistent connections with low overhead, ideal for chat. Long polling holds HTTP requests open and re-issues them, which works everywhere but wastes resources. SSE is one-way server-to-client over HTTP.","E"],
[47,"System Design","How would you design group chat with 100,000 members?","Avoid per-member delivery writes where possible: store the message once in the group log and have each client pull or be notified with a lightweight event. Fan out via a pub/sub topic per group, shard large groups and use push only for offline users.","H"],
[48,"System Design","How do you build a reliable delayed job scheduler?","Store jobs with a run-at time in a durable store (sorted set or time-bucketed table). Pollers or a heap pick due jobs and workers lease them with a visibility timeout so a failed worker's job becomes available again. Make handlers idempotent, record completion and run multiple scheduler shards with leader election.","H"],
[48,"System Design","How do you avoid sending duplicate notifications?","Give each notification a unique id or idempotency key and record it before or atomically with sending. Consumers check for existing keys, and combined with at-least-once delivery retries become safe.","M"],
[48,"System Design","Why separate queues per notification channel?","Channels have different latencies, rate limits and failure modes (email providers versus push), so isolating them prevents a slow channel from blocking the others and allows independent scaling, retries and prioritisation.","E"],
[49,"System Design","How does a file-sync service avoid re-uploading unchanged data?","Split files into chunks (fixed or content-defined), hash each chunk and ask the server which hashes it already has. Upload only missing chunks and send a manifest of ordered chunk hashes. Content-defined chunking keeps boundaries stable after insertions.","M"],
[49,"System Design","How do you handle conflicting edits to the same file from two devices?","Track versions per file (version vectors or revision ids). If two devices edit the same base revision the server detects divergence and keeps both: save a conflicted copy for the user to merge or apply a deterministic rule such as last-writer-wins.","M"],
[49,"System Design","Why separate metadata storage from blob storage?","Metadata needs small, transactional, indexed queries (SQL or a replicated KV store) while blobs are large immutable objects best stored in cheap, scalable object storage (S3 style) behind a CDN. The two scale and fail differently.","E"],
[50,"LLD","Explain the SOLID principles with a one-line example each.","S: a class has one responsibility (separate report formatting from calculation). O: add behaviour by extension (a new Shape subclass) without modifying existing code. L: derived classes must honour the base contract. I: many small interfaces rather than one fat one. D: high-level code depends on abstractions (inject a Logger interface).","E"],
[50,"LLD","Composition versus inheritance: when do you use which?","Use inheritance for a true is-a relationship with substitutable behaviour. Prefer composition (has-a) to reuse behaviour flexibly, swap implementations at run time and avoid tight coupling and deep hierarchies.","M"],
[50,"LLD","What is dependency injection and why does it help testing?","Passing dependencies (interfaces) into a class instead of creating them inside lets you substitute fakes or mocks in tests and swap implementations without changing the class.","E"],
[52,"LLD","Design a parking lot: list the main classes and relationships.","ParkingLot has Levels, a Level has Spots of types (compact, large, motorcycle), Vehicle has subclasses, a Ticket links vehicle, spot and entry time, a PricingStrategy computes fees, a SpotAllocationStrategy chooses a spot, and payment processing is separate.","E"],
[52,"LLD","How would you make parking spot allocation thread-safe?","Make spot state changes atomic: a mutex per level or per spot, or an atomic compare-and-set on the spot's occupied flag. Allocate by finding a free spot and claiming it in one critical section so two gates cannot take the same spot.","M"],
[52,"LLD","How do you add a new pricing rule without modifying existing code?","Define a PricingStrategy interface and add a new class implementing it (open/closed principle), then inject the chosen strategy into the pricing service via configuration or a factory.","E"],
[53,"LLD","Design an elevator system: how do you choose which elevator serves a request?","A controller scores each car by direction, distance and load: prefer a car already moving toward the request in the same direction, otherwise the nearest idle car. Use SCAN or LOOK within a car, keep the strategy pluggable and avoid starvation.","M"],
[53,"LLD","How would you model elevator states and transitions?","States: Idle, MovingUp, MovingDown, DoorsOpen (and Maintenance). Events: request added, arrival at a floor, door timer, emergency stop. A state machine ensures valid transitions, for example doors open only when stopped.","E"],
[53,"LLD","How is the elevator algorithm similar to disk scheduling?","SCAN and LOOK move in one direction serving requests along the way and then reverse, minimising direction changes and starvation, exactly like the elevator algorithm used for disk head scheduling.","E"],
[54,"LLD","Implement an LRU cache: which data structures give O(1) get and put?","A hash map from key to a node in a doubly linked list that orders entries by recency. get moves the node to the front, and put inserts at the front and, when over capacity, removes the tail entry and its map entry.","M"],
[54,"LLD","How do you make a cache thread-safe without a global lock bottleneck?","Shard the cache by key hash with one mutex per shard, use shared (reader-writer) locks for read-heavy loads, keep critical sections small and consider approximations such as CLOCK or sampling to avoid reordering on every read.","H"],
[54,"LLD","How would you add TTL support to an LRU cache?","Store an expiry timestamp per entry and treat expired entries as misses on access (lazy expiry), plus a background sweeper or a min-heap of expiries to reclaim memory. Keep the clock injectable for tests.","M"],
[55,"LLD","How do you prevent double booking of the same seat?","Make seat acquisition atomic: a conditional update (set status to held where status is available) or compare-and-swap, a row-level lock in the database, or a unique constraint on (show, seat). Use a timed hold so abandoned carts release seats.","M"],
[55,"LLD","Optimistic versus pessimistic locking: when do you prefer which?","Pessimistic locking locks data before modification and suits high contention but reduces concurrency. Optimistic locking uses a version check at commit and retries on conflict, which is better when conflicts are rare.","M"],
[55,"LLD","How do you make payment callbacks safe when they can be delivered twice?","Treat them idempotently: use the payment or order id as an idempotency key, record processed ids and make state transitions conditional (confirm only if currently held) so repeats are harmless.","M"],
[56,"LLD","How do you simplify debts among a group of friends?","Compute each person's net balance (paid minus owed). Put positive balances (creditors) and negative balances (debtors) in two heaps and repeatedly match the largest debtor with the largest creditor, settling the smaller amount. This yields at most n minus 1 transactions.","M"],
[56,"LLD","Why avoid floating point for money and how do you split 100 among 3?","Floating point cannot represent decimal fractions exactly, so errors accumulate. Store integer cents and distribute the remainder explicitly: 33.33, 33.33 and 33.34 using the leftover cent.","E"],
[56,"LLD","Design a flexible split strategy for expenses.","Define a SplitStrategy interface with validate and compute methods and implement EqualSplit, ExactSplit and PercentSplit. The Expense holds a strategy so new split types need no changes to existing code.","E"],
[57,"Database","Find the second highest salary in a table.","Use DENSE_RANK() OVER (ORDER BY salary DESC) and filter rank = 2, or SELECT MAX(salary) FROM employees WHERE salary < (SELECT MAX(salary) FROM employees). Handle ties and the case where it does not exist (return NULL).","E"],
[57,"Database","What is the difference between WHERE and HAVING, and between INNER and LEFT JOIN?","WHERE filters individual rows before grouping and HAVING filters groups after aggregation. INNER JOIN returns only matching rows, LEFT JOIN returns all left rows with NULLs where there is no match.","E"],
[57,"Database","How do you get the top 3 earners per department?","SELECT ... FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) AS rn FROM employees) WHERE rn <= 3. Use RANK or DENSE_RANK if ties should all be included.","M"],
[58,"Database","Explain database isolation levels and the anomalies they prevent.","Read uncommitted allows dirty reads, read committed prevents them, repeatable read also prevents non-repeatable reads, and serializable prevents phantoms too, as if transactions ran one by one. Higher isolation reduces concurrency and may cause retries or aborts.","M"],
[58,"Database","What is a covering index and the leftmost-prefix rule?","A covering index contains every column a query needs, so the database answers from the index without touching the table. For a composite index (a, b, c) the planner can use it for filters on a, on (a, b) or on (a, b, c), but not for b or c alone.","M"],
[58,"Database","What is MVCC and why do readers not block writers?","Multi-version concurrency control keeps multiple versions of rows tagged with transaction ids. Each transaction reads a consistent snapshot while writers create new versions, so reads and writes rarely block each other. Old versions are cleaned up later (vacuum).","H"],
[59,"Database","Two-phase commit versus saga: what are the trade-offs?","2PC coordinates a prepare then commit across participants for atomicity but holds locks and blocks if the coordinator fails, hurting availability and latency. Sagas run local transactions with compensating actions on failure, giving availability but only eventual consistency and requiring careful compensation design.","H"],
[59,"Database","What is the outbox pattern?","Write the business change and an event row in the same database transaction. A separate relay publishes outbox rows to the message broker and marks them sent, which avoids losing events or publishing events for rolled-back transactions.","H"],
[59,"Database","How do you handle replication lag for read-your-writes consistency?","Route a user's reads to the leader for a short time after writes, use session or version tokens so replicas wait until they have caught up, or read from replicas only for non-critical data.","M"],
[60,"System Design","What is a circuit breaker and how do retries with jitter help?","A circuit breaker opens after repeated failures so calls fail fast instead of piling up, then half-opens to test recovery. Retries with exponential backoff and random jitter spread retry traffic so synchronised clients do not overload a recovering service.","M"],
[60,"System Design","How do you investigate a sudden p99 latency spike?","Check recent deploys and config changes, compare metrics (CPU, GC, queue depth, DB latency, saturation) across the timeline, use traces to find the slow hop, look at logs for errors and retries, and roll back or shed load first if customers are affected.","M"],
[60,"System Design","What are SLI, SLO and SLA?","An SLI is a measured indicator (request latency, success rate). An SLO is the internal target for it (99.9 percent under 300 ms). An SLA is the contractual promise to customers, usually with penalties.","E"],
[80,"Behavioural","Walk me through the most complex project you have worked on.","Structure: context and goal, constraints, architecture, your specific contribution, the hardest technical problem and how you solved it, trade-offs considered, a measurable result and what you would do differently. Keep it to 3 to 5 minutes and invite follow-ups.","M"],
[80,"Behavioural","What would you change about that design if you rebuilt it today?","Pick real improvements such as better testability, observability, a different data model or concurrency approach, with the reasoning and costs. Show you learn from experience and understand trade-offs rather than claiming perfection.","M"],
[81,"Behavioural","Tell me about a time you took ownership beyond your role.","Use STAR: a situation where something was unowned or failing, the action you took without being asked (fixing the root cause, coordinating teams), a measurable result and how you made it sustainable with documentation, tests or process.","M"],
[81,"Behavioural","Describe a time you dealt with ambiguity or incomplete requirements.","Explain how you clarified goals with stakeholders, made explicit assumptions, delivered a small first version to learn quickly and iterated, ending with the outcome and what you learned.","M"],
[83,"System Design","Design a web crawler: main components and challenges.","A URL frontier (priority queue with politeness per host), fetcher workers, a DNS cache, a content parser, duplicate detection (URL normalisation and content hashing or simhash), a storage layer, robots.txt compliance and rate limiting per domain. Scale by partitioning the frontier by host hash.","H"],
[83,"System Design","Design a ride-sharing dispatch: how do you match riders and drivers?","Index driver locations with a geospatial structure (geohash, S2 or a quadtree) updated by frequent location pings. On a request, query nearby drivers, rank by ETA, offer to the best with timeouts, assign atomically to avoid double assignment and shard by region.","H"]

  h+=`<details data-k="${k}" ${OPEN.has(k)||wk(S.day)==w&&!OPEN.has('x')?'open':''}><summary class="${done==ds.length?'dn':''}">Week ${w}: ${e(WEEKS[w-1][0])} <span class="mu sm">(${done}/${ds.length} days)</span></summary><div class="in"><p class="mu">${e(WEEKS[w-1][1])}</p><div class="rs" style="margin-bottom:8px">${WEEKS[w-1][2].map(link).join('')}</div>
  ${ds.map(n=>{const s=stat(n),p=Math.round(dprog(n).p*100);return `<div class="pr"><span class="dot s-${s}"></span><button class="sbtn ${n==S.day?'pri':''}" data-a="goday" data-i="${n}">Day ${n}</button><span class="grow">${e(PLAN[n-1].t)}</span><span class="mu sm">${p}%</span></div>`}).join('')}
  <p style="margin-top:8px"><button class="sbtn" data-a="goweek" data-i="${w}">Weekend project: ${e(WPS[w-1].n)}</button></p></div></details>`}
 return h}

${sec('g1','What top companies test (SDE and embedded)',`<div class="tw"><table><tr><th>Round</th><th>SDE roles</th><th>Embedded software roles</th></tr><tr><td>Coding (2 to 3 rounds)</td><td>DSA mediums and sometimes a hard</td><td>DSA mediums plus C and C++ coding (bits, ring buffers, memory)</td></tr><tr><td>Design</td><td>System design (HLD) and low-level design (LLD)</td><td>Embedded system design, drivers, RTOS</td></tr><tr><td>Fundamentals</td><td>OS, concurrency, networking, databases</td><td>OS, concurrency, interrupts, buses, debugging</td></tr><tr><td>Behavioural</td><td>Ownership, conflict, ambiguity</td><td>Same, plus project deep-dives</td></tr></table></div><p>With 3 years of experience the bar for system design and project depth is higher than for freshers. This plan spends weeks 6 to 9 on design and databases for that reason.</p>`)}
${sec('gs','Free setup: Visual Studio and WSL',`<ol><li><b>Visual Studio Community</b> (free): ${link(['download it','https://visualstudio.microsoft.com/vs/community/'])}. Tick <i>Desktop development with C++</i>.</li><li>Create a Console App (C++) per project. Run with Ctrl+F5 and debug with F5. For input from a file use Project Properties, Debugging, Command Arguments: &lt; input.txt</li><li>Turn on AddressSanitizer: Project Properties, C/C++, Enable Address Sanitizer = Yes.</li><li><b>WSL2</b> for projects tagged Needs Linux: ${link(['install guide','https://learn.microsoft.com/windows/wsl/install'])}. Then run sudo apt update and sudo apt install -y build-essential gdb valgrind cmake strace.</li><li><b>Git and GitHub</b> (free): keep one repository with a folder per project.</li><li>For embedded practice: ${link(['Wokwi simulator','https://wokwi.com/'])} in the browser and ${link(['QEMU','https://www.qemu.org/'])}.</li></ol>`)}
${sec('g3','Where to apply',`<div class="rs">${[['Google','https://www.google.com/about/careers/applications/'],['Amazon','https://www.amazon.jobs/'],['Microsoft','https://careers.microsoft.com'],['Apple','https://jobs.apple.com'],['NVIDIA','https://www.nvidia.com/en-us/about-nvidia/careers/'],['Qualcomm','https://www.qualcomm.com/company/careers'],['Intel','https://jobs.intel.com'],['AMD','https://careers.amd.com'],['Texas Instruments','https://careers.ti.com'],['Cisco','https://jobs.cisco.com'],['Arista','https://www.arista.com/en/careers'],['Tesla','https://www.tesla.com/careers']].map(link).join('')}</div><p>Ask for referrals: they beat cold applications. Start applying around Day 60 so real interviews overlap with your preparation.</p>`)}
${sec('g4','Resources',`<div class="tw"><table><tr><th>Topic</th><th>Free resources</th></tr><tr><td>C++</td><td>${[['learncpp','https://www.learncpp.com/'],['cppreference','https://en.cppreference.com/'],['CppCon','https://www.youtube.com/@CppCon']].map(link).join(', ')}</td></tr><tr><td>OS and concurrency</td><td>${[['OSTEP','https://pages.cs.wisc.edu/~remzi/OSTEP/'],['LLNL pthreads','https://hpc-tutorials.llnl.gov/posix/'],['Preshing','https://preshing.com/']].map(link).join(', ')}</td></tr><tr><td>Networking</td><td>${[["Beej's guide",'https://beej.us/guide/bgnet/'],['Cloudflare learning','https://www.cloudflare.com/learning/']].map(link).join(', ')}</td></tr><tr><td>System design</td><td>${[['System Design Primer','https://github.com/donnemartin/system-design-primer'],['ByteByteGo','https://bytebytego.com/'],['Hello Interview','https://www.hellointerview.com/']].map(link).join(', ')}</td></tr><tr><td>LLD and patterns</td><td>${link(['Refactoring Guru','https://refactoring.guru/design-patterns'])}</td></tr><tr><td>Databases</td><td>${[['SQLBolt','https://sqlbolt.com/'],['Use The Index, Luke','https://use-the-index-luke.com/']].map(link).join(', ')}</td></tr><tr><td>Embedded</td><td>${[['Memfault Interrupt','https://interrupt.memfault.com/'],['FreeRTOS','https://www.freertos.org/Documentation/00-Overview'],['Bootlin','https://bootlin.com/training/']].map(link).join(', ')}</td></tr><tr><td>DSA and mocks</td><td>${[['LeetCode','https://leetcode.com/problemset/'],['NeetCode','https://neetcode.io/roadmap'],['Pramp','https://www.pramp.com/'],['interviewing.io','https://interviewing.io/']].map(link).join(', ')}</td></tr></table></div>`)}
</div>`}

function vSet(){return `<div class="card"><h3>Go to a day</h3><div class="row"><select id="gd">${PLAN.map(p=>`<option value="${p.n}"${p.n==S.day?' selected':''}>Day ${p.n}: ${e(p.t)}</option>`).join('')}</select><button data-a="gdbtn">Go</button></div>
 <h3 style="margin-top:16px">Extract everything</h3><p class="mu sm">Downloads one .zip: every solution as a real code file (<code>solution.cpp</code>, <code>solution.py</code> ...) plus a README with your explanation and complexity, an index, and a full <code>backup.json</code>. Unzip it anywhere.</p><div class="row"><button data-a="expsol" class="cu">Export solutions (.zip)</button></div>
 <h3 style="margin-top:16px">Backup</h3><p class="mu sm">Progress is saved inside this app on this computer. Download a backup now and then; the Import button restores everything, including solutions and code.</p><div class="row"><button data-a="exp">Download JSON</button><input type="file" id="imf" accept=".json,application/json"><button data-a="impF">Import file</button></div>
 <h3 style="margin-top:16px">Reset</h3><button data-a="rst" style="color:var(--bd)">Reset all progress</button></div>`}


// ---------- Solution notes + code ----------
const SOL=new Set();
const LANGS={cpp:['C++','cpp'],c:['C','c'],py:['Python','py'],java:['Java','java'],js:['JavaScript','js'],other:['Other','txt']};
const SOLTPL='1. Brute force: ...\n2. Better idea (data structure / pattern): ...\n3. Steps:\n   - ...\n4. Edge cases: ...';
function solPanel(p){const s=ps(p.id),open=SOL.has(p.id),has=!!(s.note||s.code||s.tc||s.sc),lg=s.lang||'cpp';
 const prev=(s.note||'').split('\n')[0];
 let h=`<div class="sol"><div class="solb"><button class="sbtn${has?' has':''}" data-a="sol" data-i="${p.id}" aria-expanded="${open}">${open?'▾':'▸'} Solution${has?' ●':''}</button>${!open&&prev?`<span class="solprev">${e(prev)}</span>`:''}</div>`;
 if(open)h+=`<div class="solbody">
  <div><label class="l">Explanation (approach, why it works)</label><textarea data-s="p:${p.id}:note" placeholder="${e(SOLTPL)}">${e(s.note||'')}</textarea></div>
  <div class="solmeta"><div><label class="l">Time complexity</label><input type="text" data-s="p:${p.id}:tc" placeholder="e.g. O(n)" value="${e(s.tc||'')}"></div><div><label class="l">Space complexity</label><input type="text" data-s="p:${p.id}:sc" placeholder="e.g. O(n)" value="${e(s.sc||'')}"></div></div>
  <div><div class="codehead"><label class="l grow" style="margin:0">Code</label><select data-s="p:${p.id}:lang" aria-label="Language">${Object.keys(LANGS).map(k=>`<option value="${k}"${k==lg?' selected':''}>${LANGS[k][0]}</option>`).join('')}</select><button class="sbtn" data-a="copycode" data-i="${p.id}">Copy</button></div>
  <textarea class="codebox" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" data-s="p:${p.id}:code" placeholder="Paste or type your solution. Tab indents, Esc leaves the box.">${e(s.code||'')}</textarea></div>
 </div>`;
 return h+'</div>'}

// minimal ZIP writer (stored, no compression) so everything can be extracted with any unzip tool
const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=~0;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return(~c)>>>0};
function makeZip(files){const te=new TextEncoder(),d=new Date(),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
 const parts=[],cen=[];let off=0;
 files.forEach(f=>{const nm=te.encode(f.name),data=te.encode(f.data),crc=crc32(data),lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
  parts.push(new Uint8Array(lh.buffer),nm,data);
  const ch=new DataView(new ArrayBuffer(46));
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  cen.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+data.length});
 let cs=0;cen.forEach(x=>cs+=x.length);
 const en=new DataView(new ArrayBuffer(22));en.setUint32(0,0x06054b50,true);en.setUint16(8,files.length,true);en.setUint16(10,files.length,true);en.setUint32(12,cs,true);en.setUint32(16,off,true);
 return new Blob([...parts,...cen,new Uint8Array(en.buffer)],{type:'application/zip'})}
const fslug=x=>x.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'untitled';
function dl(blob,name){const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(l.href),2000)}
function exportSolutions(){
 const list=PL.filter(p=>{const s=ps(p.id);return s.note||s.code||s.tc||s.sc});
 if(!list.length){alert('No solutions written yet. Open a problem, click Solution and add an explanation or code first.');return}
 const files=[],idx=['# My DSA solutions','',`Exported ${new Date().toLocaleString()}`,'',`${list.length} problems`,''];
 list.forEach(p=>{const s=ps(p.id),lg=LANGS[s.lang||'cpp'],dir=`solutions/${fslug(p.c)}/${fslug(p.n)}/`;
  let md=`# ${p.n}\n\n- Topic: ${p.c}\n- Difficulty: ${p.d}\n- Status: ${s.st=='done'?'Solved':'Not solved'}\n`;
  if(s.tc)md+=`- Time: ${s.tc}\n`;if(s.sc)md+=`- Space: ${s.sc}\n`;
  md+=`\n## Explanation\n\n${s.note||'(none)'}\n`;
  if(s.code){md+=`\n## Code (${lg[0]})\n\n\`\`\`${lg[1]}\n${s.code}\n\`\`\`\n`;files.push({name:dir+'solution.'+lg[1],data:s.code})}
  files.push({name:dir+'README.md',data:md});
  idx.push(`- [${p.n}](${dir}README.md) (${p.c}, ${p.d})`)});
 files.unshift({name:'README.md',data:idx.join('\n')+'\n'});
 files.push({name:'backup.json',data:JSON.stringify(S,null,1)});
 dl(makeZip(files),'dsa-solutions-'+new Date().toISOString().slice(0,10)+'.zip')}

document.addEventListener('keydown',ev=>{const t=ev.target;if(!t.classList||!t.classList.contains('codebox'))return;
 const fire=()=>t.dispatchEvent(new Event('input',{bubbles:true}));
 if(ev.key=='Escape'){t.blur();return}
 if(ev.key=='Tab'){ev.preventDefault();const a=t.selectionStart,b=t.selectionEnd;
  if(ev.shiftKey){const ls=t.value.lastIndexOf('\n',a-1)+1;if(t.value.slice(ls,ls+4)=='    '){t.value=t.value.slice(0,ls)+t.value.slice(ls+4);t.selectionStart=t.selectionEnd=Math.max(ls,a-4);fire()}return}
  t.value=t.value.slice(0,a)+'    '+t.value.slice(b);t.selectionStart=t.selectionEnd=a+4;fire();return}
 if(ev.key=='Enter'&&!ev.ctrlKey&&!ev.metaKey){const a=t.selectionStart,ls=t.value.lastIndexOf('\n',a-1)+1,line=t.value.slice(ls,a),ind=(line.match(/^[ \t]*/)||[''])[0],extra=/[{:(\[]\s*$/.test(line)?'    ':'';
  ev.preventDefault();const ins='\n'+ind+extra;t.value=t.value.slice(0,a)+ins+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=a+ins.length;fire()}});

const VW={study:vStudy,q:vQ,proj:vProj,dsa:vDsa,road:vRoad,guide:vGuide,set:vSet};
function R(){const y=scrollY;S.v=VW[S.v]?S.v:'study';$('#app').innerHTML=head()+VW[S.v]();save();scrollTo(0,TOP?0:y);TOP=false}
function setv(a,i,k,v){if(a=='done')dn(i)[k]=v;else if(a=='p')pw(i)[k]=v;else if(a=='q')qw(i)[k]=v;else if(a=='w')(S.w[i]||(S.w[i]={}))[k]=v}

document.addEventListener('input',ev=>{const t=ev.target;
 if(t.dataset.s){const[a,i,k]=t.dataset.s.split(':');setv(a,i,k,t.value);save();return}
 if(t.dataset.f&&t.tagName!='SELECT'){F[t.dataset.f]=t.value;R();const x=document.getElementById('f_'+t.dataset.f);if(x){x.focus();x.setSelectionRange(1e3,1e3)}}});
document.addEventListener('toggle',ev=>{const k=ev.target.dataset&&ev.target.dataset.k;if(k){ev.target.open?OPEN.add(k):OPEN.delete(k)}},true);
document.addEventListener('change',ev=>{const t=ev.target,a=t.dataset.a,i=t.dataset.i;
 if(t.dataset.f&&t.tagName=='SELECT'){F[t.dataset.f]=t.value;R();return}
 if(!a)return;
 if(a=='dsel'){S.day=+t.value;delete F.pw;TOP=true}
 else if(a=='learn')dn(S.day).learn=t.checked;
 else if(a=='br'){const[n,j]=i.split(':'),o=dn(n);o.br=o.br||[];o.br[j]=t.checked}
 else if(a=='pdone')pw(i).st=t.checked?'done':'';
 else if(a=='ws'){const[w,j]=i.split(':'),o=S.w[w]||(S.w[w]={});o.s=o.s||[];o.s[j]=t.checked}
 else return;
 R()});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(!t||t.tagName=='SELECT'||t.type=='checkbox')return;const a=t.dataset.a,i=t.dataset.i;
 if(a=='tab'){S.v=i;TOP=true}
 else if(a=='dd'){S.day=Math.max(1,Math.min(N,S.day+ +i));delete F.pw;TOP=true}
 else if(a=='nextopen'){S.day=firstOpen();delete F.pw;TOP=true}
 else if(a=='goday'){S.day=+i;S.v='study';delete F.pw;TOP=true}
 else if(a=='goweek'){F.pw=+i;F.pt='weekend';S.v='proj';TOP=true}
 else if(a=='sol'){SOL.has(i)?SOL.delete(i):SOL.add(i)}
 else if(a=='copycode'){const c=ps(i).code||'';(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>{t.textContent='Copied';setTimeout(()=>{t.textContent='Copy'},1200)},()=>{const x=document.querySelector('.codebox[data-s="p:'+i+':code"]');if(x){x.select();document.execCommand('copy')}});return}
 else if(a=='expsol'){exportSolutions();return}
 else if(a=='star'){const s=pw(i);s.star=s.star?0:1}
 else if(a=='qshow'){OPENQ.has(i)?OPENQ.delete(i):OPENQ.add(i)}
 else if(a=='qrate'){const[id,st]=i.split(':'),s=qw(id);s.st=s.st==st?'':st}
 else if(a=='qt'){F.qt=i}
 else if(a=='qall'){F.qall=1}
 else if(a=='pt'){F.pt=i}
 else if(a=='pw'){F.pw=Math.max(1,Math.min(13,(F.pw||wk(S.day))+ +i))}
 else if(a=='co'){F.dco=(F.dco==i||!i)?'':i;if(S.v!='dsa'){S.v='dsa';TOP=true}}
 else if(a=='openguide'){OPEN.add('gs');S.v='guide';TOP=true}
 else if(a=='gdbtn'){S.day=+$('#gd').value;S.v='study';TOP=true}
 else if(a=='exp'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='interview-guide-backup.json';l.click();return}
 else if(a=='impF'){const f=$('#imf').files[0];if(!f){alert('Choose a .json file first.');return}const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!x.done||!x.p)throw 0;if(!confirm('Replace current progress with this backup?'))return;S=Object.assign(seed(),x);R()}catch(_){alert('Not a valid backup file.')}};r.readAsText(f);return}
 else if(a=='rst'){if(confirm('Reset all progress and notes? This cannot be undone.')){S=seed()}else return}
 R()});
R();
</script></body></html>
