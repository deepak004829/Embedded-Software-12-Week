[64,"Embedded Linux","Yocto or Buildroot: how do you choose?","Buildroot is simple and fast and produces one root filesystem image, which suits small fixed products. Yocto uses layers and recipes, supports package management and SDK generation and reproducible multi-product builds, but has a steeper learning curve and longer builds. Choose Buildroot for simplicity and Yocto for scale and long-term maintenance.","buildroot;yocto;layer|recipe;simple|learning curve;sdk|package",null,"What is a Yocto layer?","M"],
[65,"Embedded Linux","What does U-Boot do and what does it hand to the kernel?","U-Boot initialises RAM and basic devices, loads the kernel image, the device tree blob and optionally an initramfs into memory, sets the kernel command line (bootargs) and jumps to the kernel entry with registers pointing to the DTB. It also supports network and USB boot and recovery.","bootloader|u boot;dtb|device tree;bootargs|command line;initramfs|load",null,"How does the kernel know where the DTB is?","M"],
[65,"Embedded Linux","How does the kernel match a driver to a device in the device tree?","The node's compatible string is matched against the driver's of_match_table when the bus is probed; on a match the driver's probe() runs with the node's resources (reg, interrupts, clocks, gpios) which it reads with the platform or OF helpers.","compatible;of match|match table|match;probe;reg|interrupt|resource",null,"What if two drivers match the same compatible string?","M"],
[66,"Embedded Linux","Why can't a kernel module use the C standard library?","The kernel is freestanding: no libc, no floating point by default and small fixed stacks. Modules use kernel APIs instead: printk, kmalloc and kfree, memcpy variants, copy_to_user, mutexes and spinlocks, and list helpers.","libc|freestanding|standard library;printk;kmalloc;stack|floating",null,"Why is floating point avoided in the kernel?","M"],
[67,"Embedded Linux","What can go wrong if a driver dereferences a user pointer directly?","The pointer may be invalid, unmapped, malicious or point into kernel memory, causing an oops or a privilege escalation, and the page may be swapped out. Use copy_from_user and copy_to_user (or get_user and put_user), which validate access and handle faults, and check their return values.","invalid|malicious|unmapped;copy from user|copy_from_user|copy to user|copy_to_user;fault|oops|security;check|return value",null,"What does copy_to_user return on failure?","H"],
[68,"Embedded Linux","Tasklet, workqueue or threaded IRQ: when do you use which?","Tasklets and softirqs run in atomic context and cannot sleep, so they suit short deferred work. Workqueues run in process context and can sleep, take mutexes and do I/O. A threaded IRQ runs the bottom half in a kernel thread, which simplifies drivers that need to sleep; new code mostly uses workqueues or threaded IRQs.","atomic|cannot sleep|no sleep;workqueue|process context|sleep;threaded irq|kernel thread;tasklet",null,"What context is a timer callback in?","H"],
[69,"Embedded","What are the rules for calling FreeRTOS APIs from an ISR?","Use only the FromISR variants (for example xQueueSendFromISR), pass a higher-priority-task-woken flag and call portYIELD_FROM_ISR at the end, keep the ISR priority at or below configMAX_SYSCALL_INTERRUPT_PRIORITY, and never block.","fromisr|from isr;higher priority task woken|yield;never block|no block|not block;priority|configmax",null,"What happens if the ISR priority is too high?","M"],
[69,"Embedded","What is the rate-monotonic utilisation bound and when does it not apply?","Rate-monotonic scheduling gives the shortest period the highest priority. For n independent periodic tasks it is guaranteed schedulable if total utilisation is at most n(2^(1/n) - 1), about 69% for large n. The test is sufficient, not necessary; blocking, jitter and aperiodic tasks need extra analysis such as response-time analysis.","shortest period|shorter period|period;utilisation|utilization|69|ln 2;sufficient;blocking|jitter|response time",null,"Is a task set at 80% utilisation always unschedulable?","H"],

["**Stack** holds locals and is freed on return, **heap** is manual (malloc and free), and **.data, .bss, .rodata, .text** hold globals, zeroed globals, constants and code;A **pointer** stores an address: the address-of operator takes one, the dereference operator follows one, and **NULL** means points nowhere;A **dangling** pointer refers to freed memory and a **wild** pointer was never initialised, so set pointers to NULL after free","Returning the address of a local variable: the stack frame is gone, so the pointer dangles.","Where does each variable live, and what happens if you use memory after free?"],
["An array name **decays** to a pointer to its first element, so **sizeof** inside a function gives the pointer size;**Pointer arithmetic** is scaled by the element size: p+1 moves by sizeof of the pointed-to type, and a[i] is the same as the dereference of a+i;Read declarations right to left: a **pointer to const** data protects the data, a **const pointer** protects the pointer","Using sizeof on an array parameter: it is really a pointer, so you get 8 (or 4), not the array size.","What is the difference between arr and &arr, and what does sizeof return for each?"],
["C strings end with a **null terminator**: strlen counts up to it, sizeof counts the whole array including it;**memmove** handles overlapping regions and **memcpy** does not;Every copy needs a **length check**: use bounded functions and terminate manually","Allocating strlen(s) bytes instead of strlen(s)+1: the terminator overflows the buffer by one byte.","Implement strlen, strcpy and memmove on a whiteboard and explain overlap handling."],
["The compiler inserts **padding** so members are aligned: order members **largest to smallest** to shrink a struct;A **union** shares one block of memory between members, useful for registers and protocol parsing;**Endianness** is byte order: little-endian stores the least significant byte first and network order is big-endian","Casting a struct pointer to a byte buffer for the network: padding and endianness make it non-portable.","What is sizeof this struct and why? How do you check endianness in code?"],
["Set, clear, toggle, test: **x |= 1u<<n**, **x &= ~(1u<<n)**, **x ^= 1u<<n**, **(x>>n)&1**;**x & (x-1)** clears the lowest set bit, which powers popcount and the power-of-two test;Use **unsigned** types: shifting negative signed values or by too many bits is undefined or implementation-defined","Writing 1<<31 with a signed int: the shift reaches the sign bit (undefined behaviour). Use 1u.","Count set bits, check a power of two, swap bits, extract a bit field from a register."],
["**static** at file scope hides a symbol from other files, inside a function it keeps its value between calls;**volatile** tells the compiler a value can change outside its knowledge (hardware, ISR), so every access really happens;A **function pointer** plus a context pointer gives callbacks, and macros need **parentheses** and evaluate arguments twice","Assuming volatile makes code thread-safe: it gives neither atomicity nor ordering.","Explain volatile, static and extern, and write a safe macro (or say why you would use inline instead)."],
["Review the whole week: **pointers and memory layout**, **arrays versus pointers**, **bit operations**, **struct padding**, **volatile and static**;Work under a timer: **45 minutes**, no notes, and explain every answer aloud;Every miss goes into the **Review later list** with the correct concept","Rereading notes instead of testing yourself: only retrieval practice sticks.","Interview rounds are timed and spoken: practise thinking aloud."],
["**malloc** returns uninitialised memory or NULL, **calloc** zeroes it, **realloc** may move the block, and **free(NULL)** is safe;The three big bugs are **leak**, **use-after-free** and **double free**: find them with **ASan** and **Valgrind**;Assign realloc to a **temporary pointer** so a failure does not lose the old block","p = realloc(p, n): on failure p becomes NULL and the original block leaks.","Write a dynamic array, find the leak in this code, explain how you would detect leaks in production."],
["A **table-driven state machine** stores (state, event) to (next state, action) as data, which is easier to extend and test than nested switches;**Callbacks** need a context pointer (void star) to carry state, so document who owns it;An **opaque pointer** (forward-declared struct) hides implementation behind a clean API","Unexpected events with no default handler: the machine silently ends up in a wrong state.","Design a vending machine, traffic light or UART parser as a state machine."],
["Generic containers use a **void pointer** plus an **element size**, with callbacks for compare, copy and free;A **hash map** is an array of buckets plus a hash function plus a collision strategy, resized at about **0.75 load factor**;Decide **ownership** up front: who allocates and who frees keys and values","Forgetting to free keys or values when removing entries or destroying the container.","Implement a hash map or linked list API and discuss collision handling."],
["**RAII**: acquire in the constructor, release in the destructor, so cleanup runs on every path, even with exceptions;Members are constructed in **declaration order** and destroyed in **reverse** order;**Rule of zero, three and five**: if you manage a resource define (or delete) copy and move together, or better wrap it in a type that does","Writing a destructor but forgetting copy construction and assignment: two objects free the same memory.","Explain RAII with a file or mutex example and the rule of five."],
["**virtual** functions dispatch through the **vtable** via a hidden vptr in each object;A base class meant for polymorphism needs a **virtual destructor**, or deleting through a base pointer is undefined;**Slicing**: copying a derived object into a base object by value cuts off the derived part","Calling virtual functions in constructors or destructors: they resolve to the class being built, not the derived override.","How do virtual functions work? What is a pure virtual function and what does override add?"],
["**unique_ptr** is sole ownership (move-only), **shared_ptr** is reference-counted, **weak_ptr** is a non-owning observer that breaks cycles;**std::move** only casts to an rvalue and the move constructor does the transfer: mark moves **noexcept**;**Templates** are instantiated at compile time per type, they generate code and are not runtime polymorphism","Cycles of shared_ptr: reference counts never reach zero and the memory leaks.","When do you use each smart pointer, and what does move semantics buy you?"],
["Revise **RAII, virtual functions, smart pointers, move and templates**;Solve this week's challenge problems under a **timer** and say the complexity aloud;Redo your **starred** problems cold","Only reading solutions: you must write them without help to learn.","Timed coding in C++: write clean code and explain trade-offs while you type."],
["**vector** is contiguous with amortised O(1) push_back and reallocation **invalidates iterators**, **list** uses nodes, **map** is a balanced tree O(log n), **unordered_map** is a hash table with average O(1);Prefer **algorithms** (sort, find_if, lower_bound, accumulate) over hand-written loops;**reserve()** avoids repeated reallocations when the size is known","Erasing while iterating and then using the invalidated iterator: use the iterator returned by erase.","Choose a container for a problem and justify the complexity."],
["A **lambda** is an unnamed function object: capture by **value** or by **reference**;Use **static_cast** for well-defined conversions, **reinterpret_cast** only for raw reinterpretation, and avoid C-style casts;A **reference** is an alias that must be bound at creation, and **const reference** avoids copies for read-only parameters","Capturing locals by reference in a lambda that runs after the function returns: dangling references.","Write a callback with std::function and explain capture lifetime."],
["Stages are **preprocess, compile, assemble, link**: the linker resolves symbols between object files and libraries;A **static library** is copied into the executable and a **shared library** is loaded at run time by the dynamic loader;**Undefined reference** means a symbol is used but never defined, or a library is missing or in the wrong order","Defining a function in a header without static or inline: multiple definition errors at link time.","What does the linker do? Static versus dynamic linking? Why is extern C needed?"],
["In GDB use **break, run, bt, frame, print and watch** to find where and why it crashed;**Sanitizers** (ASan, UBSan, TSan) catch memory, undefined-behaviour and race bugs at run time: build with **-g**;A **core dump** plus the matching binary lets you debug a crash after the fact","Debugging an optimised build without symbols: variables are optimised out. Start with -g and -O0.","How would you debug a segfault, a hang or memory corruption?"],
["**Undefined behaviour** (signed overflow, out-of-bounds, null dereference, unsequenced writes) lets the compiler assume it never happens;Mixing **signed and unsigned** triggers conversions that surprise you: turn on -Wall -Wextra -Wsign-compare;**Strict aliasing**: accessing an object through an incompatible type is undefined, use memcpy instead","Testing in Debug only: the optimiser in Release exposes undefined behaviour that Debug hides.","Spot the undefined behaviour in this snippet and explain why it might work on your machine."],
["Embedded code avoids **malloc** and **recursion**: fixed pools and bounded stack give predictable memory and timing;Registers are accessed through **volatile pointers**, and masks and shifts change fields without disturbing others;Follow a standard (**MISRA** or Barr): fixed-width types, no magic numbers, defensive checks","Read-modify-write on a register that an ISR also writes: an update can be lost, so protect it.","Write a ring buffer, a memory pool, or set a bit field in a register."],
["Phase 1 recap: **C memory model**, **C++ RAII, virtual and smart pointers**, **toolchain and debugging**, **embedded idioms**;Teach each topic **aloud for 2 minutes** without notes;Update the **Review later list** and plan fixes for weak spots","Skipping the oral practice: you can read well and still freeze when speaking.","Mixed C and C++ rounds: explain a concept, then write code for it."],
["User code cannot touch hardware: it asks the kernel through a **system call**, a controlled switch into **kernel mode**;**Interrupts** come from hardware, **exceptions** from the running instruction, **traps** are deliberate (syscalls, breakpoints);Syscalls cost more than function calls: batch I/O and use **buffers**","Treating one-byte reads and writes as free: each call crosses into the kernel.","What happens when you call read()? How does a system call work?"],
["**fork** clones the process with **copy-on-write** memory, **exec** replaces the program image, **wait** reaps the child;A **zombie** is a finished child that was not waited for and an **orphan** is adopted by init;File descriptors are inherited across fork, so pipes need the **unused ends closed**","Forgetting to close unused pipe ends: the reader never sees EOF and hangs.","Explain fork and exec, zombie versus orphan, and how a shell implements pipes."],
["Threads share **address space, heap and file descriptors** but have their own **stack and registers**;A **context switch** saves registers and switches stacks, and switching processes also changes the address space (TLB cost);Linux pthreads are **1:1** kernel threads scheduled across cores","Assuming thread creation is free: thousands of threads waste memory and scheduler time, so use a pool.","Process versus thread, what is saved in a context switch, user versus kernel threads."],
["**Round Robin** gives fairness with a time slice, **SJF** minimises average wait but needs burst estimates, and **priority** scheduling can **starve** low-priority tasks (fix: aging);Linux **CFS** runs the task with the smallest virtual runtime and real-time classes (**SCHED_FIFO and RR**) preempt normal tasks;**Priority inversion** is fixed with priority inheritance","A long Round Robin quantum: it degenerates into FCFS and hurts responsiveness.","Compare the algorithms, compute waiting time, explain priority inversion."],
["A **race condition** happens when correctness depends on timing: protect shared data with a **mutex** or **atomic**;**Mutex** is an ownership lock, **semaphore** is a counter for signalling or resources, **spinlock** busy-waits for very short holds;Keep **critical sections short** and unlock on every path (use RAII)","Locking some accesses but not all: one unprotected access is still a data race.","Mutex versus semaphore, implement producer-consumer, find the race in this code."],
["Deadlock needs four things: **mutual exclusion, hold and wait, no preemption, circular wait**;Prevent it with a global **lock order**, taking all locks at once (scoped_lock), or **timeouts and try_lock**;**Livelock** (threads keep reacting) and **starvation** (never scheduled) are different failures","Locking A then B in one function and B then A in another.","Explain the four conditions and fix this two-lock deadlock."],
["OS recap: **processes, threads, scheduling, synchronisation, deadlock**;Explain **fork** and a **context switch** aloud from memory;Re-implement the deadlock demo and its fix without notes","Studying only definitions: the interview asks you to apply them to code.","A 40-minute OS round: concepts first, then a small coding or design question."],
["The **MMU** translates virtual to physical addresses using **page tables**, and the **TLB** caches recent translations;A **page fault** is not always an error: demand paging loads the page on first touch and then retries the instruction;Virtual memory gives **isolation, protection** and a flexible layout, plus copy-on-write and mmap","Assuming malloc'd memory is physically allocated at once: pages appear on first touch.","Explain address translation and what happens on a page fault."],
["**LRU** approximates optimal, **FIFO** can show **Belady's anomaly** (more frames, more faults), and **Clock** is a cheap LRU approximation;**Thrashing** is constant swapping because working sets exceed RAM;**mmap** maps files or anonymous memory into the address space and the kernel pages it in on demand","Ignoring the working set: adding more processes can make the whole system slower.","Simulate page replacement for a reference string and count the faults."],
["**First-fit and best-fit** free lists with **splitting and coalescing** reduce waste, and **buddy** and **slab** allocators serve the kernel;**Internal fragmentation** wastes space inside blocks, **external** leaves unusable gaps between them;Fixed-size **pools** give O(1) allocation and no fragmentation","Never coalescing neighbouring free blocks: the heap fragments until large allocations fail.","How does malloc work? Design a simple allocator. Explain fragmentation."],
["Chain tools with **pipes**: **grep** filters, **awk** extracts columns, **sort | uniq -c** counts, **sed** edits;Find problems fast with **ps, top, lsof, ss, strace and perf**;**chmod and chown** with the permission bits (rwx for user, group, other) control access","Using uniq without sort: uniq only collapses adjacent duplicates.","Top 10 IPs in a log, find the process on port 8080, why is the disk full?"],
["**SIGINT and SIGTERM** can be caught for graceful shutdown, **SIGKILL and SIGSTOP** cannot;In a handler only set a **flag** (volatile sig_atomic_t) or call **async-signal-safe** functions;**/proc** exposes process and system info: /proc/PID/status, maps, fd and /proc/meminfo","Calling printf or malloc inside a signal handler: it can deadlock.","How do you shut a service down cleanly? Which signals cannot be caught?"],
["A **file descriptor** is a small integer index into the process's open-file table, and 0, 1, 2 are stdin, stdout, stderr;**dup2** redirects descriptors, **pipe** creates a one-way channel, and **open, read, write, close** are the core calls;An **inode** stores metadata, names map to inodes, a **hard link** is another name and a **symlink** is a path","Leaking file descriptors in a long-running server: it eventually fails with too many open files.","Explain descriptors and redirection, how a shell runs ls | wc, hard versus soft link."],
["Combine **file I/O, parsing and a hash map** in one project: a log analyzer in C;Take a **40-minute** OS and Linux test without notes;Update the **Review later list** with every miss","Writing the parser without tests: malformed lines break it in the demo.","Build a small tool end to end and explain the design."],
["**Pipes and FIFOs** stream bytes, **message queues** keep message boundaries, **shared memory** is fastest but needs **synchronisation**, **sockets** work across machines;Choose by **speed, data shape and whether processes are related**;Always **clean up** IPC objects with unlink","Using shared memory without a lock or semaphore: readers see half-written data.","Which IPC would you choose and why? How do two processes share memory safely?"],
["POSIX **shm_open plus mmap** creates shared memory and **named semaphores** (sem_open) coordinate processes;A semaphore's **wait and post** protect the critical section or signal availability;Set sizes with **ftruncate** and remove objects with **shm_unlink and sem_unlink**","Forgetting shm_unlink: the object persists after the program exits.","Producer-consumer across two processes."],
["Caches move **cache lines (64 bytes)**: sequential access uses **spatial locality**, reuse uses **temporal locality**;**False sharing**: two threads write different variables on one cache line and fight over it, so pad to 64 bytes;Row-major traversal of a C matrix is much faster than column-major","Optimising without measuring: use perf or timers before changing anything.","Why is this loop slow? What is false sharing? How does the cache affect data structure choice?"],
["At reset the CPU loads **SP** and the **reset vector** from the vector table, runs the reset handler and calls main();On an interrupt the hardware pushes **R0-R3, R12, LR, PC and xPSR**, and the **NVIC** manages priorities;The **Thumb bit** (lowest bit 1) in vector addresses is required on Cortex-M","Wrong handler name: the interrupt falls into the default infinite-loop handler.","What happens at reset, what is stacked on an exception, how do you debug a HardFault?"],
["Keep an **ISR short**: no blocking, no malloc, clear the source, defer heavy work;Share data with **volatile flags**, **ring buffers** or short **critical sections**;**Latency** is the time from event to the first ISR instruction, and critical sections and higher priorities add to it","printf or long loops in an ISR: it blocks other interrupts and breaks timing.","ISR design rules, how to pass data from an ISR to main, what is nesting?"],
["Compilers and CPUs **reorder** memory accesses: **atomics** with **acquire and release** ordering restore the order you need;**volatile is not synchronisation**: use std::atomic or a lock;A **spinlock** uses an atomic flag and busy-waits, fine for very short critical sections","Relaxed ordering to publish data: the reader may see the flag before the data.","What is a memory barrier? volatile versus atomic? Write a spinlock."],
["Kernel phase recap: **virtual memory, scheduling, IPC, caches, interrupts**;Do a **60-minute mock**: two coding problems and OS questions;Explain **virtual memory** aloud in 2 minutes","Skipping the weak topics because they are uncomfortable.","A systems round mixes coding with OS concepts: be ready for both."],
["TCP/IP layers are **link, internet, transport, application** and each layer **encapsulates** the one above with its own header;**Ethernet frames** use MAC addresses: a **switch** learns MACs, a **router** forwards by IP, and **ARP** maps IP to MAC;**MTU** (1500) limits frame payload and **MSS** limits TCP payload","Mixing up layers: a switch is layer 2, a router layer 3 and TCP layer 4.","OSI versus TCP/IP, what happens when you type a URL, what is ARP?"],
["**CIDR /n** has n network bits: hosts = 2^(32-n) - 2, and the **mask** and **broadcast** follow from n;**NAT** rewrites private to public addresses and ports, **DHCP** hands out addresses (DORA), **DNS** resolves names;**ICMP** carries errors and ping and **TTL** prevents loops","Forgetting to subtract the network and broadcast addresses when counting usable hosts.","Subnet this address by hand, explain a DNS lookup and DHCP."],
["**TCP** gives reliable ordered delivery: **handshake, sequence numbers, ACKs, retransmission, flow control, congestion control**;**UDP** is connectionless and cheap: good for real-time, DNS and telemetry;**TIME_WAIT** protects against stray packets after close","Assuming one send equals one recv: TCP is a byte stream with no message boundaries.","TCP versus UDP, the three-way handshake, how congestion control works."],
["Server: **socket, bind, listen, accept**. Client: **socket, connect**. Both then **read, write** and **close**;Use **htons and htonl** for network byte order;Always **loop** on send and recv and define **message framing** (length prefix or delimiter)","Ignoring partial reads and writes: data gets truncated or merged.","Write a TCP echo server and explain what accept returns."],
["**select and poll** scan all descriptors while **epoll** returns only ready ones, scaling to thousands of connections;Use **non-blocking** sockets with an **event loop**: edge-triggered mode needs reading until EAGAIN;CPU-heavy work belongs in a **thread pool**, not the loop","A blocking call inside the event loop freezes every client.","How would you handle 10,000 connections? select versus epoll."],
["**HTTP** is request and response, and **TLS** adds encryption, integrity and authentication through certificates;**MQTT** is lightweight publish and subscribe with QoS 0, 1 and 2, and **CoAP** is UDP-based for constrained devices;**lwIP** is a small TCP/IP stack for microcontrollers","QoS 2 everywhere: it costs extra round trips and energy.","MQTT versus HTTP for IoT, explain the TLS handshake."],
["Networking recap: **layers, IP, TCP and UDP, sockets, epoll**;Whiteboard the **TCP handshake** and a **server socket flow**;Build the **HTTP/1.0 server** end to end","Learning protocols only from diagrams: build one to find the real problems.","Draw the packet flow for a request and name every layer involved."],
["Create threads with **pthread_create** and wait with **pthread_join**: threads share the heap and globals;**Thread-safe** means correct under concurrent calls and **reentrant** means no hidden shared state;A **data race** is an unsynchronised access with at least one write: undefined behaviour","Passing the address of a loop variable to a new thread: it changes before the thread reads it.","Race condition versus data race, why is counter++ unsafe?"],
["Lock **short sections**, pair lock and unlock (use RAII), and use a fixed **lock order** for several locks;**Reader-writer locks** allow many readers and one writer but can starve either side;**Contention** serialises threads: shard data or use per-thread state","Holding a lock while doing I/O or calling unknown code.","Thread-safe bank transfer: how do you avoid deadlock?"],
["Wait on a **condition variable** with a mutex **in a while loop** that rechecks the predicate (spurious wakeups);Change the predicate **under the mutex** and then notify;A **bounded buffer** needs not_full and not_empty plus a closed flag for shutdown","Using if instead of while around wait: spurious wakeups break the logic.","Implement a blocking queue with a mutex and condition variables."],
["A **counting semaphore** allows N concurrent users and a **binary** one signals;**Dining philosophers** is solved by ordering resources or limiting diners, and **readers-writers** needs a fairness policy;**Starvation** means some thread never makes progress even though the system does","Every philosopher picking up the left fork first: instant deadlock.","Solve dining philosophers and explain starvation."],
["**std::atomic** gives indivisible operations and **acquire and release** order data publication;**CAS** (compare-and-swap) retries until it wins and the **ABA problem** needs version tags;An **SPSC ring buffer** can be lock-free with one atomic head and one atomic tail","Assuming lock-free is always faster: contention and cache bouncing can make it slower than a mutex.","An acquire and release example, what is ABA, build an SPSC queue."],
["A **thread pool** reuses workers and a task queue: size it near the **core count** for CPU-bound work;**future, promise and packaged_task** return results and exceptions from tasks;Shutdown means **stop flag, notify all, join**","Submitting tasks after shutdown or forgetting to join: hangs or crashes at exit.","Implement a thread pool with submit() returning a future."],
["Concurrency recap: **mutex, condition variable, atomics, thread pool**;Live-code a **bounded queue in 30 minutes**;Run your code under **ThreadSanitizer**","Trusting a test that passes once: concurrency bugs need many runs and tools.","Write thread-safe code on the spot and explain every lock."],
["An **MCU** integrates CPU, flash, RAM and peripherals while an **MPU** needs external memory;The **memory map** places flash, SRAM and peripheral registers at fixed addresses;**Clocks and reset sources** decide how the chip starts and how fast it runs","Forgetting to enable a peripheral's clock: its registers read zero and writes do nothing.","MCU versus MPU, Harvard versus von Neumann, describe the boot flow."],
["Timer frequency is **clock / ((PSC+1) x (ARR+1))** and PWM duty is **CCR / (ARR+1)**;An **ADC** converts voltage to counts: Vin = counts x Vref / (2^N - 1);**Debounce** switches by sampling on a timer tick and requiring a stable state","Blocking delays for timing: the rest of the firmware stops.","Compute prescaler and ARR for a frequency, ADC counts to millivolts, debounce logic."],
["**UART** sends asynchronous frames (start, 8 data bits, parity, stop) at an agreed **baud rate**;**I2C** is a two-wire addressed bus with **open-drain** lines that need **pull-ups**, and slaves may **clock-stretch**;A stuck bus is recovered by **toggling SCL** and sending STOP","Wrong baud rate or missing pull-ups: garbage characters or no ACK.","UART versus SPI versus I2C, why pull-ups, what is clock stretching?"],
["**SPI** is fast and full duplex with a chip select per slave, and its **modes** are CPOL and CPHA;**CAN** is differential and multi-master with **bitwise arbitration** (lowest ID wins) and strong error detection;Choose the bus by **speed, wires, distance, noise and device count**","Mismatched SPI mode between master and slave: reads shift by a bit.","How does CAN arbitration work? Compare the four buses."],
["**DMA** moves data without the CPU: with caches you must **clean and invalidate**;The **linker script** places sections in flash and RAM: **.data** is copied from flash at startup and **.bss** is zeroed;The **vector table** and startup code run before main()","DMA buffers in cached memory: the CPU reads stale data.","What happens before main()? VMA versus LMA? DMA and caches?"],
["A **watchdog** resets the chip unless firmware kicks it: kick only when all critical tasks proved they are alive;Detect **stack overflow** with patterns, canaries or MPU guards;Save power with **sleep modes**, low clocks, gated peripherals and interrupt-driven design","Kicking the watchdog from a timer ISR: it keeps resetting the dog even when the main code is hung.","How do you use a watchdog, design for low power, detect stack overflow?"],
["Embedded recap: **buses, timers, interrupts, DMA, watchdog**;Explain a **HardFault debug flow** aloud;Build the **UART driver with a ring buffer**","Memorising registers instead of understanding the mechanism behind them.","Embedded round: explain, then write the driver code."],
["An embedded Linux system is **toolchain, bootloader, kernel, root filesystem and applications**;**Buildroot** is simple and fast while **Yocto** is layered and scalable;**QEMU** lets you run and debug target images on your PC","Compiling with the host compiler instead of the cross compiler: the binary will not run on the target.","Components of an embedded Linux system, Yocto versus Buildroot."],
["Boot flow: **ROM, then SPL or U-Boot, then kernel plus DTB (plus initramfs), then init**;The **device tree** describes hardware (addresses, IRQs, clocks) and drivers bind by the **compatible** string;**bootargs** pass the kernel command line","Wrong compatible string or missing node status: the driver never probes.","Describe the Linux boot sequence, what a device tree is and how a driver is matched."],
["A module has **module_init and module_exit**, loads with **insmod**, logs with **printk** and unloads with **rmmod**;Kernel code has **no libc**, small stacks and no floating point: use kernel APIs (kmalloc, mutex);**Module parameters** are configured at load time","Leaking resources in module_exit: the kernel keeps them until reboot.","How does a kernel module differ from a normal program?"],
["A char driver registers **file_operations** (open, read, write, ioctl) and a **device number**;Cross the boundary only with **copy_to_user and copy_from_user**;Protect shared driver state with a **mutex** or spinlock","Dereferencing a user pointer directly in the kernel: security hole and possible oops.","How does a char driver exchange data with user space?"],
["**request_irq** registers a handler: keep the top half short and defer the work;**Tasklets** cannot sleep, **workqueues** run in process context and can sleep, **threaded IRQs** run in a kernel thread;Use **spinlocks** in atomic context and **mutexes** where sleeping is allowed","Sleeping (mutex, kmalloc with GFP_KERNEL) in interrupt context: kernel BUG.","Top half versus bottom half, spinlock versus mutex in the kernel."],
["An RTOS offers **priority-based preemptive scheduling**, queues, semaphores, mutexes and timers with bounded latency;**Priority inheritance** prevents priority inversion and ISRs use **FromISR** APIs;**Rate-monotonic**: the shortest period gets the highest priority","A binary semaphore instead of a mutex for mutual exclusion: no priority inheritance.","RTOS versus a general OS, priority inversion, rate-monotonic schedulability."],
["Recap: **boot flow, device tree, drivers, RTOS**;Explain **priority inversion** with an example;Write the **README** for your driver","Treating the driver as done when it works once: test error paths and unload.","Embedded Linux round: boot flow and driver questions with a short design."],
["Start from **requirements and constraints** (timing, memory, power, safety), then draw blocks and interfaces;Layer the firmware: **drivers, HAL, services, application**, with hardware access behind interfaces;Model behaviour with **state machines** and events","Jumping to code before agreeing on requirements and failure behaviour.","Design a parking sensor or thermostat: always state assumptions first."],
["Pipeline: **sensor, ADC, filter, threshold with hysteresis, alarm, log or transmit**;Filter noise with **averaging or exponential filters** and detect **stuck or out-of-range** sensors;Plan **power, storage and connectivity** trade-offs","Alarming on a single raw sample: noise causes false alarms, so add filtering and hysteresis.","Draw the block diagram, justify the sampling rate and the filter."],
["ECUs share data over **CAN**: signals are decoded with **scale and offset** and range-checked;Use **fault codes (DTCs)** with timestamps and freeze-frame data;Safety needs **redundancy, deadlines and a safe state**","Missing message timeouts: a dead sensor looks like a stable value.","How do you detect a failed ECU? How do you log faults?"],
["Use an **ISR-safe ring buffer** and a low-priority task that drains to storage;Flash needs **wear levelling** and **power-fail safe** writes: sequence number, CRC and a commit marker;Log **compact ids and timestamps**, not long strings","Writing logs in the ISR path or overwriting in place: timing jitter and corrupted logs.","Design a crash-safe logger and say what happens when the buffer is full."],
["**A/B slots** let you install to the inactive image and **roll back** if it fails to confirm;The bootloader verifies **size, hash and signature** before booting and protects its keys;Handle **power loss, resume and anti-rollback**","Overwriting the only working image: a failed update bricks the device.","Design a safe OTA flow. What if power fails mid-update?"],
["Layers of defence: **watchdog, heartbeats, safe states, retries with backoff**;**Fault injection** proves the recovery paths actually work;Track **latency, jitter and MTBF** as metrics","Recovery code that is never tested: it fails exactly when you need it.","How do you make a device recover from a hang or a corrupted config?"],
["Design recap: **requirements, block diagram, data flow, failure modes**;Whiteboard one design in **40 minutes**;Practise **trade-offs**: why this choice and what breaks","Presenting one solution without alternatives or trade-offs.","A design round: clarify, sketch, go deep on one part, discuss failures."],
["**Observer** decouples producers and subscribers, **Strategy** swaps algorithms, **State** models modes, **Factory** hides construction;**Dependency inversion**: depend on interfaces so hardware can be mocked in tests;Prefer **composition over inheritance**","Over-engineering with patterns for a small problem: choose the simplest design that meets the requirements.","Design a parking lot or elevator in C++ with classes and interfaces."],
["**STAR**: Situation, Task, Action, Result (with a number);Prepare **six stories**: bug, owned project, conflict, failure, deadline, fast learning;Keep answers **90 seconds to 2 minutes**","Saying we for everything: interviewers need to know what you personally did.","Tell me about yourself, a conflict, a failure, your proudest project."],
["Pipeline: **generator, collector, parser, ring buffer, writer or aggregator**;Define **interfaces and tests** first so modules can be built independently;Write the **README skeleton** now: problem, architecture, build, run","Starting to code without clear module boundaries: threads and data ownership get tangled.","Why this design? Where is the bottleneck?"],
["A generator needs a **configurable rate** and realistic levels and timestamps;The collector must handle **backpressure**: block, drop with a counter, or buffer;Measure **lines per second** and record it","Dropping data silently under load: always count and report drops.","How does your system behave when the consumer is slower than the producer?"],
["Parse with a **state machine** so partial lines and malformed input are handled;A **thread-safe ring buffer** connects producers and workers (mutex plus condition variables);Workers aggregate stats and results are merged in a **final reduce** step","One shared map behind one big lock: workers serialise, so use per-thread maps.","Why per-thread aggregation? How do you shut down cleanly?"],
["Cover **unit, integration and stress** tests and run **ASan, UBSan and TSan**;Benchmark and record **results with numbers**;A good **README** has an architecture diagram, build steps and example output","Demos without tests: one crash on stage ruins the story.","How did you test the concurrency? What was the hardest bug?"],
["Run a **timed mock**: two coding problems in 60 minutes;Think aloud: **approach, complexity, edge cases, tests**;Write a **post-mortem** with concrete fixes","Practising only in your head: record yourself to see the real gaps.","A full coding round with an interviewer who watches how you think."],
["Bullets follow **Built X using Y, achieving Z** (with a number);Target **15 companies** across tiers and track them in a table;**Referrals** beat cold applications","Listing duties instead of results: numbers make bullets credible.","Walk me through your resume: the interviewer picks what to probe."],
["Two timed rounds: **explain before coding**;State **time and space complexity** for every solution;Test with **edge cases** you invent","Coding in silence: the interviewer cannot give credit for ideas they never hear.","Medium and Hard coding problems under time pressure."],
["Rapid-fire: answer in **60 to 90 seconds**, structured as definition, example, pitfall;**Explain aloud** fork, virtual memory, mutex versus semaphore;Re-study every **Missed** answer","Giving long unstructured answers: lead with the definition, then one example.","A fundamentals round: many short questions across C, C++, OS and Linux."],
["Embedded round: **buses, interrupts, drivers, RTOS, debugging**;Design round: **clarify, block diagram, data flow, failure modes, trade-offs**;Behavioural: use **STAR** with numbers","Skipping failure modes in a design answer.","Embedded and design rounds usually build on a project from your resume."],
["Review the **Review later list** and every question still marked Learning;Make **one-page cheat sheets** for four areas;Light day: **sleep well**","Cramming new topics the day before: review instead.","Interviewers value clarity under pressure more than last-minute facts."],
["Full loop: **coding, fundamentals, embedded, design, behavioural**;Score yourself with a **rubric** and evidence;Plan the next **30 days**: DSA daily, one mock a week, apply every week","Stopping at Day 90: interviews and mock practice must continue.","The real loop is several rounds back to back: stamina matters."]
];
// Weekend projects: one per week. steps = [title, how-to detail]; ok / more are ;-separated lists.
const WL=[
{w:1,n:"Hexdump tool and bit toolkit",t:"C, 4-5 h",goal:"Build hd, a hexdump command-line tool, plus a reusable bits.h library. You finish with a tested C project that touches pointers, arrays, bit operations, structs and endianness.",
why:"Week 1 is memory layout, pointers and bit manipulation. A hexdump forces you to treat memory as raw bytes, and the bit library is the code you would write for hardware registers.",
steps:[["Set up the project","Create hd/ with hd.c, bits.h, test_bits.c and a Makefile. Compile everything with gcc -Wall -Wextra -g -fsanitize=address,undefined so mistakes are caught immediately."],
["Write bits.h","Add SET_BIT, CLEAR_BIT, TOGGLE_BIT, TEST_BIT, extract_field(x, pos, width), popcount (Kernighan), reverse_bits and bswap32 as macros or static inline functions. Use unsigned types everywhere."],
["Test every bit helper","In test_bits.c use assert() with known answers, for example reverse_bits(1) == 0x80000000 and bswap32(0x11223344) == 0x44332211. Include edge cases: 0, all ones, bit 31."],
["Detect endianness two ways","Write is_little_endian() once with a char pointer to a uint32_t and once with a union. Print both and confirm they agree."],
["Read a file in 16-byte rows","Use fopen and fread into an unsigned char buffer[16]. Loop until fread returns 0, and handle a short last row correctly."],
["Format each row","Print the offset as %08zx, the hex bytes in two groups of 8, then an ASCII column where non-printable bytes show as a dot. Pad the last short row so columns stay aligned."],
["Add options and compare with the real tool","Support -n LENGTH and -s OFFSET (parse argv by hand, then try getopt). Compare your output with hexdump -C on a text file, a binary file and an empty file, and fix every difference."]],
ok:"Output matches hexdump -C on three test files;ASan and UBSan report nothing;All bit tests pass;An empty file and a missing file are handled without crashing",
more:"Add a --bits mode that prints each byte in binary;Print a struct with padding using offsetof and see the gaps;Add a -c COLUMNS option",
say:"I wrote a hexdump tool and a bit-manipulation library in C. I handled endianness explicitly, tested every helper with asserts, and ran it under ASan and UBSan.",
res:[["fread man page","https://man7.org/linux/man-pages/man3/fread.3.html"],["Bit Twiddling Hacks","https://graphics.stanford.edu/~seander/bithacks.html"],["Beej's Guide to C","https://beej.us/guide/bgc/"]]},

{w:2,n:"Generic vector in C and String class in C++",t:"C and C++, 5 h",goal:"Implement a growable generic vector in C and a String class in C++ that follows the rule of five. Prove both are leak-free.",
why:"Week 2 is dynamic memory and C++ OOP. The C vector teaches ownership and realloc; the C++ String shows what constructors, destructors and move semantics actually do.",
steps:[["Design the C vector API","struct vec { void *data; size_t len, cap, elem; }. Functions: vec_init(v, elem_size), vec_push(v, &item), vec_get(v, i), vec_pop(v), vec_reserve(v, n), vec_free(v)."],
["Implement push with doubling growth","When len == cap, double cap (start at 4). Call realloc into a temporary pointer, check for NULL, then assign. Use memcpy with elem size to store items."],
["Test it hard","Push 1,000,000 ints, then a struct type, then pop everything. Check vec_get bounds. Make vec_free set data to NULL so a second free is harmless."],
["Catch a leak on purpose","Comment out vec_free in one test, run under ASan and under valgrind --leak-check=full, and read both reports. Restore the free."],
["Write the C++ String","Members: char *data_, size_t len_. Implement constructor from const char*, destructor, copy constructor, copy assignment (copy-and-swap), move constructor, move assignment, operator[], operator+=, c_str()."],
["Watch the special members run","Print a line inside each special member. In main, pass a String by value, return one from a function and use std::move. Predict what prints before running."],
["Refactor to rule of zero","Replace the raw pointer with std::unique_ptr<char[]> and delete what you no longer need. Note which special members the compiler now writes for you."]],
ok:"No leaks in ASan or Valgrind;1,000,000 pushes work and cost amortised O(1);You can explain each line printed by the special members;Self-assignment of String is safe",
more:"Add small-string optimisation to String;Add iterators and a range-for loop;Benchmark push_back against std::vector and std::string",
say:"I built a generic vector in C with amortised O(1) push and a C++ String that implements the rule of five. I verified both with ASan and Valgrind.",
res:[["learncpp: move semantics","https://www.learncpp.com/cpp-tutorial/introduction-to-smart-pointers-move-semantics/"],["realloc man page","https://man7.org/linux/man-pages/man3/malloc.3.html"],["Valgrind quick start","https://valgrind.org/docs/manual/quick-start.html"]]},

{w:3,n:"Bug hunt: build system and debugging lab",t:"C, GDB, Make, CMake, 4-5 h",goal:"Build a small library with Make and CMake, then diagnose eight deliberately seeded bugs with GDB, sanitizers and Valgrind. You produce your own debugging cheat sheet.",
why:"Week 3 is the toolchain and debugging. Interviewers love asking how you find a crash. After this lab you will have done it for real, for every common bug class.",
steps:[["Create the project layout","src/, include/, tests/. Write mathlib.c and mathlib.h with a few functions, plus a demo main that calls them."],
["Write a Makefile","Build libmath.a (ar rcs) and libmath.so (-fPIC -shared), then link the demo against each. Run the shared version with LD_LIBRARY_PATH and read ldd output."],
["Port it to CMake","add_library(math STATIC ...), add_executable(demo ...), target_link_libraries. Build out of source in build/."],
["Seed eight bugs in bugs.c","One function each: NULL dereference, stack buffer overflow, heap overflow, use-after-free, double free, uninitialised read, signed integer overflow, memory leak. Select the bug with argv[1]."],
["Diagnose each bug with three tools","Run it plain, then in gdb (run, bt, frame, print, watch), then with ASan, UBSan and Valgrind. Write one line per bug: which tool found it fastest and why."],
["Debug a core dump","ulimit -c unlimited, trigger a crash, then gdb ./bugs core and use bt. Also inspect a binary with nm, objdump -d and readelf -S."],
["Write DEBUG.md","A one-page cheat sheet: ten GDB commands, ten sanitizer and Valgrind flags, and a flowchart for 'my program crashed, what now?'."]],
ok:"Both library builds work with Make and CMake;Every seeded bug is found by at least one tool and explained;You can open a core dump and print a backtrace;DEBUG.md exists",
more:"Add Unity or CMocka unit tests to the project;Add a GitHub Actions workflow that builds with sanitizers;Add -Wall -Wextra -Werror and fix every warning",
say:"I can debug crashes with GDB, core dumps, ASan, UBSan and Valgrind, and I know which tool catches which bug class.",
res:[["Makefile tutorial","https://makefiletutorial.com/"],["CMake tutorial","https://cmake.org/cmake/help/latest/guide/tutorial/index.html"],["GDB tutorial (CMU)","https://www.cs.cmu.edu/~gilpin/tutorial/"]]},

{w:4,n:"Job runner and CPU scheduler simulator",t:"C, 5 h",goal:"Part A: a program that forks, execs and reaps child processes. Part B: a simulator that runs FCFS, SJF, Round Robin and Priority scheduling and prints Gantt charts and metrics.",
why:"Week 4 is processes, threads and scheduling. Part A makes fork, exec and wait concrete; Part B lets you see convoy effect and starvation with numbers.",
steps:[["Part A: fork three children","Fork three children. Each execs a different command (sleep 1, echo hi, ls /nonexistent). The parent waitpid()s each one and prints pid and exit status using WIFEXITED, WEXITSTATUS and WIFSIGNALED."],
["Create a zombie on purpose","Skip waitpid for one child, sleep 30, and look at it in ps aux with state Z. Then fix it by reaping."],
["Part B: define the input","A text file with lines pid arrival burst priority. Parse into an array of structs."],
["Implement FCFS and SJF","FCFS sorts by arrival. Non-preemptive SJF picks the shortest ready job. Track start time, finish time and compute waiting, turnaround and response time per process."],
["Implement Round Robin","Use a queue and a quantum argument. Be careful about processes that arrive during a time slice."],
["Implement preemptive Priority","Lower number means higher priority. Re-evaluate every time unit. Add optional aging: every 5 units waiting, boost priority by 1."],
["Print Gantt charts and compare","Draw a text Gantt chart like |P1|P1|P2|P3|. Print average waiting and turnaround for each algorithm. Make a workload that shows the convoy effect and one that starves a low-priority process."]],
ok:"Your results match a hand-worked textbook example;Zombie appears and disappears as expected;Aging fixes the starvation workload;You can explain convoy effect aloud",
more:"Add Multi-Level Feedback Queue;Add a context-switch cost parameter;Compare your output with the real Linux CFS behaviour using nice values",
say:"I simulated FCFS, SJF, Round Robin and priority scheduling with aging, measured waiting and turnaround times, and showed the convoy effect and starvation.",
res:[["fork man page","https://man7.org/linux/man-pages/man2/fork.2.html"],["sched(7)","https://man7.org/linux/man-pages/man7/sched.7.html"],["OSTEP scheduling chapters","https://pages.cs.wisc.edu/~remzi/OSTEP/"]]},

{w:5,n:"Mini top: a /proc process monitor",t:"C, 4-5 h",goal:"Write a small top clone that reads /proc, shows the busiest processes by CPU and memory, and can show a memory map summary for one process.",
why:"Week 5 is virtual memory and Linux tools. /proc is how the kernel exposes processes and memory, so parsing it teaches you what those numbers really mean.",
steps:[["Explore /proc by hand","Run cat /proc/self/status, /proc/self/stat, /proc/self/maps, /proc/meminfo. Read man 5 proc for the fields. Write down what each line means."],
["List processes","Use opendir and readdir on /proc and keep entries whose names are all digits."],
["Parse /proc/PID/stat carefully","The command name is in parentheses and may contain spaces, so find the last ')' and parse fields after it. Extract state, utime, stime and rss."],
["Compute CPU percentage","Sample total ticks (utime + stime) twice, one second apart. CPU% = (delta ticks / sysconf(_SC_CLK_TCK)) / delta seconds * 100."],
["Sort and display","Collect into an array of structs, qsort by CPU or by RSS, and print the top 15 as a table. Redraw every second with the ANSI clear-screen sequence."],
["Add a memory map view","With --maps PID, parse /proc/PID/maps and sum sizes of heap, stack, anonymous mappings and shared libraries. Print the result in KB."],
["Handle races and errors","Processes vanish between readdir and fopen. Skip them silently. Never trust a field to exist."]],
ok:"Top 5 processes match what top shows (roughly);No crashes when processes exit mid-scan;--maps totals look plausible for a known process;ASan clean",
more:"Add a keystroke to kill a PID with a chosen signal;Show per-thread rows from /proc/PID/task;Filter by user",
say:"I wrote a process monitor from /proc: I parsed stat fields, computed CPU% from tick deltas, and summarised memory maps, so I understand RSS, VSZ and mappings.",
res:[["proc(5) man page","https://man7.org/linux/man-pages/man5/proc.5.html"],["The Missing Semester","https://missing.csail.mit.edu/"],["Linux kernel docs: proc","https://docs.kernel.org/filesystems/proc.html"]]},

{w:6,n:"IPC shootout and false-sharing benchmark",t:"C, 5 h",goal:"Measure round-trip latency of pipes, POSIX message queues, shared memory with semaphores and Unix sockets. Then show false sharing with a benchmark and fix it.",
why:"Week 6 is IPC and caches. Instead of memorising which IPC is fastest you will measure it, and you will see the cache-line effect with real numbers.",
steps:[["Write the harness","A ping-pong test: parent sends a small message, child echoes it back, repeat 100,000 times. Time with clock_gettime(CLOCK_MONOTONIC). Report average round trip in microseconds."],
["Pipe version","Two pipes (parent to child, child to parent). Remember to close the unused ends in each process."],
["Message queue version","mq_open, mq_send, mq_receive with two queues. Link with -lrt. Remember mq_unlink at the end."],
["Shared memory plus semaphores","shm_open, ftruncate, mmap a struct holding the message, and two semaphores for ping and pong. Clean up with shm_unlink."],
["Unix socket version","socketpair(AF_UNIX, SOCK_STREAM, 0, fds) then fork. Same ping-pong loop."],
["Record and explain the ranking","Put results in a table in RESULTS.md and explain why each mechanism is faster or slower (copies, syscalls, context switches). Pin both processes with taskset -c 0,1 for stable numbers."],
["False sharing experiment","Two threads increment two counters 100 million times each. First counters are adjacent in one struct, then padded with alignas(64). Time both and explain the difference using cache lines."]],
ok:"All four IPC versions work and clean up their IPC objects;Results table with a sensible explanation;Padded counters are measurably faster;Numbers are stable across runs",
more:"Use perf stat to compare cache misses;Replace the counters with C11 atomics and measure;Add a futex-based version",
say:"I benchmarked pipes, message queues, shared memory and sockets and found shared memory fastest because it avoids per-message kernel copies. I also demonstrated false sharing and fixed it with cache-line padding.",
res:[["mq_overview(7)","https://man7.org/linux/man-pages/man7/mq_overview.7.html"],["shm_overview(7)","https://man7.org/linux/man-pages/man7/shm_overview.7.html"],["sem_overview(7)","https://man7.org/linux/man-pages/man7/sem_overview.7.html"],["pipe(7)","https://man7.org/linux/man-pages/man7/pipe.7.html"]]},

{w:7,n:"Tiny HTTP server with epoll",t:"C, 5-6 h",goal:"Build an HTTP/1.0 static file server, first with blocking sockets, then upgrade it to a non-blocking epoll event loop and benchmark both.",
why:"Week 7 is networking. A real server makes TCP, sockets, partial reads and I/O multiplexing unforgettable, and 'how would you build a server that handles 10,000 clients' is a classic question.",
steps:[["Blocking hello server","socket, setsockopt(SO_REUSEADDR), bind, listen, accept in a loop. Reply to every request with a fixed HTTP/1.0 200 response. Test with curl -v http://localhost:8080/."],
["Parse the request","Read until you see the blank line (\\r\\n\\r\\n). Handle partial reads. Extract method, path and version from the first line."],
["Serve static files","Map the path into ./www, set Content-Type from the extension, return 404 for missing files and 400 for bad requests. Reject any path containing .. to block traversal."],
["Thread-per-connection baseline","Spawn a thread per accepted client. Keep this version; you will benchmark it later."],
["Convert to epoll","Make sockets non-blocking. Add the listen fd to epoll, accept in a loop until EAGAIN, and keep a per-connection struct with state, buffer and bytes sent. Handle EPOLLIN and EPOLLOUT."],
["Handle the hard cases","Partial writes, client disconnects (read returns 0), EPOLLHUP and errors. Close fds and free state every time. Check for leaks with Valgrind."],

{w:8,n:"Parallel grep with a thread pool",t:"C or C++, 5 h",goal:"Search a directory tree for a substring using a pool of worker threads fed by a bounded queue, then measure speedup with 1, 2, 4 and 8 threads.",
why:"Week 8 is multithreading. The bounded queue with condition variables is the single most asked concurrency design, and measuring speedup teaches you about Amdahl's law and I/O limits.",
steps:[["Write a single-threaded version","pgrep PATTERN DIR walks the tree and prints file:line:text for every match. Record the time on a large directory. This is your baseline."],
["Design the pipeline","The main thread walks directories and pushes file paths into a bounded queue (producer). N worker threads pop paths and search them (consumers). Output goes through one mutex so lines do not interleave."],
["Build the bounded queue","Array or linked list plus a mutex, two condition variables (not_empty, not_full) and a closed flag. Always wait in a while loop that rechecks the predicate."],
["Write the worker loop","Pop a path; if the queue is closed and empty, exit. Otherwise search the file, collecting matches, then print under the output lock."],
["Shut down cleanly","After the walk, close the queue (set flag and broadcast). Join every worker. Free everything."],
["Benchmark","Run with 1, 2, 4, 8 threads and record wall time. Plot or tabulate the speedup and explain why it flattens (disk I/O, lock contention, core count)."],
["Break it on purpose with ThreadSanitizer","Compile with -fsanitize=thread. First confirm it is clean. Then remove the output lock and read the data race report."]],
ok:"Output is identical to the single-threaded version (sorted);TSan clean;Speedup table with an explanation;Program exits without hanging or leaking threads",
more:"Add a work-stealing deque;Write the C++ version with std::thread and std::condition_variable;Replace the queue with a lock-free SPSC ring buffer for one worker",
say:"I built a parallel search with a bounded producer-consumer queue using mutexes and condition variables, validated it with ThreadSanitizer, and measured speedup against thread count.",
res:[["POSIX threads tutorial","https://hpc-tutorials.llnl.gov/posix/"],["pthreads(7)","https://man7.org/linux/man-pages/man7/pthreads.7.html"],["Preshing on Programming","https://preshing.com/"]]},

{w:9,n:"Wokwi firmware lab: button, PWM, ADC, UART",t:"C/C++ on a simulated board, 4-5 h",goal:"Build a small firmware on the Wokwi simulator: debounced button, potentiometer-controlled PWM LED, a sensor ring buffer, and a serial command parser, all without blocking delay() calls.",
why:"Week 9 covers GPIO, timers, ADC, PWM and UART. This is the closest you can get to real firmware without buying hardware, and it matches common embedded interview exercises.",
steps:[["Create the board","Open wokwi.com, create an Arduino Uno or ESP32 project, and wire an LED with a resistor, a push button and a potentiometer. Save the project."],
["Blink without delay()","Use millis() timestamps so the loop never blocks. Blink at 1 Hz and check it still reacts to other events."],
["Debounce the button","Implement a small state machine: the reading must be stable for 20 ms before the press counts. Detect short press and long press (over 1 s). Count presses on Serial."],
["ADC to PWM","Read the potentiometer, map it to a PWM duty cycle for the LED (analogWrite or ledcWrite) and print the ADC value and duty percentage on Serial."],
["Add a ring buffer","A timer-driven function (the 'ISR') writes a sample into a fixed ring buffer every 100 ms. The main loop drains it and prints timestamped lines. Keep a counter of overflows."],
["Add a command parser","Read Serial lines such as set 50, get, mode auto. Parse with a small state machine or strtok and respond with OK or an error."],
["Write the README","Wiring list, behaviour, a screenshot and the shareable Wokwi link. Explain which parts correspond to timers, interrupts and UART on real hardware."]],
ok:"No delay() calls anywhere in the main loop;One press equals exactly one count, even with simulated bounce;PWM tracks the potentiometer smoothly;The overflow counter increments when you slow the consumer",
more:"Add an I2C sensor (for example a simulated MPU6050 or DHT22);Use a hardware timer interrupt instead of millis();Add a watchdog and simulate a hang",
say:"I wrote non-blocking firmware: a debounce state machine, ADC-to-PWM control, an ISR-fed ring buffer and a UART command parser. I can map each part to real hardware peripherals.",
res:[["Wokwi docs","https://docs.wokwi.com/"],["Arduino reference","https://www.arduino.cc/reference/en/"],["Embedded Artistry","https://embeddedartistry.com/"]]},

{w:10,n:"Mini embedded Linux image in QEMU",t:"Buildroot, QEMU, C, 6 h",goal:"Build a tiny Linux image with Buildroot, boot it in QEMU, run your own application at boot, and load a kernel module you wrote.",
why:"Week 10 is embedded Linux. Building the whole stack (toolchain, kernel, root filesystem, init) once makes every boot-flow and driver question easy to answer.",
steps:[["Get Buildroot and choose a target","Download Buildroot from buildroot.org, then run make qemu_x86_64_defconfig (or qemu_aarch64_virt_defconfig). Install the host packages the manual lists."],
["Customise and build","make menuconfig: set a hostname and enable one extra package. Run make -j$(nproc). The first build takes 30 to 60 minutes. Read the output folder: images/ has the kernel and root filesystem."],
["Boot and explore","Run output/images/start-qemu.sh. Log in as root. Inspect uname -a, dmesg, /proc, /sys and ps. Note the boot messages in order."],
["Add your own application","Write a small C program (for example a heartbeat logger). Add it to the image with a rootfs overlay, or a custom Buildroot package, and start it from an init script such as /etc/init.d/S99myapp."],
["Write and load a kernel module","Create hello.ko (module_init, module_exit, printk) built against the Buildroot kernel headers. Copy it into the image, insmod it, check dmesg, then rmmod."],
["Extend to a char device","Register a character device with file_operations (read and write) and test it with echo and cat from user space. Use copy_to_user and copy_from_user."],
["Document the boot flow","In BOOT.md list the stages with dmesg timestamps: firmware, bootloader, kernel, init, your application. Draw the flow."]],
ok:"The image boots in QEMU and your app starts automatically;insmod and rmmod produce the expected dmesg lines;The char device echo and cat round trip works;BOOT.md matches the real logs",
more:"Add a device tree overlay for a fake peripheral;Compare BusyBox init with systemd;Run FreeRTOS on QEMU (lm3s6965evb) alongside",
say:"I built an embedded Linux image with Buildroot, booted it under QEMU, launched my own service at boot, and wrote a kernel module and character driver for it.",
res:[["Buildroot manual","https://buildroot.org/docs.html"],["Bootlin training materials","https://bootlin.com/training/"],["Linux Kernel Labs","https://linux-kernel-labs.github.io/refs/heads/master/"]]},

{w:11,n:"Layered firmware on your laptop: HAL, state machine, tests",t:"C, 5-6 h",goal:"Design and implement a small sensor firmware with a hardware abstraction layer, a fixed-point filter, a state machine and a CRC-protected logger, fully unit tested on your host machine with a mock HAL.",
why:"Week 11 is embedded system design. This lab is a miniature version of what design interviews ask for: layers, interfaces, failure modes and testability.",
steps:[["Sketch the architecture first","Draw sensor driver, HAL, application state machine and logger with arrows for data flow. Write the requirements in five bullet points before any code."],
["Define the HAL interface","hal.h declares hal_adc_read(), hal_gpio_write(), hal_time_ms() and hal_uart_write(). Write hal_host.c (simulated values) and hal_mock.c (scripted values for tests)."],
["Write the sensor driver","Convert raw ADC counts to temperature using integer math only (milli-degrees). Add a 4-sample moving average and a stuck-sensor detector."],
["Build the state machine","States INIT, IDLE, SAMPLING, ALARM, FAULT. Use a transition table of (state, event) to next state and action. Add hysteresis so the alarm does not flicker around the threshold."],
["Add the logger","A ring buffer of fixed-size records, each with timestamp, value and a CRC8. Provide log_write, log_read and log_verify."],
["Write unit tests with the mock HAL","Test threshold crossing, hysteresis, stuck-sensor fault, ring buffer wraparound and CRC corruption detection. Use Unity, CMocka or plain assert()."],
["Write DESIGN.md","Block diagram, data flow, state diagram, and a failure-mode table (sensor stuck, buffer full, power loss) with detection and recovery for each."]],
ok:"All tests pass on the host with sanitizers on;The application code has zero direct hardware calls;DESIGN.md has a failure-mode table;You can walk through the design in 5 minutes",
more:"Port hal_host.c to the Wokwi project from week 9;Add a software watchdog and fault injection tests;Add a power-fail safe flash log simulation",
say:"I designed a layered firmware with a HAL and a mock for host testing, a table-driven state machine with hysteresis, fixed-point filtering and a CRC-protected log. I documented failure modes.",
res:[["Unity test framework","https://github.com/ThrowTheSwitch/Unity"],["CMocka","https://cmocka.org/"],["Memfault Interrupt blog","https://interrupt.memfault.com/"]]},
