 <h3>Stretch goals</h3><ul class="tl">${L.more.split(';').map(x=>`<li>${e(x)}</li>`).join('')}</ul>
 <h3>What to say in interviews</h3><p class="ans">${e(L.say)}</p>
 <div class="rs">${L.res.map(r=>`<a target="_blank" rel="noopener" href="${e(r[1])}">${e(r[0])}</a>`).join('')}</div>
 <textarea data-s="wl:${L.w}:note" style="margin-top:10px" placeholder="Repo link, what broke, what you learned">${e(s.note||'')}</textarea></div></details>`}).join('')}
function vBuild(){const bt=F.bt||'weekend';return `<div class="row" style="margin-bottom:12px"><button class="${bt=='weekend'?'pri':''}" data-a="bt" data-i="weekend">Weekend major projects (13)</button><button class="${bt=='proj'?'pri':''}" data-a="bt" data-i="proj">Milestone projects (10)</button></div>`+(bt=='weekend'?vWeekend():vProjects())}
function vProg(){const A=allP(),cats=[...new Set(A.map(p=>p.c))],qc=[...new Set(allQ().map(x=>x.c))],w=+F.rw||wk(cur()),r=S.rv[w]||{};
 const tiles=[['Course progress',K.course+'%'],['Total XP',K.xp.toLocaleString()],['Level',K.lv+', '+title(K.lv)],['Current streak',K.streak+' days'],['Best streak',K.best+' days'],['Days complete',K.dd+' / '+N],['Problems solved',K.solved+' / '+A.length],['Questions solved',K.qc+' / '+allQ().length],['Focus time',Math.round(K.fm/6)/10+' h'],['Boss days beaten',K.boss],['Missed-day penalty','-'+K.pen+' XP ('+K.miss+' days)']];
 const bars=(l,fn)=>l.map(c=>{const [a,b]=fn(c);return `<div><div class="row"><span class="grow">${e(c)}</span><span class="mu sm">${a} / ${b}</span></div><div class="bar"><i style="width:${b?a/b*100:0}%"></i></div></div>`}).join('');
 const ta=(k,l)=>`<h3 style="margin-top:12px">${l}</h3><textarea data-s="rv:${w}:${k}">${e(r[k]||'')}</textarea>`;
 const hm=Array.from({length:N},(_,i)=>{const n=i+1,p=dprog(n).p,st=dstat(n);return `<button class="hc ${st=='new'?(p>0?'l2':''):'s-'+st}" data-a="go" data-i="${n}" title="Day ${n}: ${Math.round(p*100)}%" aria-label="Day ${n}"></button>`}).join('');
 return `<div class="stats">${tiles.map(t=>`<div class="st"><span>${t[0]}</span><b>${t[1]}</b></div>`).join('')}</div>
 <div class="card"><h3>Problems solved</h3>${ring()}</div>
 <div class="card"><h3>90-day heatmap</h3><p class="mu sm">Each column is a week.</p>${legend()}<div class="hm" style="margin-top:8px">${hm}</div></div>
 <div class="card"><h3>Badges (${Object.keys(S.bd).length} / ${BG.length})</h3><div class="bgs" style="margin-top:10px">${BG.map(b=>`<div class="bg ${S.bd[b[0]]?'':'lock'}"><div class="em">${b[1]}</div><b>${b[2]}</b><span class="mu sm">${b[3]}</span></div>`).join('')}</div></div>
 <div class="two"><div class="card"><h3>DSA by category</h3>${bars(cats,c=>[A.filter(p=>p.c==c&&ps(p.id).st=='Solved').length,A.filter(p=>p.c==c).length])}</div><div class="card"><h3>Questions by topic</h3>${bars(qc,c=>[allQ().filter(x=>x.c==c&&qs(x.id).st=='Confident').length,allQ().filter(x=>x.c==c).length])}</div></div>
 <div class="card"><div class="row"><h3 class="grow">Weekly review</h3><select data-f="rw">${Array.from({length:13},(_,i)=>`<option value="${i+1}"${i+1==w?' selected':''}>Week ${i+1}: ${e(WK[i][1])}</option>`).join('')}</select></div>${ta('learned','What I learned')}${ta('struggled','What I struggled with')}${ta('revisit','Topics to revisit')}${ta('next','Plan for next week')}</div>`}

function vMk(){const l=S.mk.filter(m=>!F.mt||m.tp==F.mt),tp=[...new Set(S.mk.map(m=>m.tp))],cats=[...new Set(allQ().map(x=>x.c)),'DSA'];
 const ta=(i,p)=>`<textarea id="${i}" placeholder="${p}" style="min-height:56px;margin-top:8px"></textarea>`;
 return `<div class="card"><h3>Log a mistake (+5 XP)</h3><p class="mu sm">Writing down what went wrong is the fastest way to stop repeating it.</p><div class="f" style="margin-top:8px"><input type="date" id="md" value="${today()}"><select id="mt">${opts(cats)}</select></div>${ta('mq','Question or problem')}${ta('mw','What I did wrong')}${ta('mc','Correct concept')}${ta('ma','How I will avoid it next time')}<div style="margin-top:10px"><button class="pri" data-a="mkAdd">Add to log</button></div></div>
 <div class="row" style="margin:6px 2px"><b class="grow">${l.length} entries</b><select data-f="mt"><option value="">All topics</option>${opts(tp,F.mt)}</select></div>`+
 l.map(m=>`<div class="card"><div class="row"><b class="grow">${e(m.q)}</b><span class="tag cat">${e(m.tp)}</span><span class="mu sm">${m.dt}</span><button class="sbtn" data-a="mkDel" data-i="${m.id}">Delete</button></div><p><b>Wrong:</b> ${e(m.w)}</p><p><b>Correct:</b> ${e(m.c)}</p><p><b>Next time:</b> ${e(m.a)}</p></div>`).join('')}

function vSet(){return `<div class="card"><h3>Start date (Day 1)</h3><div class="row"><input type="date" id="sd" value="${S.start}"><button data-a="sd">Save start date</button></div><p class="mu sm">Missing days never resets progress. If you fall behind, unfinished days roll over automatically and each missed day costs 20 XP.</p>
 <h3 style="margin-top:16px">Backup</h3><p class="mu sm">Progress is saved in this browser only. Download a backup regularly.</p><div class="row"><button data-a="exp">Download JSON</button><button data-a="copy">Copy JSON</button><input type="file" id="imf" accept=".json,application/json"><button data-a="impF">Import file</button></div>
 <textarea id="jb" style="margin-top:8px" placeholder="Or paste backup JSON here, then click Import pasted"></textarea><div class="row" style="margin-top:6px"><button data-a="impT">Import pasted</button><button data-a="show">Show current JSON</button></div>
 <h3 style="margin-top:16px">Reset</h3><button data-a="rst" style="color:var(--bd)">Reset all progress</button></div>`}

const sec=(k,t,h)=>`<details data-k="${k}" ${OPEN.has(k)?'open':''}><summary>${t}</summary><div class="in">${h}</div></details>`;
const lk=(t,u)=>`<a target="_blank" rel="noopener" href="${u}">${t}</a>`;
function vGuide(){return `<div class="guide"><div class="card"><h2>The complete guide</h2><p class="mu">How to use this app, how the 90 days are built, and how to turn the preparation into an offer. Read sections 1 and 2 today, the rest when you need them.</p></div>
${sec('g0','1. Your daily routine (about 3 hours)',`<ol><li><b>Open Today and start the focus timer.</b> Work in 25-minute blocks with your phone away.</li><li><b>Learn (45 min):</b> read the topic, watch one video, then write what you learned in your own words in the day's Notes (at least 12 words). You cannot tick Learn without it.</li><li><b>DSA (60 min):</b> solve the day's LeetCode problems. Easy and Medium problems are required, Hard ones are optional stretch. To mark one Solved you must write its approach and complexity in its note box. Stuck for 20 minutes? Read a hint, then re-solve from scratch tomorrow. Star anything that hurt.</li><li><b>Drill (20 min):</b> type each answer in your own words and press Submit. It is graded against the key ideas of the model answer, you see which ideas you missed, and XP drops with each extra attempt.</li><li><b>Build (60 to 90 min):</b> create the day's mini-project in Visual Studio. Tick each requirement as you meet it and paste your real output as evidence.</li><li><b>Close the day:</b> write two lines of notes and log any mistake. The day turns green automatically when everything is done or skipped.</li></ol><p><b>Short on time?</b> Do one DSA problem and the drill, then catch up at the weekend. A short day beats a skipped day.</p><div class="tw"><table><tr><th>Action</th><th>XP</th></tr><tr><td>Learn quest (with teach-back) / Build mini-project</td><td>20 / 30 (shared across its requirements)</td></tr><tr><td>Problem solved (Easy, Medium, Hard)</td><td>10 / 25 / 50 (skipped earns 0)</td></tr><tr><td>Interview question accepted (Easy, Medium, Hard)</td><td>8 / 12 / 20 on the first try, 75% on the second, 50% after; 35% for a partial answer; a quarter if you gave up first</td></tr><tr><td>Day complete (everything done or skipped) / boss day</td><td>25 / 75</td></tr><tr><td>Project milestone / project finished</td><td>8 / 40</td></tr><tr><td>Weekend project step / project finished</td><td>6 / 60</td></tr><tr><td>Focus time</td><td>2 per 5 finished minutes, up to 96 a day</td></tr><tr><td>Mistake logged</td><td>5</td></tr><tr><td>Streak bonus</td><td>up to 30 a day</td></tr><tr><td><b>Missed day</b></td><td><b>-20 each. The unfinished day rolls over to today.</b></td></tr></table></div>`)}
${sec('gs','Free setup: Visual Studio, WSL and tools',`<p>Everything in this plan is free. You need a Windows PC, an internet connection and about 15 GB of disk space.</p><ol><li><b>Visual Studio Community</b> (free for individuals and learners): ${lk('download it','https://visualstudio.microsoft.com/vs/community/')}. In the installer tick <i>Desktop development with C++</i>.</li><li><b>Daily project:</b> File, New, Project, Console App (C++), named dayNN. For C code add a file ending in .c (right-click it, Properties, C/C++, Advanced, Compile As C Code). Run with Ctrl+F5 and debug with F5.</li><li><b>scanf warnings:</b> put #define _CRT_SECURE_NO_WARNINGS on the very first line.</li><li><b>Feed input from a file:</b> Project Properties, Debugging, Command Arguments: &lt; input.txt</li><li><b>Memory bugs:</b> Project Properties, C/C++, Enable Address Sanitizer = Yes (${lk('docs','https://learn.microsoft.com/cpp/sanitizers/asan')}).</li><li><b>Days tagged Needs Linux:</b> install ${lk('WSL2','https://learn.microsoft.com/windows/wsl/install')}: open PowerShell as administrator, run wsl --install, restart, open Ubuntu, then run sudo apt update and sudo apt install -y build-essential gdb valgrind cmake strace. Edit in any editor and compile with gcc or g++ in the Ubuntu terminal.</li><li><b>Kernel and board days:</b> use ${lk('QEMU','https://www.qemu.org/')} with the Buildroot image from Week 10, or a free Ubuntu VM in ${lk('VirtualBox','https://www.virtualbox.org/')}. The ${lk('Wokwi','https://wokwi.com/')} simulator runs in your browser.</li><li><b>Git:</b> install ${lk('Git','https://git-scm.com/')}, make a free GitHub account and keep one repository with a folder per day.</li><li><b>Practice:</b> LeetCode with a free account (this plan uses free problems), YouTube, and free mock interviews on ${lk('Pramp','https://www.pramp.com/')}.</li></ol>`)}
${sec('gn','No-cheating rules: how to really learn this',`<ul><li><b>Learn needs a teach-back:</b> write what you learned in your own words (12+ words) before you can tick it.</li><li><b>Solved needs an approach:</b> write the approach and complexity (4+ words) in the problem's note box. If you cannot explain it, it is not solved.</li><li><b>Drill is graded:</b> type real sentences. Extra attempts earn less XP and giving up first earns a quarter.</li><li><b>Build needs evidence:</b> meet each requirement, then paste your real output. The day is not green without it.</li><li><b>Timed days are timed:</b> boss days and mocks use a visible timer and no hints.</li><li><b>Redo starred problems cold</b> after 1, 3 and 7 days.</li><li>The app cannot check your code, but interviews will test the same skills live, so shortcuts only cheat you. Finish with real mock interviews with another person (free on Pramp).</li></ul>`)}
${sec('g1','2. The 90-day plan at a glance',`<div class="tw"><table><tr><th>Phase</th><th>Days</th><th>Focus</th><th>You can do this at the end</th></tr><tr><td><b>Boot</b></td><td>1-21</td><td>C, C++, toolchain, GDB, DSA basics</td><td>Write and debug C/C++, solve easy and medium array, string, list and stack problems</td></tr><tr><td><b>Kernel</b></td><td>22-42</td><td>OS, Linux, memory, IPC, interrupts</td><td>Explain processes, virtual memory, scheduling; write Linux C programs</td></tr><tr><td><b>I/O</b></td><td>43-63</td><td>Networking, multithreading, UART/I2C/SPI/CAN, DMA</td><td>Build socket servers, write thread-safe code, reason about buses</td></tr><tr><td><b>Firmware</b></td><td>64-84</td><td>Embedded Linux, RTOS, design, capstone, behavioural</td><td>Write drivers, answer design questions, show a polished project</td></tr><tr><td><b>Ship</b></td><td>85-90</td><td>Resume, mocks, applications</td><td>Interview calmly</td></tr></table></div><p><b>Start applying around Day 60.</b> Real interviews teach more than any mock, and most hiring processes take weeks. Every 7th day is a boss day: a timed test plus a drill of that whole week's questions.</p>`)}
${sec('g2','3. How to practise LeetCode so it sticks',`<ol><li>Read the problem and restate it. Write two examples and one edge case before coding.</li><li>Give yourself <b>20 minutes</b>. Then read a hint or the approach, never the full code first.</li><li>Code it yourself in a plain editor, without autocomplete. State time and space complexity aloud.</li><li><b>Star it</b> if you needed help. Re-solve starred problems after 1, 3, 7 and 21 days. The Revisit queue on Today shows them.</li><li>Name the pattern in your notes (see the cheat sheet on the DSA tab). Patterns transfer; solutions do not.</li></ol><p>Targets that match a good-company bar: all Easy comfortable in 15 minutes, most Medium in 30, and 2 to 3 Hard problems understood. ${lk('NeetCode 150','https://neetcode.io/practice')} and ${lk('LeetCode study plans','https://leetcode.com/studyplan/')} are good places to extend beyond this list.</p>`)}
${sec('g3','4. What embedded and systems interviews look like',`<div class="tw"><table><tr><th>Round</th><th>What it tests</th><th>Where to prepare here</th></tr><tr><td>Online test or screening</td><td>DSA mediums, C/C++ output questions, aptitude</td><td>DSA tab, C and C++ questions</td></tr><tr><td>Coding (1 to 2 rounds)</td><td>1 to 2 problems in 45 minutes, clean code, complexity</td><td>Days 1 to 63, mock days 86 and 90</td></tr><tr><td>Fundamentals</td><td>C/C++, OS, Linux, networking, concurrency</td><td>Q&A tab and drill</td></tr><tr><td>Embedded</td><td>Buses, interrupts, drivers, RTOS, debugging stories</td><td>Days 57 to 70, projects</td></tr><tr><td>Design</td><td>Embedded system or low-level design, trade-offs</td><td>Days 71 to 78</td></tr><tr><td>Manager and HR</td><td>Projects, ownership, teamwork, motivation</td><td>Day 79, STAR stories</td></tr></table></div><ul><li>Ask clarifying questions first. State assumptions. Think aloud.</li><li>Be ready to write in C: pointers, bit ops, linked lists, ring buffers, string functions.</li><li>Anything on your resume is fair game. If you list a protocol or a project, know it deeply.</li><li>Say what you do not know, then reason toward an answer. Bluffing is the fastest way to lose an offer.</li></ul>`)}
${sec('g4','5. Where to apply',`<p>Hiring varies by year and team, so open the careers page and filter for firmware, embedded, systems, driver, BSP, validation and networking roles.</p><div class="rs">${[['NVIDIA','https://www.nvidia.com/en-us/about-nvidia/careers/'],['Qualcomm','https://www.qualcomm.com/company/careers'],['Intel','https://jobs.intel.com'],['AMD','https://careers.amd.com'],['Texas Instruments','https://careers.ti.com'],['Bosch','https://www.bosch.com/careers/'],['Cisco','https://jobs.cisco.com'],['Arista','https://www.arista.com/en/careers'],['Apple','https://jobs.apple.com'],['Microsoft','https://careers.microsoft.com'],['Google','https://www.google.com/about/careers/applications/'],['Tesla','https://www.tesla.com/careers']].map(c=>lk(c[0],c[1])).join('')}</div><p>Also look at automotive suppliers, networking and storage companies, and IoT product startups. Ask for referrals: they beat cold applications by a wide margin.</p>`)}
${sec('g5','6. Behavioural answers (STAR)',`<p>Prepare six stories and reuse them: a hard bug, a project you owned, a conflict, a failure, a deadline under pressure, and something you learned fast. For each: <b>Situation</b> (1 sentence), <b>Task</b> (your responsibility), <b>Action</b> (what you did, with specifics and tools), <b>Result</b> (a number if possible, plus what you learned).</p><p>Prepare a 90-second "tell me about yourself": present role and skills, past projects, and why this team. Practise it out loud until it sounds natural.</p>`)}
${sec('g6','7. Resume and projects',`<ul><li>One page. Lead with skills and projects if you have little experience.</li><li>Bullet formula: <i>Built X using Y, which achieved Z</i>. Example: Built a lock-free ring buffer in C++ that sustained 2M messages per second under TSan-clean tests.</li><li>List C, C++, Linux, RTOS, protocols and tools you can discuss for 10 minutes.</li><li>Put the capstone and two other projects on GitHub with a README: what it does, how to build, how to run, design notes.</li></ul>`)}
${sec('g7','8. Resource library',`<div class="tw"><table><tr><th>Topic</th><th>Free resources</th></tr><tr><td>C and C++</td><td>${lk("Beej's Guide to C",'https://beej.us/guide/bgc/')}, ${lk('learncpp.com','https://www.learncpp.com/')}, ${lk('cppreference','https://en.cppreference.com/')}, ${lk('Compiler Explorer','https://godbolt.org/')}</td></tr><tr><td>Operating systems</td><td>${lk('OSTEP','https://pages.cs.wisc.edu/~remzi/OSTEP/')}, ${lk('Linux man pages','https://man7.org/linux/man-pages/')}, ${lk('The Missing Semester','https://missing.csail.mit.edu/')}</td></tr><tr><td>Networking</td><td>${lk("Beej's Network Guide",'https://beej.us/guide/bgnet/')}, ${lk('Cloudflare Learning Center','https://www.cloudflare.com/learning/')}, ${lk('Wireshark docs','https://www.wireshark.org/docs/')}</td></tr><tr><td>Concurrency</td><td>${lk('POSIX threads (LLNL)','https://hpc-tutorials.llnl.gov/posix/')}, ${lk('Preshing','https://preshing.com/')}, ${lk('C++ threads','https://en.cppreference.com/w/cpp/thread')}</td></tr><tr><td>Embedded</td><td>${lk('Memfault Interrupt','https://interrupt.memfault.com/')}, ${lk('Embedded Artistry','https://embeddedartistry.com/')}, ${lk('Arm docs','https://developer.arm.com/documentation/')}, ${lk('Wokwi simulator','https://wokwi.com/')}, ${lk('Barr C standard','https://barrgroup.com/embedded-systems/books/embedded-c-coding-standard')}</td></tr><tr><td>Embedded Linux and RTOS</td><td>${lk('Bootlin training','https://bootlin.com/training/')}, ${lk('Linux Kernel Labs','https://linux-kernel-labs.github.io/refs/heads/master/')}, ${lk('Linux kernel docs','https://docs.kernel.org/')}, ${lk('FreeRTOS docs','https://www.freertos.org/Documentation/00-Overview')}</td></tr><tr><td>DSA and mocks</td><td>${lk('LeetCode','https://leetcode.com/problemset/')}, ${lk('NeetCode','https://neetcode.io/roadmap')}, ${lk('Pramp','https://www.pramp.com/')}, ${lk('interviewing.io','https://interviewing.io/')}, ${lk('System Design Primer','https://github.com/donnemartin/system-design-primer')}</td></tr></table></div>`)}
${sec('gw','Weekend labs: how to get the most from them',`<ul><li>Each week ends with a hands-on lab (Projects tab, Weekend labs). Block 4 to 6 hours across Day 6 and 7. Day 7 is also a boss day, so do the lab on Day 6 and the first half of Day 7 if needed.</li><li>Do the steps in order. Each step says exactly what to type or build. If you get stuck for 30 minutes, read the linked man page or docs, then ask for help.</li><li>Treat "You are done when" as the acceptance test. If a check fails, the lab is not done.</li><li>Commit every lab to GitHub with a README. By Day 90 you will have 13 small projects, which is a real portfolio.</li><li>Skipping a lab? Do not skip weeks 4 to 11: they are the strongest interview material.</li></ul>`)}
${sec('gv','Best YouTube channels (by topic)',`<p>Every day on the Today tab has video chips that search the topic on the right channels. Subscribe to these:</p><div class="rs">${Object.values(CH).map(c=>lk('▶ '+c[0],c[1])).join('')}</div><ul><li><b>DSA:</b> NeetCode (every problem here has a video link), take U forward.</li><li><b>C, C++, systems:</b> Jacob Sorber, The Cherno, CppCon, Low Level Learning.</li><li><b>OS and networking:</b> Neso Academy, Gate Smashers, Practical Networking.</li><li><b>Embedded and Linux:</b> Phil's Lab, Bootlin.</li><li><b>Mocks:</b> interviewing.io.</li></ul>`)}
${sec('gb','Is this enough for big tech? Honest gaps',`<p>This plan targets Google, Amazon, Microsoft, Apple, NVIDIA and Qualcomm-level bars for embedded and systems roles. What it cannot do for you:</p><ul><li><b>DSA volume (now built in):</b> the plan has ${PL.length} problems: ${PL.filter(p=>p.d!='Hard').length} Easy or Medium (these are the required core) and ${PL.filter(p=>p.d=='Hard').length} Hard (optional stretch for bonus XP). Days 71 to 90 get harder, then timed mock days.</li><li><b>Timed practice:</b> from Day 40, treat each boss day as a timed round: 2 problems in 60 minutes. On busy days, do the Medium and Hard of the day's topic first and star the rest.</li><li><b>Real mocks:</b> at least 6 with other people (Pramp, interviewing.io, friends). Solo practice hides communication gaps.</li><li><b>Depth over breadth:</b> big teams probe one topic for 20 minutes. Pick 3 strengths (for example Linux drivers, RTOS, networking) and go deep.</li><li><b>Experience signal:</b> one strong, public, well-documented project beats five half-finished ones.</li><li><b>Time:</b> 90 days is tight if you start from zero. Treat Day 90 as the start of applications, and keep 1 to 2 hours a day of DSA going afterwards.</li></ul><p>Nobody can guarantee an offer. Consistency, mocks and applying widely matter most.</p>`)}
${sec('g8','9. If you fall behind, and interview-day checklist',`<ul><li>Never reset. If you miss a day, it costs 20 XP and the unfinished day rolls over into today automatically, so you always continue from where you stopped.</li><li>Cut Build before you cut DSA or Drill. Keep the capstone days (80 to 83) intact.</li><li>Merge two light days into one rather than rushing a hard topic.</li></ul><p><b>Before the interview:</b> sleep, test your audio and editor, have water, and review your cheat sheets and Mistake Log, not new topics. <b>During:</b> clarify, plan, code, test with an example, state complexity. <b>After:</b> write down every question you missed and add it to the Mistake Log.</p>`)}</div>`}
