<h3>DSA problems · solve in C++</h3>${ds.length?ds.map(q=>`<div class="r"><span class="grow"><a target="_blank" rel="noopener" href="${lc(q.n)}">${e(q.n)} ↗</a> <span class="tag">${q.d}</span> <span class="tag">${q.priority||'Core · P0'}</span></span><select data-a="dst" data-i="${q.id}">${opts(ST,q.st)}</select></div>`).join(''):'<div class="m">No new problem today: redo a missed problem or explain a previous solution without notes.</div>'}
<h3>C++ coding task</h3><div>${e(PR[n]||'Implement a small C++ exercise for: '+D[n-1])}</div>
<h3>Study links</h3><ul>${[['LeetCode 75 · official 1–3 month plan','https://leetcode.com/studyplan/leetcode-75/'],['LeetCode 75 study plan','https://leetcode.com/studyplan/leetcode-75/'],['Video lesson · curated channel search',videoFor(n)],['C++ reference','https://en.cppreference.com/w/cpp'],['Python tutorial','https://docs.python.org/3/tutorial/'],['Git basics','https://git-scm.com/docs/gittutorial']].map(x=>`<li><a class="resource-link" target="_blank" rel="noopener" href="${x[1]}">${e(x[0])} ↗</a></li>`).join('')}</ul>
<h3>Reflection & notes</h3><textarea data-s="done:${n}:notes" placeholder="What did you learn? What felt difficult? What will you revisit?">${e(d.notes||'')}</textarea></section>`}
function vRoad(){let h='';for(let w=1;w<=WEEKS;w++){const dc=R7(w).filter(n=>g(n).c).length;h+=`<details data-w="${w}" ${OPEN.has(w)?'open':''}><summary class="${dc==R7(w).length?'dn':''}">Week ${w} — ${WN[w-1]} <span class="m">· ${PH[w-1]} · ${dc}/${R7(w).length} days</span></summary><div>${R7(w).map(n=>`<div class="r"><span class="${g(n).c?'dn':''}" style="width:20px">${g(n).c?'✓':''}</span><button data-a="go" data-i="${n}">Day ${n}</button><span class="grow ${g(n).c?'dn':''}">${e(D[n-1])}</span><span class="m">${dayDate(n)} · ${pct(n)}%</span></div>`).join('')}</div></details>`}return h}
function vDsa(){const q=(F.dq||'').toLowerCase(),cs=Object.keys(DS);let h=`<div class="card"><div class="f"><input type="search" id="f_dq" data-f="dq" placeholder="Search problems" value="${e(F.dq||'')}"><select data-f="ds"><option value="">All statuses</option>${opts(ST,F.ds)}</select><select data-f="dp"><option value="">Core + stretch</option>${opts(['Core · P0','Stretch · P1','Custom'],F.dp)}</select><select data-f="dc"><option value="">All categories</option>${opts(cs,F.dc)}</select></div>
<div class="row" style="margin-top:8px"><input id="an" placeholder="New problem name" class="grow"><select id="ac">${opts(cs)}</select><select id="ad">${opts(['Easy','Medium','Hard'],'Medium')}</select><button data-a="dsaAdd">Add</button></div></div>`;
cs.forEach(c=>{if(F.dc&&F.dc!=c)return;const all=S.dsa.filter(p=>p.c==c),l=all.filter(p=>(!F.ds||p.st==F.ds)&&(!F.dp||p.priority==F.dp)&&p.n.toLowerCase().includes(q));
h+=`<h3>${c} <span class="m">${all.filter(p=>p.st=='Solved').length}/${all.length} solved</span></h3>`+(l.length?l.map(p=>`<div class="r"><span class="grow"><a target="_blank" rel="noopener" href="${lc(p.n)}"><b>${e(p.n)} ↗</b></a> <span class="tag">${p.d}</span> <span class="tag">${p.priority||'Custom'}</span>${p.day?` <span class="m">Day ${p.day}</span>`:''}</span><select data-a="dst" data-i="${p.id}">${opts(ST,p.st)}</select><span class="m">${p.dt||''}</span><input type="text" data-s="dsa:${p.id}:note" placeholder="Notes" value="${e(p.note)}"><button data-a="dsaEd" data-i="${p.id}">Edit</button><button data-a="dsaDel" data-i="${p.id}">Delete</button></div>`).join(''):'<div class="m">Nothing here yet. Add problems above.</div>')});return h}
function vIq(){const q=(F.qq||'').toLowerCase(),l=S.iq.filter(x=>(!F.qc||x.c==F.qc)&&(!F.qs||x.st==F.qs)&&x.q.toLowerCase().includes(q));
return `<div class="card"><div class="f"><input type="search" id="f_qq" data-f="qq" placeholder="Search questions" value="${e(F.qq||'')}"><select data-f="qc"><option value="">All categories</option>${opts(QC,F.qc)}</select><select data-f="qs"><option value="">All statuses</option>${opts(QST,F.qs)}</select></div>
<div class="row" style="margin-top:8px"><input id="nq" class="grow" placeholder="New question"><select id="nc">${opts(QC)}</select><button data-a="iqAdd">Add</button></div></div><div class="m">${l.length} questions · ${S.iq.filter(x=>x.st=='Confident').length} confident</div>`+
l.map(x=>`<div class="card"><div class="row"><b class="grow">${e(x.q)}</b><span class="tag">${x.c}</span><span class="tag">Core interview</span><select data-a="qst" data-i="${x.id}">${opts(QST,x.st)}</select></div><textarea data-s="iq:${x.id}:a" placeholder="My answer / notes">${e(x.a)}</textarea><div class="row"><span class="m grow">Last reviewed: ${x.rv||'never'}</span><button data-a="iqRev" data-i="${x.id}">Reviewed today</button><button data-a="iqEd" data-i="${x.id}">Edit</button><button data-a="iqDel" data-i="${x.id}">Delete</button></div></div>`).join('')}
function vProj(){return `<div class="card row"><input id="np" class="grow" placeholder="New project / exercise"><button data-a="pAdd">Add</button></div>`+S.pr.map(p=>`<div class="card"><div class="row"><b class="grow">${e(p.n)}</b><select data-a="pst" data-i="${p.id}">${opts(PST,p.st)}</select><button data-a="pDel" data-i="${p.id}">Delete</button></div><textarea data-s="pr:${p.id}:note" placeholder="Notes, repo link, what's left">${e(p.note)}</textarea></div>`).join('')}
function wstat(w){const days=R7(w),dts=days.map(dayDate);return{dd:days.filter(n=>g(n).c).length,ds:S.dsa.filter(p=>p.st=='Solved'&&dts.includes(p.dt)).length,iq:S.iq.filter(x=>dts.includes(x.rv)).length,pr:days.filter(n=>g(n).pr).length,mk:S.mk.filter(m=>dts.includes(m.dt)),ln:S.iq.filter(x=>x.st=='Learning'&&days.includes(x.day))}}
function vRev(){const w=+F.rw||wk(cur()),s=wstat(w),r=S.rv[w]||{},weak=[...new Set([...s.mk.map(m=>m.tp),...s.ln.map(x=>x.c)])];
const ta=(k,l)=>`<h3>${l}</h3><textarea data-s="rv:${w}:${k}">${e(r[k]||'')}</textarea>`;
return `<div class="card row"><b>Week</b><select data-f="rw">${Array.from({length:WEEKS},(_,i)=>`<option value="${i+1}"${i+1==w?' selected':''}>Week ${i+1} — ${WN[i]}</option>`).join('')}</select></div>
<div class="stats"><div class="stat"><span class="m">Days completed</span><b>${s.dd}/${R7(w).length}</b></div><div class="stat"><span class="m">DSA solved</span><b>${s.ds}</b></div><div class="stat"><span class="m">Questions reviewed</span><b>${s.iq}</b></div><div class="stat"><span class="m">Practical done</span><b>${s.pr}</b></div><div class="stat"><span class="m">Mistakes logged</span><b>${s.mk.length}</b></div></div>
<div class="card"><b>Weak topics (from mistakes + "Learning" questions)</b><div>${weak.length?weak.map(e).join(', '):'<span class="m">None yet</span>'}</div>${ta('learned','What I learned')}${ta('struggled','What I struggled with')}${ta('revisit','Topics I need to revisit')}${ta('dsa','DSA problems I couldn\'t solve')}${ta('iq','Interview questions I couldn\'t answer')}${ta('next','Notes for next week')}</div>`}
function vMk(){const l=S.mk.filter(m=>!F.mt||m.tp==F.mt),tp=[...new Set(S.mk.map(m=>m.tp))];
const ta=(i,l)=>`<textarea id="${i}" placeholder="${l}" style="min-height:56px"></textarea>`;
return `<div class="card"><b>Add mistake</b><div class="f" style="margin:8px 0"><input type="date" id="md" value="${today()}"><input id="mt" list="tl" placeholder="Topic"><datalist id="tl">${QC.map(c=>`<option>${c}</option>`).join('')}<option>DSA</option></datalist></div>${ta('mq','Question / problem')}${ta('mw','What I did wrong')}${ta('mc','Correct concept')}${ta('ma','How I will avoid it next time')}<div style="margin-top:6px"><button class="pri" data-a="mkAdd">Add to log</button></div></div>
<div class="row"><b class="grow">${l.length} entries</b><select data-f="mt"><option value="">All topics</option>${opts(tp,F.mt)}</select></div>`+
l.map(m=>`<div class="card"><div class="row"><b class="grow">${e(m.q)}</b><span class="tag">${e(m.tp)}</span><span class="m">${m.dt}</span><button data-a="mkDel" data-i="${m.id}">Delete</button></div><p><b>Wrong:</b> ${e(m.w)}</p><p><b>Correct:</b> ${e(m.c)}</p><p><b>Next time:</b> ${e(m.a)}</p></div>`).join('')}
function vLibrary(){
const cards=[['C++ · primary language','OOP · STL · pointers and references · lifetime and RAII · smart pointers · templates · lambdas · move semantics · modern C++ algorithms','https://en.cppreference.com/w/cpp'],['Python · practical fluency','Syntax · lists, dictionaries, sets · functions · OOP · files and JSON · scripting · interview problem solving','https://docs.python.org/3/tutorial/'],['DSA · every day','Arrays · strings · hashing · two pointers · sliding window · binary search · lists · stacks and queues · trees · heaps · graphs · greedy · recursion · backtracking · dynamic programming','https://leetcode.com/problemset/'],['Systems software','Operating systems · Linux · processes and threads · memory · concurrency · networks · computer architecture · software system design','https://man7.org/linux/man-pages/'],['Embedded specialization','Firmware architecture · driver APIs · DMA data ownership · interrupts · Embedded Linux · RTOS · debugging · software testing','https://www.freertos.org/Documentation/RTOS_book.html'],['Engineering workflow','Git/GitHub · code review · unit and integration tests · fault handling · performance measurement','https://git-scm.com/docs/gittutorial']];
return '<section class="welcome-card library-welcome"><div><div class="welcome-kicker">STUDY LIBRARY</div><h1>Find a topic by skill area.</h1><p>Use the Today page for the next task. Use this library to review the full scope.</p></div></section><div class="topic-grid">'+cards.map((c,i)=>'<section class="card topic-card"><div class="topic-index">0'+(i+1)+'</div><h2>'+e(c[0])+'</h2><p>'+e(c[1])+'</p><a class="resource-link" target="_blank" rel="noopener" href="'+c[2]+'">Open reference ↗</a></section>').join('')+'</div>';

function vGuide(){
const weekly=WN.map((w,i)=>'<li><b>Week '+(i+1)+': '+e(w)+'</b> · Days '+(i*7+1)+'–'+Math.min((i+1)*7,PLAN_DAYS)+'</li>').join('');

}

function vReady(){
const score=k=>skillScore(k),labels=['Revisit','Learning','Explain','Interview-ready'];
const tests=TESTS.map(t=>g(t.day).testScore).filter(v=>v!==undefined&&v!=='').map(Number).filter(Number.isFinite);
const rows=READINESS_TOPICS.map(k=>'<div class="r"><span class="grow">'+e(k)+'</span><select data-a="ready" data-i="'+e(k)+'">'+[0,1,2,3].map(v=>'<option value="'+v+'"'+(score(k)===v?' selected':'')+'>'+v+' · '+labels[v]+'</option>').join('')+'</select></div>').join('');
return '<section class="card"><h2>Readiness dashboard</h2><p class="m">Rate evidence you can demonstrate: 0 = revisit, 1 = learning, 2 = can explain, 3 = interview-ready.</p><div class="stats"><div class="stat"><span class="m">Overall Software Engineer Readiness</span><b>'+readinessPct(READINESS_TOPICS)+'%</b></div><div class="stat"><span class="m">Problems solved</span><b>'+S.dsa.filter(p=>p.st==="Solved").length+'/'+S.dsa.length+'</b></div><div class="stat"><span class="m">Mock test average</span><b>'+(tests.length?(tests.reduce((a,b)=>a+b,0)/tests.length).toFixed(1):'—')+'/10</b></div><div class="stat"><span class="m">Study streak</span><b>'+streak()+' days</b></div></div><div class="callout"><b>Weak topics:</b> '+weakSkills().map(e).join(' · ')+'</div></section><section class="card"><h3 style="margin-top:0">Skill ratings</h3>'+rows+'</section>';
}

function vTests(){const nDoneTests=TESTS.filter(t=>g(t.day).testDone).length;return `<div class="card"><div class="row"><div class="grow"><h2>Weekly tests</h2><div class="m">One practical checkpoint each week · ${nDoneTests}/${TESTS.length} completed</div></div></div><div class="callout">Score yourself honestly: accuracy 0–3, reasoning/evidence 0–3, tradeoffs/failure handling 0–2, communication 0–2. Record one fix for every score below 7.</div></div>`+TESTS.map((t,i)=>{const d=g(t.day);return `<section class="card"><div class="row"><span class="tag">Week ${i+1} · Day ${t.day}</span><b class="grow">${e(t.title)}</b><span class="tag ${d.testDone?'dn':''}">${d.testDone?'Complete':'Planned'}</span></div><p style="margin:12px 0">${e(t.task)}</p><div class="row"><span class="m grow">Time box: ${t.minutes} minutes</span><label>Score /10 <input type="number" min="0" max="10" data-s="done:${t.day}:testScore" value="${e(d.testScore??'')}" style="width:90px"></label><button class="${d.testDone?'ok':''}" data-a="testDone" data-i="${t.day}">${d.testDone?'Undo completion':'Mark test complete'}</button></div></section>`}).join('')}
function vData(){return `<div class="card"><h3 style="margin-top:0">Start date (Day 1)</h3><div class="row"><input type="date" id="sd" value="${S.start}"><button data-a="sd">Save start date</button></div><div class="m">Missing days never reset progress; the current day just moves with the calendar.</div>
<h3>Backup</h3><div class="row"><button data-a="exp">Download JSON</button><button data-a="copy">Copy JSON</button><input type="file" id="imf" accept=".json,application/json"><button data-a="impF">Import file</button></div>
<textarea id="jb" placeholder="Or paste backup JSON here, then click Import pasted"></textarea><div class="row" style="margin-top:6px"><button data-a="impT">Import pasted</button><button data-a="show">Show current JSON</button></div>
<h3>Reset</h3><button data-a="rst" style="color:var(--r)">Reset all progress</button></div>`}
const V_={dashboard:vDashboard,today:vToday,guide:vGuide,library:vLibrary,ready:vReady,tests:vTests,road:vRoad,dsa:vDsa,iq:vIq,proj:vProj,rev:vRev,mk:vMk,data:vData};
function R(){document.documentElement.dataset.theme=S.theme||'';$('#app').innerHTML=head()+(V_[V]||vDashboard)()+'</div></main></div>'}
function imp(t){try{const x=JSON.parse(t);if(!x||!x.done||!x.dsa||!x.iq)throw 0;if(!confirm('Replace current data with the imported backup?'))return;S=x;save();R();alert('Imported.')}catch(_){alert('Import failed: not a valid backup file.')}}
function setv(a,i,k,v){if(a=='done'||a=='rv'){const o=S[a][i]||(S[a][i]={});o[k]=v}else find(a,i)[k]=v}
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.s){const[a,i,k]=t.dataset.s.split(':');setv(a,i,k,t.value);save();return}
if(t.dataset.f){F[t.dataset.f]=t.value;R();const x=document.getElementById('f_'+t.dataset.f);if(x){x.focus();x.setSelectionRange(1e3,1e3)}}});
document.addEventListener('toggle',ev=>{const w=ev.target.dataset&&ev.target.dataset.w;if(w){ev.target.open?OPEN.add(+w):OPEN.delete(+w)}},true);
document.addEventListener('change',ev=>{const t=ev.target,a=t.dataset.a;if(!a)return;const n=SEL||cur(),i=t.dataset.i;
if(a=='ready'){S.ready=S.ready||{};S.ready[i]=Number(t.value)} else if(a=='chk'){(S.done[n]=g(n)===S.done[n]?S.done[n]:{...g(n)})[i]=t.checked}
else if(a=='dst'){const p=find('dsa',i);p.st=t.value;p.dt=t.value=='Solved'?today():''}
else if(a=='qst'){const q=find('iq',i);q.st=t.value;q.rv=today()}
else if(a=='pst')find('pr',i).st=t.value;
save();R()});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(!t||t.tagName=='SELECT'||t.type=='checkbox')return;const a=t.dataset.a,i=t.dataset.i,n=SEL||cur(),v=id=>$('#'+id).value.trim();
if(a=='tab')V=i;else if(a=='go'){SEL=+i;V='today';scrollTo(0,0)}
else if(a=='nav')SEL=Math.max(1,Math.min(PLAN_DAYS,n+ +i));
else if(a=='start'){const o=S.done[n]||(S.done[n]={});o.started=1;save();const f=(document.querySelector('a[target]')||{}).href;document.getElementById('tasks').scrollIntoView({behavior:'smooth'});return}
else if(a=='comp'){const o=S.done[n]||(S.done[n]={});o.c=!o.c}
else if(a=='testDone'){const day=+i,o=S.done[day]||(S.done[day]={});o.testDone=!o.testDone;if(o.testDone)o.testDate=today()}
else if(a=='theme'){S.theme=S.theme=='light'?'dark':'light'}
else if(a=='dsaAdd'){if(!v('an'))return;S.dsa.push({id:S.nid++,c:v('ac'),n:v('an'),d:v('ad'),priority:'Custom',st:'Not Started',dt:'',note:'',day:0})}
else if(a=='dsaEd'){const p=find('dsa',i),x=prompt('Problem name',p.n);if(x)p.n=x}
else if(a=='dsaDel'){if(confirm('Delete this problem?'))S.dsa=S.dsa.filter(p=>p.id!=i)}
else if(a=='iqAdd'){if(!v('nq'))return;S.iq.push({id:S.nid++,c:v('nc'),q:v('nq'),st:'New',a:'',rv:'',day:0})}
else if(a=='iqEd'){const q=find('iq',i),x=prompt('Question',q.q);if(x)q.q=x}
else if(a=='iqDel'){if(confirm('Delete this question?'))S.iq=S.iq.filter(q=>q.id!=i)}
else if(a=='iqRev')find('iq',i).rv=today();
else if(a=='pAdd'){if(!v('np'))return;S.pr.push({id:S.nid++,n:v('np'),st:'Not Started',note:''})}
else if(a=='pDel'){if(confirm('Delete this project?'))S.pr=S.pr.filter(p=>p.id!=i)}

else if(a=='mkDel'){if(confirm('Delete this entry?'))S.mk=S.mk.filter(m=>m.id!=i)}
else if(a=='sd'){if(v('sd'))S.start=v('sd')}
else if(a=='exp'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='roadmap-backup-'+today()+'.json';l.click();$('#jb').value=JSON.stringify(S,null,1);return}
else if(a=='show'){$('#jb').value=JSON.stringify(S,null,1);return}
else if(a=='copy'){const j=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>alert('Copied.'),()=>{$('#jb').value=j;alert('Clipboard blocked; JSON placed in the box, copy it manually.')});return}
else if(a=='impT'){imp($('#jb').value);return}
else if(a=='impF'){const f=$('#imf').files[0];if(!f){alert('Choose a .json file first.');return}const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f);return}
else if(a=='rst'){if(confirm('Reset ALL progress, notes and custom items? This cannot be undone.')){S=seed();SEL=0}else return}
save();R()});
R();
</script></body></html>
