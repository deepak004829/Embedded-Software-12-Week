 const x=pl+ds.length*bw;s+=`<rect x="${x+1}" y="${y(nx)}" width="${Math.max(1,bw-2)}" height="${H-pb-y(nx)}" fill="none" stroke="#d8b56a" stroke-dasharray="3 2"/>`;
 s+=`<text x="${pl}" y="${H-6}" font-size="10" fill="#8e8b84">${d0.slice(5)}</text><text x="${x+bw/2}" y="${H-6}" font-size="10" fill="#8e8b84" text-anchor="middle">tomorrow</text></svg>`;return s}
function chCum(){const t=TD(),m=solvedMap(0),tot=P.length,f=fin(),d0=S.start<t?S.start:t,e=S.iv,n=Math.max(1,df(d0,e)),Wd=640,H=200,pl=34,pb=22,pt=10,X=k=>pl+(Wd-pl-8)*df(d0,k)/n,Y=v=>H-pb-(H-pb-pt)*Math.min(v,tot)/tot;
 let c=0,pts=[];days(d0,t).forEach(k=>{c+=m[k]||0;pts.push(X(k).toFixed(1)+','+Y(c).toFixed(1))});
 let r7=0;for(let i=0;i<7;i++)r7+=m[ad(t,-i)]||0;const av=r7/Math.min(7,df(d0,t)+1);
 return `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Total problems solved against the plan"><rect x="${X(f)}" y="${pt}" width="${X(e)-X(f)}" height="${H-pb-pt}" fill="#151515"/><text x="${X(f)+4}" y="${pt+12}" font-size="10" fill="#8e8b84">revision</text>
 <line x1="${X(d0)}" y1="${Y(0)}" x2="${X(f)}" y2="${Y(tot)}" stroke="#8e8b84" stroke-dasharray="4 3"/><line x1="${X(t)}" y1="${Y(c)}" x2="${X(f)}" y2="${Y(c+av*Math.max(0,df(t,f)))}" stroke="#d8b56a" stroke-dasharray="2 3"/>
 <polyline points="${pts.join(' ')}" fill="none" stroke="#34d399" stroke-width="2.5"/><text x="${pl-6}" y="${Y(tot)+4}" text-anchor="end" font-size="10" fill="#8e8b84">${tot}</text><text x="${pl-6}" y="${Y(0)+4}" text-anchor="end" font-size="10" fill="#8e8b84">0</text><text x="${pl}" y="${H-6}" font-size="10" fill="#8e8b84">${d0.slice(5)}</text><text x="${Wd-8}" y="${H-6}" font-size="10" fill="#8e8b84" text-anchor="end">${e.slice(5)}</text></svg>`}

// ---------- views ----------
const fm=m=>(m>=60?Math.floor(m/60)+'h ':'')+Math.round(m%60)+'m',wd=k=>pd(k).toLocaleDateString(undefined,{weekday:'long'});
function head(){const t=TD(),dd=df(t,S.iv),f=df(t,fin()),ph=t<=fin()?(f>0?f+' learning days left, then '+S.buf+' days of revision':'Last learning day, revision starts tomorrow'):dd>0?'Revision phase: redo starred problems and review-later questions':'Interview days, good luck';
 return `<header><div class="big">${Math.max(0,dd)}<small>days to interviews</small></div><p class="mu sm">Day ${Math.max(1,df(S.start,t)+1)} of your plan. ${ph}.</p></header><nav>${[['today','Today'],['prob','Problems'],['set','Settings']].map(x=>`<button class="${S.v==x[0]?'on':''}" data-a="tab" data-i="${x[0]}">${x[1]}</button>`).join('')}</nav>`}
const qc=(q,rv)=>{const s=S.qs[q.id],o=OQ.has(q.id);return `<div class="q"><div>${E(q.q)}</div><div class="row" style="margin-top:6px"><button class="sbtn" data-a="qo" data-i="${q.id}">${o?'Hide':'Show'} answer</button>${rv?`<button class="sbtn${S.rq[q.id]?' ok':''}" data-a="rq" data-i="${q.id}">${S.rq[q.id]?'Revised':'Mark revised'}</button>`:`<button class="sbtn${s=='known'?' ok':''}" data-a="qr" data-i="${q.id}:known">Got it</button><button class="sbtn${s=='review'?' cu':''}" data-a="qr" data-i="${q.id}:review">Review later</button>`}</div>${o?`<p class="ans">${E(q.a)}</p>`:''}</div>`};
const topic=(x,i)=>{const dn=S.td[x.id],qs=QM[x.id]||[],k='k'+x.id;return `<div class="card"><div class="row"><h3 class="grow">${E(x.t)}</h3><span class="tag">${E(x.g)}</span></div><div class="row" style="margin:8px 0"><a class="btn" target="_blank" rel="noopener" href="${yt(x.y)}">Watch</a><a class="btn" target="_blank" rel="noopener" href="${gg(x.s)}">Read</a></div>
<details data-k="${k}" ${(OPS[k]??i==0)?'open':''}><summary>Key points</summary><ul>${x.k.split(';').map(a=>`<li>${B(a)}</li>`).join('')}</ul><p class="trap"><b>Common mistake.</b> ${B(x.m)}</p><p><b>Asked as.</b> ${B(x.a)}</p></details>
${qs.length?`<b>Check yourself</b>${qs.map(q=>qc(q)).join('')}`:''}<div class="row" style="margin-top:10px"><button class="${dn?'ok':'pri'}" data-a="ld" data-i="${x.id}">${dn?'Learned (undo)':'Mark learned'}</button>${dn?'':`<button data-a="sk" data-i="${x.id}">Skip to tomorrow</button>`}</div></div>`};
const prow=(p,rv)=>{const dn=(rv?S.rp:S.pd)[p.id];return `<div class="pr${dn?' dn':''}"><input type="checkbox" data-a="pd" data-i="${p.id}" ${dn?'checked':''} aria-label="Solved ${E(p.n)}"><a class="pn" target="_blank" rel="noopener" href="${lc(p)}">${E(p.n)}</a><span class="tag ${p.d}">${p.d}</span><a class="tag" target="_blank" rel="noopener" href="${yt('NeetCode '+p.n)}">video</a>${p.co?`<span class="mu sm">${[...p.co].slice(0,3).map(c=>COMP[c]).join(', ')}</span>`:''}<button class="star${S.st[p.id]?' on':''}" data-a="st" data-i="${p.id}" aria-label="Star to revise">★</button>${dn?'':`<button class="sbtn" data-a="sk" data-i="${p.id}">Skip</button>`}</div>`};
function vToday(){const t=TD(),tm=ad(t,1),X=plan(t),rv=t>fin(),A=X.l,Pp=X.p,Q=X.q,off=S.off[t],av=hrs(t)*60,got=Pp.sd+(S.ex[t]||0),pc=pace(),st=streak(),
 mins=(A?A.open.reduce((a,x)=>a+30+5*(QM[x.id]||[]).length,0):0)+(Q?Q.open.length*5:0)+Pp.open.length*S.mpp;
 const nx=[A&&A.nxt.length?'learn '+E(A.nxt[0].t):'',Pp.T1?'solve '+Pp.T1+' problem'+(Pp.T1==1?'':'s')+(Pp.carry?', '+Pp.carry+' of them carried over from today':''):''].filter(Boolean);
 return `<section class="card${mins>av*1.15&&av?' warn':''}"><div class="row"><h3 class="grow">Today, ${wd(t)}</h3><button class="sbtn" data-a="off" data-i="t">${off?'Undo rest day':'Take today off'}</button></div>
 ${off?'<p>Rest day. Nothing is due and your plan spreads over the other days.</p>':`<p class="mu sm">About ${fm(mins)} planned of your ${fm(av)}. ${mins>av*1.15?'That is more than your time, so skip what you must. ':''}Anything you skip moves to tomorrow and the days after rebalance.</p>`}
 <div class="stats"><div class="st"><b>${got}/${Pp.T0}</b><span>problems today</span></div>${A?`<div class="st"><b>${A.sd}/${A.T0}</b><span>topics today</span></div>`:`<div class="st"><b>${Q.sd}/${Q.T0}</b><span>questions revised</span></div>`}<div class="st"><b>${pc>1?'+'+pc:pc<-1?pc:'On plan'}</b><span>${pc>1?'problems ahead of plan':pc<-1?'problems behind plan':'versus plan'}</span></div><div class="st"><b>${st}</b><span>day streak</span></div></div></section>
 ${off?'':(A?(A.open.length?A.open.map(topic).join(''):`<div class="card"><p>${A.un.length?'Today\'s topic is done.':'All topics are learned. Spend the time on problems.'}</p></div>`)+(A.un.length>A.open.length?`<p><button data-a="mo" data-i="l:1">Add another topic</button></p>`:''):`<div class="card"><h3>Review-later questions</h3>${Q.open.length?Q.open.map(q=>qc(q,1)).join(''):'<p class="mu">Nothing left to revise today.</p>'}</div>`)}
 ${off?'':`<div class="card"><div class="row"><h3 class="grow">${rv?'Redo starred problems':'Problems'}</h3><button class="pri" data-a="tab" data-i="prob">Open Problems page</button></div><div class="bar"><i style="width:${Math.min(100,Pp.T0?got/Pp.T0*100:100)}%"></i></div><p class="mu sm">${Pp.open.length} left today.</p></div>`}
 <div class="card"><h3>Tomorrow, ${wd(tm)}</h3><p>${S.off[tm]?'Rest day.':nx.length?'You will '+nx.join(' and ')+'.':'Nothing planned yet.'}</p><button class="sbtn" data-a="off" data-i="m">${S.off[tm]?'Undo rest day':'Take tomorrow off'}</button></div>`}
function vProb(){const t=TD(),X=plan(t),p=X.p,rv=t>fin(),dm=rv?S.rp:S.pd,done=P.filter(x=>dm[x.id]==t),sk=S.sk[t]||{},skl=p.un.filter(x=>sk[x.id]),ex=S.ex[t]||0,got=p.sd+ex,m=solvedMap(0),
 tot=Object.values(m).reduce((a,b)=>a+b,0),inl=P.filter(x=>S.pd[x.id]).length,rem=P.length-inl;let r7=0;for(let i=0;i<7;i++)r7+=m[ad(t,-i)]||0;const av=r7/7,eta=av>0?ad(t,Math.ceil(rem/av)):null;
 const cats=[...new Set(p.open.map(x=>x.c))].filter(c=>D.PAT[c]).slice(0,2);
 return `<section class="card"><div class="stats"><div class="st"><b>${got}</b><span>solved today</span></div><div class="st"><b>${p.T0}</b><span>target today</span></div><div class="st"><b>${p.open.length}</b><span>left to do</span></div><div class="st"><b>${p.T1}</b><span>planned tomorrow${p.carry?', '+p.carry+' carried over':''}</span></div></div><div class="bar"><i style="width:${Math.min(100,p.T0?got/p.T0*100:100)}%"></i></div>
 <div class="row"><button data-a="mo" data-i="p:3">Show 3 more problems</button><button data-a="ex" data-i="1">+1 solved elsewhere</button>${ex?`<button class="sbtn" data-a="ex" data-i="-1">Undo one</button>`:''}</div>${ex?`<p class="mu sm">${ex} solved outside the list today.</p>`:''}</section>
 <section class="card"><h3>${rv?'Redo today':'Today\'s problems'}</h3>${S.off[t]?'<p class="mu">Rest day.</p>':done.concat(p.open).map(x=>prow(x,rv)).join('')||'<p class="mu">Nothing left. Tap Show 3 more problems if you want to keep going.</p>'}${cats.map(c=>`<div class="pat"><b>${E(c)}:</b> ${E(D.PAT[c])}</div>`).join('')}
 ${skl.length?`<h3 style="margin-top:12px">Skipped, moved to tomorrow</h3>${skl.map(x=>`<div class="pr"><span class="pn">${E(x.n)}</span><button class="sbtn" data-a="un" data-i="${x.id}">Do it today</button></div>`).join('')}`:''}
 <h3 style="margin-top:12px">Tomorrow</h3><p class="mu">${p.nxt.length?p.nxt.slice(0,6).map(x=>E(x.n)).join(', ')+(p.nxt.length>6?' and '+(p.nxt.length-6)+' more':''):'Nothing planned.'}</p></section>
 <section class="card"><h3>Solved per day</h3><p class="mu sm">Green bars are solved, the white mark is that day's target, the dashed bar is tomorrow's plan.</p>${chBars()}</section>
 <section class="card"><h3>Total progress</h3><p class="mu sm">Green is you, grey is the plan, gold is where today's pace takes you.</p>${chCum()}<div class="stats"><div class="st"><b>${inl}/${P.length}</b><span>problems solved</span></div><div class="st"><b>${tot-inl>0?tot:inl}</b><span>solved in total</span></div><div class="st"><b>${av.toFixed(1)}</b><span>a day this week</span></div></div><p class="mu sm">${eta?'At this pace the list is finished on '+eta+(eta<=fin()?', before revision starts.':', after revision starts. Solve more or shorten revision.'):'Solve a few problems to see your finish date.'}</p></section>
 <section class="card"><h3>By topic</h3>${[...new Set(P.map(x=>x.c))].map(c=>{const a=P.filter(x=>x.c==c),d=a.filter(x=>S.pd[x.id]).length;return `<div class="row sm"><span class="grow">${E(c)}</span><span class="mu">${d}/${a.length}</span></div><div class="bar"><i style="width:${d/a.length*100}%"></i></div>`}).join('')}</section>`}
function vSet(){const f=(k,l,ty)=>`<label class="f">${l}<input type="${ty}" data-s="${k}" value="${E(S[k])}" ${ty=='number'?'min="0" step="0.5"':''}></label>`;
 return `<div class="card"><h3>Plan settings</h3><div class="fg">${f('start','Plan start date','date')}${f('iv','First interview date','date')}${f('buf','Revision days before interview','number')}${f('hw','Weekday study hours','number')}${f('hwe','Weekend study hours','number')}${f('mpp','Minutes per problem','number')}</div><p class="mu sm">Changing a value re-spreads the remaining work over the days left.</p></div>
 <div class="card"><h3>Backup</h3><p class="mu sm">Progress is stored in this browser only. Download a backup before clearing browser data or moving the file.</p><div class="row"><button class="pri" data-a="exp">Download backup</button><input type="file" id="imf" accept=".json"><button data-a="imp">Restore backup</button></div></div>
 <div class="card"><h3>Use it like an app on Windows</h3><p class="mu sm">In Brave open the menu, choose Save and share, then Create shortcut, and tick Open as window.</p></div><div class="card"><h3>Start over</h3><button data-a="rst">Reset all progress</button></div>`}

// ---------- actions ----------
function act(a,i){const t=TD(),rv=t>fin(),tg2=(o,k,v)=>{if(o[k])delete o[k];else o[k]=v};
 if(a=='tab'){S.v=i;TOP=true}else if(a=='pd')tg2(rv?S.rp:S.pd,i,t);else if(a=='ld')tg2(S.td,i,t);else if(a=='st')tg2(S.st,i,1);
 else if(a=='sk')(S.sk[t]=S.sk[t]||{})[i]=1;else if(a=='un')delete(S.sk[t]||{})[i];
 else if(a=='mo'){const[k,n]=i.split(':');S.mo[t+k]=(S.mo[t+k]||0)+ +n}
 else if(a=='ex'){const v=Math.max(0,(S.ex[t]||0)+ +i);if(v)S.ex[t]=v;else delete S.ex[t]}
 else if(a=='off'){const k=i=='t'?t:ad(t,1);tg2(S.off,k,1)}
 else if(a=='qo'){OQ.has(i)?OQ.delete(i):OQ.add(i)}else if(a=='qr'){const[id,s]=i.split(':');if(S.qs[id]==s)delete S.qs[id];else S.qs[id]=s}else if(a=='rq')tg2(S.rq,i,t);
 else if(a=='exp'){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='sde-plan-backup.json';l.click();return}
 else if(a=='imp'){const f=$('#imf').files[0];if(!f){alert('Choose a .json backup file first.');return}const r=new FileReader();r.onload=()=>{try{S=Object.assign(DEF(),JSON.parse(r.result));R()}catch(e){alert('That is not a valid backup file.')}};r.readAsText(f);return}
 else if(a=='rst'){if(confirm('Reset all progress? This cannot be undone.'))S=DEF();else return}
 R()}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(b&&!(b.tagName=='INPUT'))act(b.dataset.a,b.dataset.i)});
document.addEventListener('change',ev=>{const b=ev.target;if(b.dataset.s){S[b.dataset.s]=b.type=='number'?+b.value:b.value;R()}else if(b.type=='checkbox'&&b.dataset.a)act(b.dataset.a,b.dataset.i)});
document.addEventListener('toggle',ev=>{const k=ev.target.dataset&&ev.target.dataset.k;if(k)OPS[k]=ev.target.open},true);
function R(){const y=scrollY;$('#app').innerHTML=head()+({today:vToday,prob:vProb,set:vSet}[S.v]||vToday)();save();scrollTo(0,TOP?0:y);TOP=false}
R();
</script></body></html>
